    <script>
        document.addEventListener('DOMContentLoaded', function () {
            var root = document.getElementById('bkai');
            if (!root || !window.BKAITutor) return;
            var subject = '';
            try {
                var params = new URLSearchParams(window.location.search);
                subject = params.get('subject') || '';
            } catch (e) { }
            var context = window.BKAITutor.pageContext();
            if (subject) context.subject = subject;
            window.BKAITutor.mount(root, { context: context });
        });
    </script>
