[package]
name = "bakhi-backend"
version = "8.7.1"
edition = "2021"
rust-version = "1.85"
description = "Bá Khí — Rust hybrid backend (API + AI Gateway)"
license = "UNLICENSED"

[lib]
name = "bakhi_backend"
path = "src/lib.rs"

[[bin]]
name = "bakhi-backend"
path = "src/main.rs"

[dependencies]
axum = { version = "0.8", features = ["json", "query"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "signal", "time"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["cors", "trace", "limit", "timeout"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
uuid = { version = "1", features = ["v4"] }
# 8.6.2: băm token phiên quản trị (SHA-256) để đối chiếu admin_sessions.
sha2 = "0.10"

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
