name: Quality Check

# Cổng chất lượng bắt buộc trước khi triển khai.
# Tái sử dụng toàn bộ bộ QA có sẵn trong tools/qa/ — không viết lại bài kiểm tra trùng.
#
#   - Toàn vẹn nội dung giáo dục (content-integrity)
#   - Cú pháp JavaScript + JSON
#   - Cấu hình Supabase ↔ Edge Function (supabase-config)
#   - version-audit (đường dẫn, cache busting, phiên bản đồng nhất)
#   - QA tĩnh theo phiên bản: 8.5.5/8.5.6 UI, 8.6.2 observability, 8.7.1 runtime,
#     8.7.3 cache, 8.7.4/8.8.0 AI pipeline + Parallel Engine (v874-pipeline)
#   - 17 smoke test DOM (jsdom + typescript)
#     11 cổng hồi quy 8.0.0–8.1.1 + 6 cổng Learning Intelligence 8.2.0
#     + 5 cổng Gamification 8.3.0–8.3.1 (progress loader, điều hướng, XP, bảo mật)
#     + 4 cổng 8.3.5–8.3.6 (đồng bộ avatar, thành tích/Boss, sinh mã, tab Gamification)
#     + 1 cổng 8.3.7 (tìm học sinh trong tab Gamification)
#
# Bất kỳ bước nào thất bại → workflow Failed, log chỉ rõ bài kiểm tra hỏng.

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - '**.js'
      - '**.css'
      - '**.sql'
      - '**.json'
      - '**.yml'
      - '**.md'
      - 'supabase/**'
      - 'tools/**'
  pull_request:
    paths:
      - '**.html'
      - '**.js'
      - '**.css'
      - '**.sql'
      - '**.json'
      - '**.yml'
      - '**.md'
      - 'supabase/**'
      - 'tools/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-check-${{ github.ref }}
  cancel-in-progress: true

env:
  # jsdom + typescript được cài ngoài repo (không commit node_modules).
  QA_DEPS: /tmp/bktest
  NODE_PATH: /tmp/bktest/node_modules

jobs:
  quality:
    name: Kiểm tra chất lượng
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Node.js LTS
        uses: actions/setup-node@v4
        with:
          # Ghim Node 22 LTS + jsdom 31.0.1: jsdom mới nhất đổi hành vi DOM so với các bản
          # trước (smoke test dựng giao diện thật sẽ hỏng), còn jsdom cũ kéo theo phụ thuộc
          # chỉ có ESM nên Node 20 `require()` không nạp được. Bộ đôi này đã chạy xanh
          # toàn bộ 17 smoke test (11 cũ + 6 Learning Intelligence).
          node-version: '22'

      - name: Cài công cụ QA (jsdom, typescript)
        run: npm install --prefix "$QA_DEPS" --no-save jsdom@31.0.1 typescript@5.6.3

      - name: Toàn vẹn nội dung giáo dục
        run: node tools/content-integrity.js verify

      - name: Cú pháp JavaScript
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            if ! node --check "$f"; then
              echo "::error file=$f::Cú pháp JavaScript không hợp lệ"
              fail=1
            fi
          done < <(git ls-files '*.js')
          exit "$fail"

      - name: Cú pháp JSON
        run: |
          set -euo pipefail
          fail=0
          while IFS= read -r f; do
            if ! node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))' "$f"; then
              echo "::error file=$f::JSON không hợp lệ"
              fail=1
            fi
          done < <(git ls-files '*.json')
          exit "$fail"

      - name: Cấu hình Supabase và Edge Functions
        run: node tools/qa/supabase-config.js

      - name: Version audit
        run: node tools/qa/version-audit.js

      # QA tĩnh theo phiên bản: không cần jsdom, không gọi mạng. Các cổng này
      # bắt hồi quy hợp đồng giao diện (8.5.5/8.5.6), observability (8.6.2) và
      # runtime/config (8.7.1) mà bộ smoke DOM không phủ.
      - name: QA tĩnh theo phiên bản
        run: |
          set -euo pipefail
          for t in v855-ui v856-ui v862-observability v871-runtime v873-cache \
                   v874-pipeline; do
            echo "::group::$t"
            node "tools/qa/$t.js"
            echo "::endgroup::"
          done

      # So phiên bản ?v=, Cargo ↔ website và chỉ mục bài học tự sinh. Các bước
      # này trước đây chỉ chạy tay trước khi push nên dễ lọt hồi quy.
      - name: Đồng bộ phiên bản & chỉ mục
        run: |
          set -euo pipefail
          node tools/bump-version.js --check
          node tools/build-search-index.js --check

      - name: Smoke test DOM
        run: |
          set -euo pipefail
          for t in smoke cloud-smoke shell-smoke dev-smoke badges-smoke \
                   chat-smoke admin-smoke report-smoke founder-smoke \
                   maintenance-smoke studio-smoke \
                   mistake-notebook-smoke learning-analytics-smoke \
                   study-planner-smoke revision-engine-smoke \
                   learning-data-integrity learning-sync-smoke \
                   gamification-smoke gamification-progress-load-smoke \
                   gamification-navigation-smoke xp-level-integrity \
                   gamification-security-smoke avatar-sync-smoke \
                   v835-code-generator founder-achievement-smoke \
                   v836-founder-gamification v837-founder-search \
                   v838-gamification search-index-smoke; do
            echo "::group::$t"
            node "tools/qa/$t.js"
            echo "::endgroup::"
          done

      - name: Tổng hợp
        if: always()
        run: |
          {
            echo "### Quality Check"
            echo ""
            echo "| Hạng mục | Nguồn |"
            echo "|---|---|"
            echo "| Toàn vẹn nội dung | \`tools/content-integrity.js\` |"
            echo "| Cú pháp JS/JSON | \`node --check\`, \`JSON.parse\` |"
            echo "| Cấu hình Supabase | \`tools/qa/supabase-config.js\` |"
            echo "| Phiên bản / cache busting | \`tools/qa/version-audit.js\` |"
            echo "| QA tĩnh theo phiên bản | v855-ui, v856-ui, v862-observability, v871-runtime, v873-cache, v874-pipeline |"
            echo "| Đồng bộ phiên bản & chỉ mục | \`bump-version --check\`, \`build-search-index --check\` |"
            echo "| Smoke test | danh sách trong \`tools/qa/\` |"
            echo ""
            echo "Trạng thái job: **${{ job.status }}**"
          } >> "$GITHUB_STEP_SUMMARY"
