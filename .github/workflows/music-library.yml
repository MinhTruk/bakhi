name: Music → library.json

# Mỗi khi có file nhạc mới trong music/, quét lại và commit music/library.json
# để Music Player tự thêm bài mà không phải sửa mã nguồn.

on:
  push:
    branches: [main]
    paths:
      - 'music/**'
      - 'tools/music-scan.js'
      - '.github/workflows/music-library.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: music-library
  cancel-in-progress: false

jobs:
  scan:
    name: Quét music/*.mp3
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Cài Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cập nhật library.json
        run: node tools/music-scan.js

      - name: Commit nếu có thay đổi
        run: |
          if [ -z "$(git status --porcelain -- music/library.json)" ]; then
            echo "music/library.json không đổi."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add music/library.json
          git commit -m "chore(music): cập nhật thư viện nhạc tự động"
          git push origin HEAD:main
