name: Rust Backend

# Chỉ chạy khi backend hoặc workflow này thay đổi — không làm chậm pipeline frontend.
on:
  push:
    branches: [main]
    paths:
      - 'rust-backend/**'
      - '.github/workflows/rust-backend.yml'
  pull_request:
    paths:
      - 'rust-backend/**'
      - '.github/workflows/rust-backend.yml'
  workflow_dispatch:

concurrency:
  group: rust-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-backend
    steps:
      - uses: actions/checkout@v4

      - name: Cài Rust ổn định
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-backend

      - name: Kiểm tra định dạng
        run: cargo fmt --all -- --check

      - name: Clippy (không bỏ qua cảnh báo)
        run: cargo clippy --all-targets -- -D warnings

      - name: Kiểm thử
        run: cargo test --all-targets

      - name: Kiểm tra build release
        run: cargo build --release

      - name: Kiểm tra Cargo.lock không lệch
        run: cargo metadata --locked --format-version 1 > /dev/null

  docker:
    name: build Docker image
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Build image (không push)
        run: docker build -t bakhi-backend:ci ./rust-backend

      - name: Chạy thử container và gọi /health
        run: |
          docker run -d --name bakhi-ci -p 8080:8080 \
            -e SUPABASE_URL=https://example.supabase.co \
            -e SUPABASE_PUBLISHABLE_KEY=ci-placeholder-key \
            bakhi-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health > /tmp/health.json; then
              cat /tmp/health.json
              docker rm -f bakhi-ci
              exit 0
            fi
            sleep 1
          done
          echo "Container không trả lời /health"
          docker logs bakhi-ci
          docker rm -f bakhi-ci
          exit 1
