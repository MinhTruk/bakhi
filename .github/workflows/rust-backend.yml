name: Rust Backend

# Chỉ chạy khi backend hoặc workflow này thay đổi — không làm chậm pipeline frontend.
on:
  push:
    branches: [main]
    paths:
      - 'rust-backend/**'
      - '.github/workflows/rust-backend.yml'
  pull_request:
    paths:
      - 'rust-backend/**'
      - '.github/workflows/rust-backend.yml'
  workflow_dispatch:

concurrency:
  group: rust-backend-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: fmt · clippy · unit + integration
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust-backend
    steps:
      - uses: actions/checkout@v4

      - name: Cài Rust ổn định
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-backend

      - name: Kiểm tra định dạng
        run: cargo fmt --all -- --check

      - name: Clippy (không bỏ qua cảnh báo)
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Kiểm thử toàn bộ
        run: cargo test --all-targets

      - name: Kiểm tra Cargo.lock không lệch
        run: cargo metadata --locked --format-version 1 > /dev/null

  contract:
    name: contract tests (Rust ↔ Edge Function)
    runs-on: ubuntu-latest
    needs: check
    defaults:
      run:
        working-directory: rust-backend
    steps:
      - uses: actions/checkout@v4

      - name: Cài Rust ổn định
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-backend

      # Golden fixtures trong tests/fixtures/ — không cần Supabase hay khoá AI thật.
      - name: Chạy nhóm contract & resilience
        run: |
          cargo test --test api_contract_tests
          cargo test --test ai_gateway_tests
          cargo test --test fallback_tests
          cargo test --test circuit_breaker_tests
          cargo test --test auth_tests
          cargo test --test error_handling_tests
          cargo test --test concurrency_tests
          cargo test --test health_tests
          cargo test --test learning_stats_tests

  security:
    name: secret & dependency scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Quét khoá bí mật đã commit
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Cài cargo-audit
        run: cargo install cargo-audit --locked

      - name: Kiểm tra lỗ hổng phụ thuộc
        working-directory: rust-backend
        run: cargo audit

  build:
    name: release build + Docker image
    runs-on: ubuntu-latest
    needs: [check, contract]
    defaults:
      run:
        working-directory: rust-backend
    steps:
      - uses: actions/checkout@v4

      - name: Cài Rust ổn định
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust-backend

      - name: Build release
        run: cargo build --release --locked

      - name: Build image (không push)
        working-directory: .
        run: docker build -t bakhi-backend:ci ./rust-backend

      - name: Kiểm tra image và graceful shutdown
        working-directory: .
        run: |
          docker run -d --name bakhi-ci -p 8080:8080 \
            -e SUPABASE_URL=https://example.supabase.co \
            -e SUPABASE_PUBLISHABLE_KEY=ci-placeholder-key \
            -e SHUTDOWN_GRACE_MS=5000 \
            bakhi-backend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health > /tmp/health.json; then
              break
            fi
            sleep 1
          done
          cat /tmp/health.json || true
          # /ready phải trả 503 (Supabase giả lập không tồn tại) nhưng vẫn có envelope.
          curl -s -o /tmp/ready.json -w '%{http_code}' http://127.0.0.1:8080/api/v1/ready | grep -q 503
          cat /tmp/ready.json
          # SIGTERM phải dừng container trong hạn chờ, không treo tới timeout của Docker.
          docker stop --time 15 bakhi-ci
          docker logs bakhi-ci | tail -20
          docker rm -f bakhi-ci
