    <script>
        const rawMcqData = [
            { id: 1, q: "[Bài 3] Sau thắng lợi của Cách mạng tháng Mười Nga (1917), nhiệm vụ hàng đầu của Chính quyền Xô viết là", a: "đập tan bộ máy nhà nước cũ, xây dựng nhà nước mới của những người lao động", o: ["đập tan bộ máy nhà nước cũ, xây dựng nhà nước mới của những người lao động", "huy động tối đa nhân tài, vật lực để phục vụ cho cuộc chiến đấu bảo vệ Tổ quốc", "khôi phục kinh tế, hàn gắn vết thương chiến tranh và bảo vệ Tổ quốc", "ban hành Hiến pháp mới và chiến đấu chống “thù trong giặc ngoài”"], exp: "Nhiệm vụ hàng đầu là đập tan bộ máy nhà nước cũ, xây dựng nhà nước mới." },
            { id: 2, q: "[Bài 3] Đại hội Xô viết toàn Nga lần Thứ hai, khai mạc đêm 25/10/1917 đã", a: "tuyên bố thành lập Chính quyền Xô viết do Lê-nin đứng đầu", o: ["ban hành “Chính sách Cộng sản thời chiến”", "phát động cuộc chiến đấu chống “thù trong giặc ngoài”", "thông qua “Chính sách kinh tế mới” do Lê-nin soạn thảo", "tuyên bố thành lập Chính quyền Xô viết do Lê-nin đứng đầu"], exp: "Đại hội tuyên bố thành lập Chính quyền Xô viết do Lê-nin đứng đầu." },
            { id: 3, q: "[Bài 3] Ở Nga, Chính quyền Xô viết do Lê-nin đứng đầu được thành lập vào năm nào?", a: "Năm 1917", o: ["Năm 1917", "Năm 1918", "Năm 1919", "Năm 1922"], exp: "Thành lập năm 1917 (tháng 10/1917)." },
            { id: 4, q: "[Bài 3] Khi mới thành lập, Liên Xô gồm 4 nước Cộng hoà Xô viết là", a: "Nga, U-crai-na, Bê-lô-rút-xi-a và Ngoại Cáp-ca-dơ", o: ["Nga, U-crai-na, Bê-lô-rút-xi-a và Lít-va", "Nga, U-crai-na, Bê-lô-rút-xi-a và Ngoại Cáp-ca-dơ", "Nga, U-crai-na, Môn-đô-va và Lát-vi-a", "Nga, U-crai-na, Tuốc-mê-ni-xtan và Ác-mê-ni-a"], exp: "4 nước đầu tiên gồm Nga, U-crai-na, Bê-lô-rút-xi-a và Ngoại Cáp-ca-dơ." },
            { id: 5, q: "[Bài 3] Nội dung nào dưới đây không phải là tư tưởng chỉ đạo của Lê-nin trong việc thành lập Liên bang Cộng hoà xã hội chủ nghĩa Xô viết?", a: "Dùng bạo lực để xây dựng nền chuyên chính vô sản", o: ["Sự bình đẳng về mọi mặt giữa các dân tộc", "Quyền dân tộc tự quyết của các dân tộc", "Xây dựng một cộng đồng anh em giữa các dân tộc", "Dùng bạo lực để xây dựng nền chuyên chính vô sản"], exp: "Tư tưởng chỉ đạo tập trung vào bình đẳng, tự quyết và đoàn kết anh em." },
            { id: 6, q: "[Bài 3] Liên bang Cộng hoà xã hội chủ nghĩa Xô viết được thành lập vào thời gian nào?", a: "Tháng 12/1922", o: ["Tháng 3/1921", "Tháng 12/1922", "Tháng 3/1923", "Tháng 1/1924"], exp: "Tháng 12/1922, Liên Xô chính thức được thành lập." },
            { id: 7, q: "[Bài 3] Trong những năm 1918 - 1921, nhân dân Nga Xô viết đã tiến hành", a: "cuộc chiến đấu chống thù trong, giặc ngoài", o: ["chính sách kinh tế mới do Lê-nin soạn thảo", "xây dựng cơ sở vật chất của chủ nghĩa xã hội", "cuộc chiến đấu chống thù trong, giặc ngoài", "tiến hành Chiến tranh Vệ quốc chống lại phát xít Đức"], exp: "Giai đoạn 1918 - 1921 là cuộc chiến chống thù trong giặc ngoài." },
            { id: 8, q: "[Bài 3] Sự kiện nào dưới đây đánh dấu mốc hoàn thành của quá trình thành lập Nhà nước Liên bang Cộng hòa xã hội chủ nghĩa Xô viết?", a: "Bản Hiến pháp đầu tiên của Liên Xô được thông qua (tháng 1/1924)", o: ["Nước Nga Xô viết thực hiện chính sách kinh tế mới (tháng 3/1921)", "Bản Hiệp ước Liên bang được thông qua (tháng 12/1922)", "Tuyên ngôn thành lập Liên bang Xô viết được thông qua (tháng 12/1922)", "Bản Hiến pháp đầu tiên của Liên Xô được thông qua (tháng 1/1924)"], exp: "Hiến pháp đầu tiên (1/1924) đánh dấu hoàn thành quá trình thành lập." },
            { id: 9, q: "[Bài 3] Sự ra đời của chính quyền Xô viết ở Nga gắn liền với sự kiện nào sau đây?", a: "Cách mạng tháng Mười ở Nga thành công (1917)", o: ["Cách mạng tháng Hai ở Nga thành công (1917)", "Cách mạng tháng Mười ở Nga thành công (1917)", "Chính sách Cộng sản thời chiến được ban hành (1919)", "Chính sách Kinh tế mới (NEP) được ban hành (1921)"], exp: "Gắn liền với thắng lợi của Cách mạng tháng Mười Nga." },
            { id: 10, q: "[Bài 3] Mục tiêu của việc thành lập Nhà nước Liên bang Cộng hòa xã hội chủ nghĩa Xô viết là", a: "hợp tác, giúp đỡ lẫn nhau để cùng phát triển", o: ["chống lại sự tấn công của 14 nước đế quốc", "thực hiện hiệu quả Chính sách Kinh tế mới", "hợp tác, giúp đỡ lẫn nhau để cùng phát triển", "chống lại cuộc tấn công của phát xít Đức"], exp: "Mục tiêu là hợp tác và giúp đỡ lẫn nhau." },
            { id: 11, q: "[Bài 3] Cuộc Cách mạng tháng Mười Nga (1917) thành công dưới sự lãnh đạo của chính đảng nào sau đây?", a: "Đảng Bôn-sê-vích", o: ["Đảng Xã hội", "Đảng Bôn-sê-vích", "Đảng Men-sê-vích", "Đảng Cộng hòa"], exp: "Dưới sự lãnh đạo của Đảng Bôn-sê-vích." },
            { id: 12, q: "[Bài 3] Năm 1924, Bản Hiến pháp đầu tiên của Liên Xô được thông qua đã", a: "hoàn thành quá trình thành lập nhà nước Liên Xô", o: ["hoàn thành quá trình thành lập nhà nước Liên Xô", "kết thúc cuộc chiến tranh bảo vệ tổ quốc Liên Xô", "hoàn thành giải quyết yêu cầu hòa bình cho nhân dân", "giải quyết triệt để vấn đề ruộng đất cho nông dân"], exp: "Hiến pháp 1924 hoàn thành quá trình lập nhà nước Liên Xô." },
            { id: 13, q: "[Bài 3] Đến năm 1940, Liên Xô gồm bao nhiêu nước cộng hoà?", a: "15", o: ["7", "15", "25", "39"], exp: "Đến năm 1940, Liên Xô gồm 15 nước cộng hoà." },
            { id: 14, q: "[Bài 3] Đối với Liên Xô, sự ra đời của Liên bang Cộng hoà xã hội chủ nghĩa Xô viết có ý nghĩa như thế nào?", a: "Tạo điều kiện để các nước cộng hòa phát triển kinh tế - xã hội", o: ["Tạo điều kiện để các nước cộng hòa phát triển kinh tế - xã hội", "Chứng minh tính khoa học, đúng đắn của học thuyết Mác - Lênin", "Cổ vũ phong trào giải phóng dân tộc của nhân dân các nước thuộc địa", "Để lại bài học kinh nghiệm về mô hình nhà nước sau khi giành chính quyền"], exp: "Ý nghĩa trong nước quan trọng đối với sự phát triển kinh tế - xã hội." },
            { id: 15, q: "[Bài 3] Nội dung nào sau đây không phản ánh đúng ý nghĩa sự ra đời của Liên bang Cộng hoà xã hội chủ nghĩa Xô viết đối với Liên Xô?", a: "Cổ vũ phong trào giải phóng dân tộc ở các nước thuộc địa", o: ["Giải quyết đúng đắn vấn đề dân tộc trên đất nước Xô viết", "Cổ vũ phong trào giải phóng dân tộc ở các nước thuộc địa", "Củng cố và tăng cường vị thế của Liên Xô trên trường quốc tế", "Tạo điều kiện để các nước cộng hòa phát triển kinh tế - xã hội"], exp: "Cổ vũ phong trào GPDT là ý nghĩa quốc tế, không phải ý nghĩa trong nước trực tiếp." },
            { id: 16, q: "[Bài 3] Sự ra đời của Liên bang Cộng hoà xã hội chủ nghĩa Xô viết không có ý nghĩa nào sau đây đối với nhân dân Liên Xô?", a: "Làm cho chủ nghĩa xã hội phát triển trở thành hệ thống trên thế giới", o: ["Thể hiện sức mạnh đoàn kết, giúp đỡ nhau giữa các dân tộc Xô viết", "Phù hợp với các lợi ích chung của các dân tộc trên đất nước Xô viết", "Đã tăng cường vị thế của Nhà nước Liên Xô trên trường quốc tế", "Làm cho chủ nghĩa xã hội phát triển trở thành hệ thống trên thế giới"], exp: "Trở thành hệ thống thế giới là sự kiện sau Chiến tranh thế giới thứ hai." },
            { id: 17, q: "[Bài 3] Trong giai đoạn xây dựng và bảo vệ đất nước hiện nay, Việt Nam có thể học tập điều gì từ sự ra đời của Liên bang Cộng hòa xã hội chủ nghĩa Xô viết?", a: "Tinh thần đoàn kết, hợp tác và sự giúp đỡ nhau giữa các dân tộc", o: ["Tinh thần đoàn kết, hợp tác và sự giúp đỡ nhau giữa các dân tộc", "Mở rộng, giao lưu hợp tác quốc tế để khẳng định vị thế đất nước", "Đoàn kết, hợp tác để đấu tranh chống ngoại xâm giữa các dân tộc", "Tham gia các liên minh quân sự để tăng cường sức mạnh phòng thủ"], exp: "Bài học về tinh thần đoàn kết, hợp tác giữa các dân tộc." },
            { id: 18, q: "[Bài 3] Đối với quốc tế, sự ra đời của Liên bang Cộng hoà xã hội chủ nghĩa Xô viết có ý nghĩa như thế nào?", a: "Chứng minh tính khoa học, đúng đắn của chủ nghĩa Mác - Lênin", o: ["Làm thất bại ý đồ và hành động chia rẽ của các thế lực thù địch", "Chứng minh tính khoa học, đúng đắn của chủ nghĩa Mác - Lênin", "Củng cố và tăng cường vị thế của Liên Xô trên trường quốc tế", "Tạo điều kiện để các nước cộng hòa phát triển kinh tế - xã hội"], exp: "Chứng minh tính đúng đắn của chủ nghĩa Mác - Lênin." },
            { id: 19, q: "[Bài 3] Nội dung nào sau đây phản ánh đúng ý nghĩa quốc tế từ sự ra đời của Liên bang Cộng hoà xã hội chủ nghĩa Xô viết?", a: "Cổ vũ phong trào giải phóng dân tộc của các nước thuộc địa", o: ["Làm thất bại ý đồ và hành động chia rẽ của các thế lực thù địch", "Cổ vũ phong trào giải phóng dân tộc của các nước thuộc địa", "Củng cố và tăng cường vị thế của Liên Xô trên trường quốc tế", "Tạo điều kiện để các nước cộng hòa phát triển kinh tế - xã hội"], exp: "Cổ vũ phong trào giải phóng dân tộc trên thế giới." }
        ];

        let shuffledMcq = [];
        let currentIndex = 0;
        let score = 0;

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function initQuiz() {
            shuffledMcq = shuffleArray(rawMcqData).map(item => {
                const correctVal = item.a;
                const shuffledOpts = shuffleArray(item.o);
                return { ...item, o: shuffledOpts, a: correctVal };
            });
            currentIndex = 0;
            score = 0;
            document.getElementById('progress-container').style.display = 'flex';
            renderQuestion();
        }

        function renderQuestion() {
            if (currentIndex >= shuffledMcq.length) {
                renderResult();
                return;
            }

            const item = shuffledMcq[currentIndex];
            const progressPercent = ((currentIndex + 1) / shuffledMcq.length) * 100;
            document.getElementById('question-progress').innerText = `Câu ${currentIndex + 1} / ${shuffledMcq.length}`;
            document.getElementById('progress-bar-fill').style.width = `${progressPercent}%`;

            const box = document.getElementById('quiz-box');
            box.innerHTML = `
                <div class="space-y-4">
                    <div class="font-bold text-base md:text-lg text-slate-100">
                        <span class="text-emerald-400">Câu ${currentIndex + 1}:</span> ${item.q}
                    </div>
                    <div class="grid grid-cols-1 gap-2.5" id="options-group">
                        ${item.o.map((opt, oIdx) => `
                            <button type="button" onclick="selectAnswer('${opt.replace(/'/g, "\\'")}', this)" class="w-full text-left p-3.5 bg-slate-900/80 hover:bg-slate-700/80 border border-slate-700 rounded-xl flex items-center space-x-3 text-sm transition cursor-pointer option-btn">
                                <span class="w-7 h-7 rounded-lg bg-slate-800 flex items-center justify-center font-bold text-emerald-400 border border-slate-700 text-xs">${['A', 'B', 'C', 'D'][oIdx]}</span>
                                <span class="flex-grow">${opt}</span>
                            </button>
                        `).join('')}
                    </div>
                    <div id="feedback-area" class="hidden mt-4 p-4 rounded-xl border space-y-3"></div>
                </div>
            `;
        }

        function selectAnswer(selectedOpt, btnEl) {
            const item = shuffledMcq[currentIndex];
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);

            const feedbackArea = document.getElementById('feedback-area');
            feedbackArea.classList.remove('hidden');

            const isCorrect = (selectedOpt === item.a);
            if (isCorrect) {
                score++;
                btnEl.className = "w-full text-left p-3.5 bg-emerald-950/80 border border-emerald-600 rounded-xl flex items-center space-x-3 text-sm text-emerald-200 font-semibold";
                feedbackArea.className = "mt-4 p-4 rounded-xl border bg-emerald-950/60 border-emerald-800 text-emerald-200 space-y-3";
                feedbackArea.innerHTML = `
                    <div class="flex items-center space-x-2 font-bold text-emerald-400">
                        <i class="fa-solid fa-circle-check text-lg"></i>
                        <span>Chính xác!</span>
                    </div>
                    <div class="text-xs text-slate-300 leading-relaxed"><b>Giải thích:</b> ${item.exp}</div>
                    <button type="button" onclick="nextQuestion()" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg text-xs transition inline-flex items-center space-x-2 cursor-pointer">
                        <span>Câu tiếp theo</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                `;
            } else {
                btnEl.className = "w-full text-left p-3.5 bg-rose-950/80 border border-rose-600 rounded-xl flex items-center space-x-3 text-sm text-rose-200";
                
                // Tô màu đáp án đúng
                allBtns.forEach(b => {
                    if (b.innerText.includes(item.a)) {
                        b.className = "w-full text-left p-3.5 bg-emerald-950/80 border border-emerald-600 rounded-xl flex items-center space-x-3 text-sm text-emerald-200 font-semibold";
                    }
                });

                feedbackArea.className = "mt-4 p-4 rounded-xl border bg-rose-950/60 border-rose-800 text-rose-200 space-y-3";
                feedbackArea.innerHTML = `
                    <div class="flex items-center space-x-2 font-bold text-rose-400">
                        <i class="fa-solid fa-circle-xmark text-lg"></i>
                        <span>Chưa đúng! Đáp án đúng là: <b>${item.a}</b></span>
                    </div>
                    <div class="text-xs text-slate-300 leading-relaxed"><b>Giải thích:</b> ${item.exp}</div>
                    <button type="button" onclick="nextQuestion()" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-lg text-xs transition inline-flex items-center space-x-2 cursor-pointer">
                        <span>Câu tiếp theo</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                `;
            }
        }

        function nextQuestion() {
            currentIndex++;
            renderQuestion();
        }

        function renderResult() {
            document.getElementById('progress-container').style.display = 'none';
            const box = document.getElementById('quiz-box');
            box.innerHTML = `
                <div class="text-center space-y-6 py-6">
                    <div class="w-20 h-20 bg-emerald-500/20 text-emerald-400 rounded-full flex items-center justify-center mx-auto border border-emerald-500/30 text-3xl">
                        <i class="fa-solid fa-trophy"></i>
                    </div>
                    <div class="space-y-2">
                        <h3 class="text-2xl font-bold text-white">Hoàn Thành Bài Ôn Tập!</h3>
                        <p class="text-slate-300 text-base">
                            Số câu trả lời đúng của bạn: <span class="font-bold text-emerald-400 text-xl">${score} / ${shuffledMcq.length}</span>
                        </p>
                    </div>
                    <button type="button" onclick="initQuiz()" class="px-8 py-3.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold rounded-xl shadow-lg transition duration-200 text-base inline-flex items-center space-x-2 cursor-pointer">
                        <i class="fa-solid fa-rotate-right"></i>
                        <span>Thử Lại Từ Đầu</span>
                    </button>
                </div>
            `;
        }

        window.onload = initQuiz;
    </script>
</body>
</html>
