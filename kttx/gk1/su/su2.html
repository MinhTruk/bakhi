    <script>
        const rawMcqData = [
            { id: 1, q: "[Bài 2] Thời kì xác lập chủ nghĩa tư bản là thời kỳ:", a: "Tự do cạnh tranh", o: ["Tự do cạnh tranh", "Hình thành độc quyền", "Áp bức bóc lột của chính quyền đối với giai cấp tư sản", "Áp bức đè nén của giai cấp tư sản đối với chính quyền"], exp: "Theo tài liệu ôn tập, thời kì xác lập chủ nghĩa tư bản là thời kỳ tự do cạnh tranh." },
            { id: 2, q: "[Bài 2] Chủ nghĩa đế quốc là:", a: "Hệ quả trực tiếp của quá trình xâm lược thuộc địa nhằm tìm kiếm thị trường, thu lợi nhuận và đầu tư tư bản ở nước ngoài", o: ["Hệ quả trực tiếp của quá trình xâm lược thuộc địa nhằm tìm kiếm thị trường, thu lợi nhuận và đầu tư tư bản ở nước ngoài", "Hệ quả gián tiếp của quá trình xâm lược thuộc địa nhằm tìm kiếm thị trường, thu lợi nhuận và đầu tư tư bản ở nước ngoài", "Hệ quả trực tiếp của việc tái thiết trật tự thế giới mới giữa các siêu cường", "Hệ quả gián tiếp của việc tái thiết trật tự thế giới mới giữa các siêu cường"], exp: "Chủ nghĩa đế quốc là hệ quả trực tiếp của quá trình xâm lược thuộc địa." },
            { id: 3, q: "[Bài 2] Trong số các nước đế quốc, nước nào được mệnh danh là “đế quốc mà Mặt Trời không bao giờ lặn”?", a: "Anh", o: ["Anh", "Pháp", "Mỹ", "Đức"], exp: "Đế quốc Anh được mệnh danh là đế quốc mà Mặt Trời không bao giờ lặn." },
            { id: 4, q: "[Bài 2] Đâu là một thuộc địa của Pháp?", a: "Algeria", o: ["Canada", "Ấn Độ", "Kazakhstan", "Algeria"], exp: "Algeria là một thuộc địa nổi tiếng của Pháp ở châu Phi." },
            { id: 5, q: "[Bài 2] Đầu thế kỷ XX, hệ thống thuộc địa của chủ nghĩa thực dân không được thiết lập ở", a: "châu Âu", o: ["châu Á", "châu Phi", "châu Âu", "châu Mỹ"], exp: "Châu Âu là các chính quốc tư bản, không phải là thuộc địa của chủ nghĩa thực dân." },
            { id: 6, q: "[Bài 2] “Điều quan trọng là chủ nghĩa tư bản không thể tồn tại và phát triển được nếu không thường xuyên mở rộng phạm vi thống trị của nó...” Đây là quan điểm của ai?", a: "V. I. Lenin", o: ["Hồ Chí Minh", "Karl Marx", "F. Engels", "V. I. Lenin"], exp: "Đây là quan điểm nổi tiếng của V. I. Lenin." },
            { id: 7, q: "[Bài 2] Nước nào ở khu vực Mỹ Latin là thuộc địa của Bồ Đào Nha?", a: "Brazil", o: ["Colombia", "Brazil", "Argentina", "Chile"], exp: "Brazil là thuộc địa của Bồ Đào Nha ở khu vực Mỹ Latinh." },
            { id: 8, q: "[Bài 2] Nội dung nào sau đây không phản ánh đúng vai trò của thuộc địa đối với các nước đế quốc?", a: "Là đồng minh chiến lược trong chiến tranh", o: ["Nơi cung cấp nhiên liệu và nhân công", "Thị trường đầu tư và tiêu thụ hàng hóa", "Là cơ sở phục vụ cho các cuộc chiến tranh", "Là đồng minh chiến lược trong chiến tranh"], exp: "Thuộc địa bị các nước đế quốc bóc lột, không phải là 'đồng minh chiến lược' bình đẳng." },
            { id: 9, q: "[Bài 2] Nguyên nhân trực tiếp nào đã thúc đẩy các nước đế quốc tiến hành xâm lược các nước châu Á, Phi, Mỹ Latinh?", a: "Do nhu cầu về nguyên liệu và nhân công", o: ["Do nhu cầu về nguyên liệu và nhân công", "Khát vọng chinh phục những vùng đất mới", "Thực hiện tham vọng bá chủ toàn thế giới", "Thúc đẩy sự giao lưu văn hóa các châu lục"], exp: "Do nhu cầu bức thiết về nguyên liệu và nhân công cho nền công nghiệp tư bản." },
            { id: 10, q: "[Bài 2] Ở châu Á, cuộc Duy tân Minh Trị bắt đầu từ năm 1868, đã đưa Nhật Bản:", a: "Từ một nước phong kiến trở thành nước tư bản chủ nghĩa", o: ["Từ một nước phong kiến trở thành nước vô sản chủ nghĩa", "Từ một nước phong kiến trở thành nước tư bản chủ nghĩa", "Từ một nước cộng sản chủ nghĩa trở thành một nước tư bản chủ nghĩa", "Từ một nước với chế độ quân chủ lập hiến trở thành một nước với chế độ cộng hoà tổng thống"], exp: "Duy tân Minh Trị đưa Nhật Bản từ nước phong kiến sang tư bản chủ nghĩa." },
            { id: 11, q: "[Bài 2] Cường quốc tư bản chủ nghĩa ở châu Á đầu thế kỷ XX là quốc gia nào sau đây?", a: "Nhật Bản", o: ["Nhật Bản", "Hàn Quốc", "Trung Quốc", "Mông Cổ"], exp: "Nhật Bản là cường quốc tư bản chủ nghĩa duy nhất ở châu Á đầu thế kỉ XX." },
            { id: 12, q: "[Bài 2] Tổ chức độc quyền là:", a: "Sự liên minh giữa các nhà tư bản lớn để tập trung vào tay mình phần lớn việc sản xuất hoặc tiêu thụ một số hàng hóa nhằm thu lợi nhuận cao", o: ["Một tập hợp các công ty chuyên về nghiên cứu, sản xuất các sản phẩm liên quan đến độc dược", "Một hình thức tổ chức quân sự dưới dạng liên minh các công ty kinh doanh hàng hoá nhằm củng cố cho nhà nước", "Sự liên minh giữa các nhà tư bản lớn để tập trung vào tay mình phần lớn việc sản xuất hoặc tiêu thụ một số hàng hóa nhằm thu lợi nhuận cao", "Một hình thức tổ chức quân sự dưới dạng liên minh các công ty"], exp: "Định nghĩa chính xác về tổ chức độc quyền." },
            { id: 13, q: "[Bài 2] Các nước tư bản chuyển sang giai đoạn đế quốc chủ nghĩa vào thời gian nào?", a: "Cuối thế kỉ XIX – đầu thế kỉ XX", o: ["Cuối thế kỉ XIX", "Đầu thế kỉ XX", "Cuối thế kỉ XIX – đầu thế kỉ XX", "Giữa thế kỉ XIX – cuối thế kỉ XX"], exp: "Thời điểm chuyển sang giai đoạn đế quốc chủ nghĩa là cuối thế kỉ XIX – đầu thế kỉ XX." },
            { id: 14, q: "[Bài 2] Cuối thế kỉ XIX – đầu thế kỉ XX, chủ nghĩa tư bản chuyển sang giai đoạn:", a: "Độc quyền", o: ["Tư hữu hoá sản phẩm quốc dân", "Quốc hữu hoá sản phẩm tư nhân", "Độc quyền", "Tự do cạnh tranh"], exp: "CNTB chuyển sang giai đoạn độc quyền (đế quốc chủ nghĩa)." },
            { id: 15, q: "[Bài 2] Đâu không phải một loại tổ chức độc quyền?", a: "Composition", o: ["Cartel", "Trust", "Syndicate", "Composition"], exp: "Cartel, Trust, Syndicate là các hình thức tổ chức độc quyền; Composition không phải." },
            { id: 16, q: "[Bài 2] Một trong những biểu hiện mới tiêu biểu của chủ nghĩa tư bản hiện đại là gì?", a: "Sự kết hợp giữa sức mạnh kinh tế của các tổ chức độc quyền tư nhân với sức mạnh chính trị của nhà nước tư sản", o: ["Sự kết hợp giữa sức mạnh kinh tế của các tổ chức độc quyền tư nhân với sức mạnh chính trị của nhà nước tư sản", "Sự đảm bảo công bằng tài chính và nguồn nhân lực chất lượng cao giữa các công ty lớn với các công ty nhỏ", "Sự kết hợp khoa học công nghệ hiện đại với những giá trị truyền thống được đề cao", "Sự kết hợp giữa sức mạnh kinh tế của các tổ chức độc quyền tư nhân với khoa học công nghệ hiện đại"], exp: "Biểu hiện mới tiêu biểu của CNTB hiện đại." },
            { id: 17, q: "[Bài 2] Chủ nghĩa tư bản hiện đại là thuật ngữ dùng để chỉ:", a: "Một giai đoạn phát triển của chủ nghĩa tư bản từ sau Chiến tranh thế giới thứ hai đến nay với những biểu hiện mới", o: ["Một giai đoạn phát triển của chủ nghĩa tư bản từ sau Chiến tranh Lạnh đến nay với những biểu hiện mới", "Một giai đoạn phát triển của chủ nghĩa tư bản từ sau Chiến tranh thế giới thứ hai đến nay với những biểu hiện mới", "Một chiến lược phát triển mới của chủ nghĩa tư bản...", "Những biểu hiện mới của chủ nghĩa tư bản sau khi Liên Hợp Quốc được thành lập..."], exp: "Khái niệm CNTB hiện đại tính từ sau Chiến tranh thế giới thứ hai." },
            { id: 18, q: "[Bài 2] Một trong những đóng góp tích cực của chủ nghĩa tư bản hiện đại đối với nền văn minh nhân loại là", a: "tạo ra lượng của cải vật chất khổng lồ", o: ["chế tạo thành công bom nguyên tử", "tạo ra lượng của cải vật chất khổng lồ", "gây ra hiện tượng hiệu ứng nhà kính", "khắc phục tình trạng nước biển dâng"], exp: "Tạo ra lượng của cải vật chất khổng lồ cho nhân loại." },
            { id: 19, q: "[Bài 2] Đâu không phải một thách thức mà chủ nghĩa tư bản hiện đại đang phải đối mặt?", a: "Chủ nghĩa tư bản đang dần cho thấy những yếu kém của mình trong việc kiểm soát kinh tế - xã hội và dần tỏ ra lép vế so với quá trình quá độ lên chủ nghĩa xã hội ở các nước theo chủ nghĩa xã hội", o: ["Chủ nghĩa tư bản đang phải đối mặt và khó có thể giải quyết được những cuộc khủng hoảng kinh tế, tài chính mang tính toàn cầu", "Chủ nghĩa tư bản đang dần cho thấy những yếu kém của mình trong việc kiểm soát kinh tế - xã hội và dần tỏ ra lép vế so với quá trình quá độ lên chủ nghĩa xã hội ở các nước theo chủ nghĩa xã hội", "Chủ nghĩa tư bản đã và đang phải đối mặt và không thể giải quyết được những vấn đề chính trị, xã hội nan giải", "Chủ nghĩa tư bản không có khả năng giải quyết triệt để mâu thuẫn xã hội ngày càng gia tăng..."], exp: "Đáp án B không nằm trong nhóm các thách thức thực tế được nêu trong tài liệu." },
            { id: 20, q: "[Bài 2] Từ sự phát triển kinh tế của các nước tư bản Âu - Mĩ cuối thế kỉ XIX đầu thế kỉ XX, hiện nay để tăng năng suất lao động, Việt Nam cần phải", a: "nghiên cứu, cải tiến, áp dụng khoa học - kĩ thuật vào sản xuất", o: ["nghiên cứu, cải tiến, áp dụng khoa học - kĩ thuật vào sản xuất", "tăng cường thành lập các tổ chức độc quyền để tăng cạnh tranh", "tham gia các liên minh kinh tế với các nước tư bản hùng mạnh", "nhà nước tăng cường mua các phát minh khoa học trên thế giới"], exp: "Bài học kinh nghiệm về ứng dụng khoa học kĩ thuật." }
        ];

        let shuffledMcq = [];
        let currentIndex = 0;
        let score = 0;

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function initQuiz() {
            shuffledMcq = shuffleArray(rawMcqData).map(item => {
                const correctVal = item.a;
                const shuffledOpts = shuffleArray(item.o);
                return { ...item, o: shuffledOpts, a: correctVal };
            });
            currentIndex = 0;
            score = 0;
            document.getElementById('progress-container').style.display = 'flex';
            renderQuestion();
        }

        function renderQuestion() {
            if (currentIndex >= shuffledMcq.length) {
                renderResult();
                return;
            }

            const item = shuffledMcq[currentIndex];
            const progressPercent = ((currentIndex + 1) / shuffledMcq.length) * 100;
            document.getElementById('question-progress').innerText = `Câu ${currentIndex + 1} / ${shuffledMcq.length}`;
            document.getElementById('progress-bar-fill').style.width = `${progressPercent}%`;

            const box = document.getElementById('quiz-box');
            box.innerHTML = `
                <div class="space-y-4">
                    <div class="font-bold text-base md:text-lg text-slate-100">
                        <span class="text-purple-400">Câu ${currentIndex + 1}:</span> ${item.q}
                    </div>
                    <div class="grid grid-cols-1 gap-2.5" id="options-group">
                        ${item.o.map((opt, oIdx) => `
                            <button type="button" onclick="selectAnswer('${opt.replace(/'/g, "\\'")}', this)" class="w-full text-left p-3.5 bg-slate-900/80 hover:bg-slate-700/80 border border-slate-700 rounded-xl flex items-center space-x-3 text-sm transition cursor-pointer option-btn">
                                <span class="w-7 h-7 rounded-lg bg-slate-800 flex items-center justify-center font-bold text-purple-400 border border-slate-700 text-xs">${['A', 'B', 'C', 'D'][oIdx]}</span>
                                <span class="flex-grow">${opt}</span>
                            </button>
                        `).join('')}
                    </div>
                    <div id="feedback-area" class="hidden mt-4 p-4 rounded-xl border space-y-3"></div>
                </div>
            `;
        }

        function selectAnswer(selectedOpt, btnEl) {
            const item = shuffledMcq[currentIndex];
            const allBtns = document.querySelectorAll('.option-btn');
            allBtns.forEach(b => b.disabled = true);

            const feedbackArea = document.getElementById('feedback-area');
            feedbackArea.classList.remove('hidden');

            const isCorrect = (selectedOpt === item.a);
            if (isCorrect) {
                score++;
                btnEl.className = "w-full text-left p-3.5 bg-emerald-950/80 border border-emerald-600 rounded-xl flex items-center space-x-3 text-sm text-emerald-200 font-semibold";
                feedbackArea.className = "mt-4 p-4 rounded-xl border bg-emerald-950/60 border-emerald-800 text-emerald-200 space-y-3";
                feedbackArea.innerHTML = `
                    <div class="flex items-center space-x-2 font-bold text-emerald-400">
                        <i class="fa-solid fa-circle-check text-lg"></i>
                        <span>Chính xác!</span>
                    </div>
                    <div class="text-xs text-slate-300 leading-relaxed"><b>Giải thích:</b> ${item.exp}</div>
                    <button type="button" onclick="nextQuestion()" class="px-5 py-2.5 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-lg text-xs transition inline-flex items-center space-x-2 cursor-pointer">
                        <span>Câu tiếp theo</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                `;
            } else {
                btnEl.className = "w-full text-left p-3.5 bg-rose-950/80 border border-rose-600 rounded-xl flex items-center space-x-3 text-sm text-rose-200";
                
                // Tô màu đáp án đúng
                allBtns.forEach(b => {
                    if (b.innerText.includes(item.a)) {
                        b.className = "w-full text-left p-3.5 bg-emerald-950/80 border border-emerald-600 rounded-xl flex items-center space-x-3 text-sm text-emerald-200 font-semibold";
                    }
                });

                feedbackArea.className = "mt-4 p-4 rounded-xl border bg-rose-950/60 border-rose-800 text-rose-200 space-y-3";
                feedbackArea.innerHTML = `
                    <div class="flex items-center space-x-2 font-bold text-rose-400">
                        <i class="fa-solid fa-circle-xmark text-lg"></i>
                        <span>Chưa đúng! Đáp án đúng là: <b>${item.a}</b></span>
                    </div>
                    <div class="text-xs text-slate-300 leading-relaxed"><b>Giải thích:</b> ${item.exp}</div>
                    <button type="button" onclick="nextQuestion()" class="px-5 py-2.5 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-lg text-xs transition inline-flex items-center space-x-2 cursor-pointer">
                        <span>Câu tiếp theo</span>
                        <i class="fa-solid fa-arrow-right"></i>
                    </button>
                `;
            }
        }

        function nextQuestion() {
            currentIndex++;
            renderQuestion();
        }

        function renderResult() {
            document.getElementById('progress-container').style.display = 'none';
            const box = document.getElementById('quiz-box');
            box.innerHTML = `
                <div class="text-center space-y-6 py-6">
                    <div class="w-20 h-20 bg-purple-500/20 text-purple-400 rounded-full flex items-center justify-center mx-auto border border-purple-500/30 text-3xl">
                        <i class="fa-solid fa-trophy"></i>
                    </div>
                    <div class="space-y-2">
                        <h3 class="text-2xl font-bold text-white">Hoàn Thành Bài Ôn Tập!</h3>
                        <p class="text-slate-300 text-base">
                            Số câu trả lời đúng của bạn: <span class="font-bold text-purple-400 text-xl">${score} / ${shuffledMcq.length}</span>
                        </p>
                    </div>
                    <button type="button" onclick="initQuiz()" class="px-8 py-3.5 bg-purple-600 hover:bg-purple-500 text-white font-bold rounded-xl shadow-lg transition duration-200 text-base inline-flex items-center space-x-2 cursor-pointer">
                        <i class="fa-solid fa-rotate-right"></i>
                        <span>Thử Lại Từ Đầu</span>
                    </button>
                </div>
            `;
        }

        window.onload = initQuiz;
    </script>
</body>
</html>
