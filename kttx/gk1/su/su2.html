            { id: 12, q: "[Bài 2] Tổ chức độc quyền là:", a: "Sự liên minh giữa các nhà tư bản lớn để tập trung vào tay mình phần lớn việc sản xuất hoặc tiêu thụ một số hàng hóa nhằm thu lợi nhuận cao", o: ["Một tập hợp các công ty chuyên về nghiên cứu, sản xuất các sản phẩm liên quan đến độc dược", "Một hình thức tổ chức quân sự dưới dạng liên minh các công ty kinh doanh hàng hoá nhằm củng cố cho nhà nước", "Sự liên minh giữa các nhà tư bản lớn để tập trung vào tay mình phần lớn việc sản xuất hoặc tiêu thụ một số hàng hóa nhằm thu lợi nhuận cao", "Một hình thức tổ chức quân sự dưới dạng liên minh các công ty"], exp: "Định nghĩa chính xác về tổ chức độc quyền." },

            { id: 17, q: "[Bài 2] Chủ nghĩa tư bản hiện đại là thuật ngữ dùng để chỉ:", a: "Một giai đoạn phát triển của chủ nghĩa tư bản từ sau Chiến tranh thế giới thứ hai đến nay với những biểu hiện mới", o: ["Một giai đoạn phát triển của chủ nghĩa tư bản từ sau Chiến tranh Lạnh đến nay với những biểu hiện mới", "Một giai đoạn phát triển của chủ nghĩa tư bản từ sau Chiến tranh thế giới thứ hai đến nay với những biểu hiện mới", "Một chiến lược phát triển mới của chủ nghĩa tư bản...", "Những biểu hiện mới của chủ nghĩa tư bản sau khi Liên Hợp Quốc được thành lập..."], exp: "Khái niệm CNTB hiện đại tính từ sau Chiến tranh thế giới thứ hai." },
            { id: 18, q: "[Bài 2] Một trong những đóng góp tích cực của chủ nghĩa tư bản hiện đại đối với nền văn minh nhân loại là", a: "tạo ra lượng của cải vật chất khổng lồ", o: ["chế tạo thành công bom nguyên tử", "tạo ra lượng của cải vật chất khổng lồ", "gây ra hiện tượng hiệu ứng nhà kính", "khắc phục tình trạng nước biển dâng"], exp: "Tạo ra lượng của cải vật chất khổng lồ cho nhân loại." },
            { id: 19, q: "[Bài 2] Đâu không phải một thách thức mà chủ nghĩa tư bản hiện đại đang phải đối mặt?", a: "Chủ nghĩa tư bản đang dần cho thấy những yếu kém của mình trong việc kiểm soát kinh tế - xã hội và dần tỏ ra lép vế so với quá trình quá độ lên chủ nghĩa xã hội ở các nước theo chủ nghĩa xã hội", o: ["Chủ nghĩa tư bản đang phải đối mặt và khó có thể giải quyết được những cuộc khủng hoảng kinh tế, tài chính mang tính toàn cầu", "Chủ nghĩa tư bản đang dần cho thấy những yếu kém của mình trong việc kiểm soát kinh tế - xã hội và dần tỏ ra lép vế so với quá trình quá độ lên chủ nghĩa xã hội ở các nước theo chủ nghĩa xã hội", "Chủ nghĩa tư bản đã và đang phải đối mặt và không thể giải quyết được những vấn đề chính trị, xã hội nan giải", "Chủ nghĩa tư bản không có khả năng giải quyết triệt để mâu thuẫn xã hội ngày càng gia tăng..."], exp: "Đáp án B không nằm trong nhóm các thách thức thực tế được nêu trong tài liệu." },
            { id: 20, q: "[Bài 2] Từ sự phát triển kinh tế của các nước tư bản Âu - Mĩ cuối thế kỉ XIX đầu thế kỉ XX, hiện nay để tăng năng suất lao động, Việt Nam cần phải", a: "nghiên cứu, cải tiến, áp dụng khoa học - kĩ thuật vào sản xuất", o: ["nghiên cứu, cải tiến, áp dụng khoa học - kĩ thuật vào sản xuất", "tăng cường thành lập các tổ chức độc quyền để tăng cạnh tranh", "tham gia các liên minh kinh tế với các nước tư bản hùng mạnh", "nhà nước tăng cường mua các phát minh khoa học trên thế giới"], exp: "Bài học kinh nghiệm về ứng dụng khoa học kĩ thuật." }

        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        let shuffledMcq = [];

        function initQuiz() {
            shuffledMcq = shuffleArray(rawMcqData).map(item => {
                const correctVal = item.a;
                const shuffledOpts = shuffleArray(item.o);
                return { ...item, o: shuffledOpts, a: correctVal };
            });
            renderMCQ();
        }

        function renderMCQ() {
            const container = document.getElementById('mcq-container');
            container.innerHTML = shuffledMcq.map((item, idx) => `
                <div class="p-4 bg-slate-900/60 border border-slate-700/60 rounded-xl space-y-3">
                    <div class="font-medium text-slate-100 text-sm md:text-base">
                        <span class="text-purple-400 font-bold">Câu ${idx + 1}:</span> ${item.q}
                    </div>
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-2" id="options-group-${item.id}">
                        ${item.o.map((opt, oIdx) => `
                            <label id="label-opt-${item.id}-${oIdx}" class="p-3 bg-slate-800/80 hover:bg-slate-700/80 border border-slate-700 rounded-lg flex items-center space-x-3 cursor-pointer text-xs md:text-sm transition">
                                <input type="radio" name="mcq-${item.id}" value="${opt}" class="accent-purple-500">
                                <span>${['A', 'B', 'C', 'D'][oIdx]}.${opt}</span>
                            </label>
                        `).join('')}
                    </div>
                    <div id="mcq-feedback-${item.id}" class="hidden mt-2 p-3 rounded-lg text-xs font-medium border"></div>
                </div>
            `).join('');
        }

        function checkAllAnswers() {
            let correctMCQ = 0;
            shuffledMcq.forEach(item => {
                const checkedInput = document.querySelector(`input[name="mcq-${item.id}"]:checked`);
                const feedbackEl = document.getElementById(`mcq-feedback-${item.id}`);
                feedbackEl.classList.remove('hidden');

                item.o.forEach((opt, oIdx) => {
                    const labelEl = document.getElementById(`label-opt-${item.id}-${oIdx}`);
                    const radioInput = labelEl.querySelector('input');
                    labelEl.className = "p-3 border rounded-lg flex items-center space-x-3 text-xs md:text-sm transition ";
                    if (opt === item.a) {
                        labelEl.className += "bg-emerald-950/80 border-emerald-600 text-emerald-200 font-semibold";
                    } else if (radioInput && radioInput.checked && radioInput.value !== item.a) {
                        labelEl.className += "bg-rose-950/80 border-rose-600 text-rose-200";
                    } else {
                        labelEl.className += "bg-slate-800/50 border-slate-700 text-slate-300 opacity-70";
                    }
                });

                if (checkedInput) {
                    if (checkedInput.value === item.a) {
                        correctMCQ++;
                        feedbackEl.className = "mt-2 p-3 rounded-lg text-xs font-medium border bg-emerald-950/60 border-emerald-800 text-emerald-300";
                        feedbackEl.innerHTML = `<i class="fa-solid fa-circle-check"></i> <b>Chính xác!</b> <em>Giải thích:</em> ${item.exp}`;
                    } else {
                        feedbackEl.className = "mt-2 p-3 rounded-lg text-xs font-medium border bg-rose-950/60 border-rose-800 text-rose-300";
                        feedbackEl.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> <b>Chưa đúng.</b> <em>Giải thích:</em> ${item.exp}`;
                    }
                } else {
                    feedbackEl.className = "mt-2 p-3 rounded-lg text-xs font-medium border bg-amber-950/60 border-amber-800 text-amber-300";
                    feedbackEl.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i> <b>Bạn chưa chọn đáp án!</b> <em>Giải thích:</em> ${item.exp}`;
                }
            });

            const resultEl = document.getElementById('total-result');
            resultEl.classList.remove('hidden');
            resultEl.innerHTML = `
                <div>Tổng kết: <span class="text-purple-400">${correctMCQ}/${shuffledMcq.length}</span> câu đúng</div>
                <div class="text-xs font-normal text-slate-400 mt-1">* Đáp án đúng đã được hiển thị màu xanh, đáp án sai chọn nhầm hiển thị màu đỏ!</div>
            `;
            window.scrollTo({ top: document.body.scrollHeight, behavior: 'smooth' });
        }

        window.onload = initQuiz;
    </script>
</body>
  </html>
