<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài 3: Phòng chống tệ nạn xã hội và tội phạm sử dụng công nghệ cao - GDQP 11</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Lexend', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-rose-500 selection:text-white">

    <!-- Header -->
    <header class="w-full bg-slate-800/85 backdrop-blur border-b border-slate-700/60 sticky top-0 z-30">
        <div class="max-w-4xl mx-auto px-4 py-3.5 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <a href="./indexqp.html" class="p-2 bg-rose-600 rounded-lg text-white hover:bg-rose-500 transition cursor-pointer" title="Quay lại indexqp.html">
                    <i class="fa-solid fa-arrow-left text-base"></i>
                </a>
                <div>
                    <h1 class="text-sm md:text-base font-bold leading-tight">Bài 3: Phòng chống tệ nạn xã hội & Tội phạm công nghệ cao</h1>
                    <p class="text-xs text-slate-400">GDQP-AN 11 (15 câu)</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <!-- Nút xáo trộn câu hỏi nhanh -->
                <button type="button" onclick="shuffleAndRestartExam()" class="px-3 py-1.5 bg-emerald-600 hover:bg-emerald-500 border border-emerald-500 rounded-lg text-xs font-medium text-white transition flex items-center space-x-1.5 cursor-pointer" title="Xáo trộn lại toàn bộ câu hỏi và đáp án">
                    <i class="fa-solid fa-shuffle"></i>
                    <span class="hidden sm:inline">Xáo trộn đề</span>
                </button>
                <!-- Nút Trang chủ chính -->
                <a href="../../../index.html" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 border border-slate-600 rounded-lg text-xs font-medium text-slate-200 transition flex items-center space-x-1.5 cursor-pointer">
                    <i class="fa-solid fa-house text-rose-400"></i>
                    <span class="hidden sm:inline">Trang chủ chính</span>
                </a>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl w-full mx-auto p-4 md:p-6 flex-grow flex flex-col justify-center space-y-6">

        <section id="page-exam" class="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-6 md:p-8 shadow-xl space-y-6">
            <div class="flex items-center justify-between pb-4 border-b border-slate-700/60">
                <div>
                    <h2 class="text-lg md:text-xl font-bold text-white">Đề Kiểm Tra Bài 3 (15 câu trắc nghiệm ngẫu nhiên)</h2>
                    <p class="text-xs text-slate-400" id="exam-progress-text">Câu 1 / 15</p>
                </div>
                <div class="w-1/3 bg-slate-700 h-2 rounded-full overflow-hidden hidden sm:block">
                    <div id="progress-bar" class="bg-rose-500 h-full transition-all duration-300" style="width: 6.66%;"></div>
                </div>
            </div>

            <div id="question-container" class="space-y-4"></div>
        </section>

    </main>

    <footer class="w-full py-5 text-center text-slate-500 text-xs border-t border-slate-800">
        GDQP-AN 11 • Bài 3: Phòng, Chống Tội Phạm, Tệ Nạn Xã Hội Và Tội Phạm Sử Dụng Công Nghệ Cao
    </footer>

    <script>
        const rawMcqData = [
            {
                q: "Theo quy định, tội phạm là hành vi nguy hiểm cho xã hội được quy định trong văn bản nào dưới đây?",
                a: ["Bộ luật Hình sự", "Bộ luật Dân sự", "Luật Xử lý vi phạm hành chính", "Hiến pháp nước CHXHCN Việt Nam"],
                correct: 0,
                exp: "Tội phạm là hành vi nguy hiểm cho xã hội được quy định trong Bộ luật Hình sự."
            },
            {
                q: "Chủ thể thực hiện hành vi phạm tội theo quy định pháp luật hình sự bao gồm:",
                a: ["Người có năng lực trách nhiệm hình sự hoặc pháp nhân thương mại", "Chỉ cá nhân công dân từ đủ 18 tuổi trở lên", "Chỉ các tổ chức chính trị xã hội", "Mọi tổ chức và cá nhân sinh sống trên lãnh thổ Việt Nam"],
                correct: 0,
                exp: "Do người có năng lực trách nhiệm hình sự hoặc pháp nhân thương mại thực hiện."
            },
            {
                q: "Hành vi phạm tội do chủ thể thực hiện dưới hình thức lỗi nào?",
                a: ["Một cách cố ý hoặc vô ý", "Chỉ do lỗi cố ý trực tiếp", "Chỉ do lỗi vô ý cẩu thả", "Do sự bất khả kháng"],
                correct: 0,
                exp: "Thực hiện một cách cố ý hoặc vô ý."
            },
            {
                q: "Khái niệm tội phạm sử dụng công nghệ cao gắn liền với việc sử dụng công nghệ thông tin ở trình độ cao tác động trái pháp luật đến đối tượng nào?",
                a: ["Thông tin số được lưu trữ, xử lí, truyền tải trong hệ thống máy tính", "Các tài liệu lưu trữ bằng giấy tờ truyền thống tại cơ quan nhà nước", "Hệ thống đường ống cấp nước sinh hoạt đô thị", "Hệ thống giao thông đường sắt quốc gia"],
                correct: 0,
                exp: "Tác động trái pháp luật đến thông tin số được lưu trữ, xử lí, truyền tải trong hệ thống máy tính."
            },
            {
                q: "Hành vi nào dưới đây thuộc nhóm hành vi phạm tội sử dụng công nghệ cao ở Việt Nam hiện nay?",
                a: ["Lừa đảo chiếm đoạt tài sản trên không gian mạng", "Vi phạm quy định về tham gia giao thông đường bộ", "Trộm cắp vặt tài sản cá nhân thông thường không qua mạng", "Lấn chiếm đất đai canh tác nông nghiệp"],
                correct: 0,
                exp: "Lừa đảo chiếm đoạt tài sản trên không gian mạng."
            },
            {
                q: "Hành vi sản xuất, mua bán, trao đổi hoặc tặng cho công cụ, thiết bị, phần mềm để sử dụng vào mục đích trái pháp luật liên quan đến công nghệ cao được pháp luật quy định như thế nào?",
                a: ["Bị nghiêm cấm thực hiện", "Được phép nếu có giấy phép kinh doanh tư nhân", "Được khuyến khích để nâng cao kỹ năng", "Chỉ cấm đối với người dưới 18 tuổi"],
                correct: 0,
                exp: "Là hành vi bị nghiêm cấm theo quy định pháp luật."
            },
            {
                q: "Hành vi xâm nhập trái phép vào mạng máy tính, mạng viễn thông hoặc phương tiện điện tử của người khác thuộc nhóm:",
                a: ["Các hành vi vi phạm pháp luật và bị nghiêm cấm thực hiện", "Các quyền tự do khai thác thông tin cá nhân", "Các hoạt động giao lưu trực tuyến hợp pháp", "Các dịch vụ hỗ trợ kỹ thuật mạng"],
                correct: 0,
                exp: "Xâm nhập trái phép mạng máy tính của người khác là hành vi bị nghiêm cấm."
            },
            {
                q: "Tệ nạn xã hội được định nghĩa là:",
                a: ["Hiện tượng xã hội tiêu cực, biểu hiện bằng những hành vi sai lệch chuẩn mực xã hội, vi phạm đạo đức, pháp luật và gây nguy hiểm cho xã hội", "Các hoạt động giao lưu văn hóa truyền thống chưa được công nhận", "Các hình thức vui chơi giải trí lành mạnh của giới trẻ", "Các phong tục tập quán lâu đời của đồng bào vùng cao"],
                correct: 0,
                exp: "Tệ nạn xã hội là hiện tượng xã hội tiêu cực, hành vi sai lệch chuẩn mực, vi phạm đạo đức, pháp luật."
            },
            {
                q: "Tệ nạn ma túy thể hiện qua tình trạng nào dưới đây?",
                a: ["Sử dụng trái phép chất ma túy, nghiện ma túy và các hành vi vi phạm pháp luật về ma túy chưa đến mức truy cứu trách nhiệm hình sự", "Sử dụng thuốc kháng sinh theo đơn của bác sĩ điều trị", "Trồng cây lương thực có chứa tinh bột phục vụ chăn nuôi", "Sử dụng dược phẩm y tế hợp pháp tại các bệnh viện"],
                correct: 0,
                exp: "Tệ nạn ma túy là tình trạng sử dụng trái phép, nghiện ma túy và vi phạm pháp luật ma túy."
            },
            {
                q: "Tệ nạn mại dâm bao gồm những hành vi nào?",
                a: ["Thực hiện các dịch vụ quan hệ tình dục có tính chất mua bán trên cơ sở giá trị vật chất ngoài phạm vi hôn nhân", "Kết hôn hợp pháp theo Luật Hôn nhân và gia đình", "Tổ chức lễ hội văn hóa truyền thống cộng đồng", "Hợp tác lao động sản xuất kinh tế thuần túy"],
                correct: 0,
                exp: "Tệ nạn mại dâm là dịch vụ quan hệ tình dục mua bán ngoài phạm vi hôn nhân."
            },
            {
                q: "Hành vi nào dưới đây liên quan đến tệ nạn mại dâm bị pháp luật nghiêm cấm?",
                a: ["Bán dâm, mua dâm, chứa mại dâm, tổ chức mại dâm, môi giới mại dâm, bảo kê mại dâm", "Tổ chức các câu lạc bộ thể dục thẩm mỹ cộng đồng", "Kinh doanh dịch vụ lưu trú du lịch đúng pháp luật", "Tư vấn chăm sóc sức khỏe sinh sản hợp pháp"],
                correct: 0,
                exp: "Nghiêm cấm bán dâm, mua dâm, chứa mại dâm, tổ chức, môi giới và bảo kê mại dâm."
            },
            {
                q: "Tệ nạn cờ bạc được hiểu là việc lợi dụng các hình thức vui chơi giải trí để cá cược, sát phạt nhau bằng tiền hoặc hiện vật mà:",
                a: ["Không được cơ quan nhà nước có thẩm quyền cho phép", "Được tổ chức công khai trong các dịp Tết truyền thống", "Được sự đồng ý của trưởng thôn bản", "Phục vụ cho mục đích từ thiện xã hội"],
                correct: 0,
                exp: "Cá cược sát phạt bằng tiền/hiện vật không được cơ quan nhà nước có thẩm quyền cho phép."
            },
            {
                q: "Tệ nạn mê tín dị đoan bao gồm những hành vi biểu hiện như thế nào?",
                a: ["Thái quá lòng tin vào điều huyền bí không có thật, suy đoán cuồng tín trái chuẩn mực xã hội", "Tham gia sinh hoạt tôn giáo thuần túy hợp pháp", "Thực hiện các nghi lễ truyền thống văn hóa lịch sử cấp quốc gia", "Nghiên cứu khoa học tự nhiên và lịch sử văn hóa"],
                correct: 0,
                exp: "Tin vào điều huyền bí không có thật, suy đoán cuồng tín, trái chuẩn mực xã hội."
            },
            {
                q: "Trách nhiệm chung của công dân trong phòng chống tội phạm, tệ nạn xã hội là gì?",
                a: ["Tuân theo Hiến pháp và pháp luật; tham gia bảo vệ an ninh quốc gia, giữ gìn trật tự an toàn xã hội", "Trực tiếp điều tra và truy bắt tội phạm nguy hiểm trên không gian mạng", "Tự thành lập các tổ chức vũ trang bảo vệ an ninh thôn xóm", "Miễn trừ mọi nghĩa vụ nếu không liên quan đến bản thân"],
                correct: 0,
                exp: "Công dân có nghĩa vụ tuân theo Hiến pháp, pháp luật, tham gia bảo vệ an ninh quốc gia."
            },
            {
                q: "Ý nghĩa cốt lõi của việc học sinh tích cực tham gia phòng, chống tội phạm, tệ nạn xã hội và tội phạm sử dụng công nghệ cao là gì?",
                a: ["Góp phần bảo vệ an ninh quốc gia, trật tự an toàn xã hội và xây dựng môi trường sống lành mạnh", "Giúp học sinh đạt giải cao trong các kì thi học sinh giỏi quốc gia", "Tạo lợi thế khi xét tuyển vào các trường đại học khối kinh tế", "Giúp cá nhân nổi bật trên các nền tảng mạng xã hội"],
                correct: 0,
                exp: "Góp phần bảo vệ an ninh quốc gia, trật tự an toàn xã hội."
            }
        ];

        let questionsData = [];
        let currentIndex = 0;
        let userAnswers = {};

        function shuffleExam() {
            let cloned = JSON.parse(JSON.stringify(rawMcqData));
            // Xáo trộn ngẫu nhiên thứ tự các câu và lấy đúng 15 câu
            for (let i = cloned.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cloned[i], cloned[j]] = [cloned[j], cloned[i]];
            }
            let selected = cloned.slice(0, 15);

            questionsData = selected.map(item => {
                let correctText = item.a[item.correct];
                let optionsWithIndex = item.a.map((opt) => ({ text: opt, isCorrect: opt === correctText }));
                for (let i = optionsWithIndex.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [optionsWithIndex[i], optionsWithIndex[j]] = [optionsWithIndex[j], optionsWithIndex[i]];
                }
                return {
                    q: item.q,
                    a: optionsWithIndex.map(o => o.text),
                    correct: optionsWithIndex.findIndex(o => o.isCorrect),
                    exp: item.exp
                };
            });
        }

        function initQuiz() {
            shuffleExam();
            currentIndex = 0;
            userAnswers = {};
            renderQuestion();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function shuffleAndRestartExam() {
            initQuiz();
        }

        function renderQuestion() {
            const container = document.getElementById('question-container');
            if (currentIndex >= questionsData.length) {
                renderResult();
                return;
            }

            const item = questionsData[currentIndex];
            const progressPercent = ((currentIndex + 1) / questionsData.length) * 100;
            document.getElementById('exam-progress-text').innerText = `Câu ${currentIndex + 1} / ${questionsData.length}`;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;

            const answered = userAnswers[currentIndex] !== undefined;
            const selectedOpt = userAnswers[currentIndex];

            container.innerHTML = `
                <div class="space-y-4">
                    <div class="font-bold text-base md:text-lg text-slate-100">
                        <span class="text-rose-400">Câu ${currentIndex + 1}:</span> ${item.q}
                    </div>
                    <div class="grid grid-cols-1 gap-2.5">
                        ${item.a.map((opt, oIdx) => {
                            let btnClass = "w-full text-left p-3.5 bg-slate-900/80 hover:bg-slate-700/80 border border-slate-700 rounded-xl flex items-center space-x-3 text-sm transition cursor-pointer";
                            if (answered) {
                                if (oIdx === item.correct) {
                                    btnClass = "w-full text-left p-3.5 bg-emerald-950/80 border border-emerald-600 rounded-xl flex items-center space-x-3 text-sm text-emerald-200 font-semibold";
                                } else if (oIdx === selectedOpt && selectedOpt !== item.correct) {
                                    btnClass = "w-full text-left p-3.5 bg-rose-950/80 border border-rose-600 rounded-xl flex items-center space-x-3 text-sm text-rose-200";
                                } else {
                                    btnClass = "w-full text-left p-3.5 bg-slate-900/40 border border-slate-800 rounded-xl flex items-center space-x-3 text-sm text-slate-500 opacity-60";
                                }
                            }
                            return `
                                <button type="button" ${answered ? 'disabled' : ''} onclick="handleSelect(${oIdx})" class="${btnClass}">
                                    <span class="w-7 h-7 rounded-lg bg-slate-800 flex items-center justify-center font-bold text-rose-400 border border-slate-700 text-xs">${['A', 'B', 'C', 'D'][oIdx]}</span>
                                    <span class="flex-grow">${opt}</span>
                                </button>
                            `;
                        }).join('')}
                    </div>

                    <div class="${answered ? '' : 'hidden'} mt-4 p-4 rounded-xl border space-y-3 ${answered && selectedOpt === item.correct ? 'bg-emerald-950/60 border-emerald-800 text-emerald-200' : 'bg-rose-950/60 border-rose-800 text-rose-200'}">
                        <div class="flex items-center space-x-2 font-bold ${answered && selectedOpt === item.correct ? 'text-emerald-400' : 'text-rose-400'}">
                            <i class="fa-solid ${answered && selectedOpt === item.correct ? 'fa-circle-check' : 'fa-circle-xmark'} text-lg"></i>
                            <span>${answered && selectedOpt === item.correct ? 'Chính xác!' : `Chưa đúng! Đáp án đúng là: <b>${['A', 'B', 'C', 'D'][item.correct]}</b>`}</span>
                        </div>
                        <div class="text-xs text-slate-300 leading-relaxed"><b>Giải thích:</b> ${item.exp}</div>
                        <div class="pt-2 flex justify-between items-center">
                            <span class="text-xs text-slate-400 italic">Đã trả lời câu ${currentIndex + 1}</span>
                            <button type="button" onclick="nextQuestion()" class="px-5 py-2.5 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-lg text-xs transition inline-flex items-center space-x-2 cursor-pointer">
                                <span>${currentIndex < questionsData.length - 1 ? 'Câu tiếp theo' : 'Xem kết quả'}</span>
                                <i class="fa-solid fa-arrow-right"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleSelect(oIdx) {
            userAnswers[currentIndex] = oIdx;
            renderQuestion();
        }

        function nextQuestion() {
            currentIndex++;
            renderQuestion();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderResult() {
            let correctCount = 0;
            questionsData.forEach((item, idx) => {
                if (userAnswers[idx] === item.correct) correctCount++;
            });

            const container = document.getElementById('question-container');
            document.getElementById('exam-progress-text').innerText = `Hoàn thành`;
            document.getElementById('progress-bar').style.width = `100%`;

            container.innerHTML = `
                <div class="text-center space-y-6 py-6">
                    <div class="w-20 h-20 bg-rose-500/20 text-rose-400 rounded-full flex items-center justify-center mx-auto border border-rose-500/30 text-3xl">
                        <i class="fa-solid fa-trophy"></i>
                    </div>
                    <div class="space-y-2">
                        <h3 class="text-2xl font-bold text-white">Kết Quả Kiểm Tra Bài 3</h3>
                        <p class="text-slate-300 text-base">
                            Số câu trả lời đúng của bạn: <span class="font-bold text-rose-400 text-xl">${correctCount} / ${questionsData.length}</span>
                        </p>
                    </div>
                    <div class="flex flex-wrap items-center justify-center gap-3 pt-2">
                        <button type="button" onclick="initQuiz()" class="px-6 py-3 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-xl shadow-lg transition text-sm inline-flex items-center space-x-2 cursor-pointer">
                            <i class="fa-solid fa-rotate-right"></i>
                            <span>Thi lại bài mới (Xáo trộn)</span>
                        </button>
                    </div>
                </div>
            `;
        }

        window.onload = initQuiz;
    </script>
</body>
</html>
