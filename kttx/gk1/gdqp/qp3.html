        let questionsData = [];
        let currentIndex = 0;
        let userAnswers = {};

        function shuffleExam() {
            let cloned = JSON.parse(JSON.stringify(rawMcqData));
            for (let i = cloned.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [cloned[i], cloned[j]] = [cloned[j], cloned[i]];
            }

            questionsData = cloned.map(item => {
                let correctText = item.a[item.correct];
                let optionsWithIndex = item.a.map((opt) => ({ text: opt, isCorrect: opt === correctText }));
                for (let i = optionsWithIndex.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [optionsWithIndex[i], optionsWithIndex[j]] = [optionsWithIndex[j], optionsWithIndex[i]];
                }
                return {
                    q: item.q,
                    a: optionsWithIndex.map(o => o.text),
                    correct: optionsWithIndex.findIndex(o => o.isCorrect),
                    exp: item.exp
                };
            });
        }

        function initQuiz() {
            shuffleExam();
            currentIndex = 0;
            userAnswers = {};
            renderQuestion();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function shuffleAndRestartExam() {
            initQuiz();
        }

        function renderQuestion() {
            const container = document.getElementById('question-container');
            if (currentIndex >= questionsData.length) {
                renderResult();
                return;
            }

            const item = questionsData[currentIndex];
            const progressPercent = ((currentIndex + 1) / questionsData.length) * 100;
            document.getElementById('exam-progress-text').innerText = `Câu ${currentIndex + 1} / ${questionsData.length}`;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;

            const answered = userAnswers[currentIndex] !== undefined;
            const selectedOpt = userAnswers[currentIndex];

            container.innerHTML = `
                <div class="space-y-4">
                    <div class="font-bold text-base md:text-lg text-slate-100">
                        <span class="text-rose-400">Câu ${currentIndex + 1}:</span> ${item.q}
                    </div>
                    <div class="grid grid-cols-1 gap-2.5">
                        ${item.a.map((opt, oIdx) => {
                            let btnClass = "w-full text-left p-3.5 bg-slate-900/80 hover:bg-slate-700/80 border border-slate-700 rounded-xl flex items-center space-x-3 text-sm transition cursor-pointer";
                            if (answered) {
                                if (oIdx === item.correct) {
                                    btnClass = "w-full text-left p-3.5 bg-emerald-950/80 border border-emerald-600 rounded-xl flex items-center space-x-3 text-sm text-emerald-200 font-semibold";
                                } else if (oIdx === selectedOpt && selectedOpt !== item.correct) {
                                    btnClass = "w-full text-left p-3.5 bg-rose-950/80 border border-rose-600 rounded-xl flex items-center space-x-3 text-sm text-rose-200";
                                } else {
                                    btnClass = "w-full text-left p-3.5 bg-slate-900/40 border border-slate-800 rounded-xl flex items-center space-x-3 text-sm text-slate-500 opacity-60";
                                }
                            }
                            return `
                                <button type="button" ${answered ? 'disabled' : ''} onclick="handleSelect(${oIdx})" class="${btnClass}">
                                    <span class="w-7 h-7 rounded-lg bg-slate-800 flex items-center justify-center font-bold text-rose-400 border border-slate-700 text-xs">${['A', 'B', 'C', 'D'][oIdx]}</span>
                                    <span class="flex-grow">${opt}</span>
                                </button>
                            `;
                        }).join('')}
                    </div>

                    <div class="${answered ? '' : 'hidden'} mt-4 p-4 rounded-xl border space-y-3 ${answered && selectedOpt === item.correct ? 'bg-emerald-950/60 border-emerald-800 text-emerald-200' : 'bg-rose-950/60 border-rose-800 text-rose-200'}">
                        <div class="flex items-center space-x-2 font-bold ${answered && selectedOpt === item.correct ? 'text-emerald-400' : 'text-rose-400'}">
                            <i class="fa-solid ${answered && selectedOpt === item.correct ? 'fa-circle-check' : 'fa-circle-xmark'} text-lg"></i>
                            <span>${answered && selectedOpt === item.correct ? 'Chính xác!' : `Chưa đúng! Đáp án đúng là: <b>${['A', 'B', 'C', 'D'][item.correct]}</b>`}</span>
                        </div>
                        <div class="text-xs text-slate-300 leading-relaxed"><b>Giải thích:</b> ${item.exp}</div>
                        <div class="pt-2 flex justify-between items-center">
                            <span class="text-xs text-slate-400 italic">Đã trả lời câu ${currentIndex + 1}</span>
                            <button type="button" onclick="nextQuestion()" class="px-5 py-2.5 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-lg text-xs transition inline-flex items-center space-x-2 cursor-pointer">
                                <span>${currentIndex < questionsData.length - 1 ? 'Câu tiếp theo' : 'Xem kết quả'}</span>
                                <i class="fa-solid fa-arrow-right"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleSelect(oIdx) {
            userAnswers[currentIndex] = oIdx;
            renderQuestion();
        }

        function nextQuestion() {
            currentIndex++;
            renderQuestion();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderResult() {
            let correctCount = 0;
            questionsData.forEach((item, idx) => {
                if (userAnswers[idx] === item.correct) correctCount++;
            });

            const container = document.getElementById('question-container');
            document.getElementById('exam-progress-text').innerText = `Hoàn thành`;
            document.getElementById('progress-bar').style.width = `100%`;

            container.innerHTML = `
                <div class="text-center space-y-6 py-6">
                    <div class="w-20 h-20 bg-rose-500/20 text-rose-400 rounded-full flex items-center justify-center mx-auto border border-rose-500/30 text-3xl">
                        <i class="fa-solid fa-trophy"></i>
                    </div>
                    <div class="space-y-2">
                        <h3 class="text-2xl font-bold text-white">Kết Quả Kiểm Tra Bài 3</h3>
                        <p class="text-slate-300 text-base">
                            Số câu trả lời đúng của bạn: <span class="font-bold text-rose-400 text-xl">${correctCount} / ${questionsData.length}</span>
                        </p>
                    </div>
                    <div class="flex flex-wrap items-center justify-center gap-3 pt-2">
                        <button type="button" onclick="initQuiz()" class="px-6 py-3 bg-rose-600 hover:bg-rose-500 text-white font-bold rounded-xl shadow-lg transition text-sm inline-flex items-center space-x-2 cursor-pointer">
                            <i class="fa-solid fa-rotate-right"></i>
                            <span>Thi lại bài mới (Xáo trộn)</span>
                        </button>
                    </div>
                </div>
            `;
        }

        window.onload = initQuiz;
    </script>
