<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc Nghiệm Ngữ Pháp Tiếng Anh 11 - Unit 1 & Unit 2 (Global Success)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Lexend', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white">

    <!-- Header -->
    <header class="w-full bg-slate-800/85 backdrop-blur border-b border-slate-700/60 sticky top-0 z-30">
        <div class="max-w-4xl mx-auto px-4 py-3.5 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-blue-600 rounded-lg text-white">
                    <i class="fa-solid fa-book-bookmark text-base"></i>
                </div>
                <div>
                    <h1 class="text-sm md:text-base font-bold leading-tight">Ngữ Pháp Tiếng Anh 11 - Global Success</h1>
                    <p class="text-xs text-slate-400">Unit 1 & Unit 2: Grammar Practice</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <button type="button" onclick="initQuiz()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 border border-slate-600 rounded-lg text-xs font-medium text-slate-200 transition flex items-center space-x-1.5 cursor-pointer">
                    <i class="fa-solid fa-rotate-right text-blue-400"></i>
                    <span class="hidden sm:inline">Làm lại từ đầu</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl w-full mx-auto p-4 md:p-6 flex-grow flex flex-col justify-center space-y-6">

        <!-- TRẮC NGHIỆM TỪNG CÂU -->
        <section id="page-exam" class="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-6 md:p-8 shadow-xl space-y-6">
            <div class="flex items-center justify-between pb-4 border-b border-slate-700/60">
                <div>
                    <h2 class="text-lg md:text-xl font-bold text-white">Trắc nghiệm Ngữ pháp (Unit 1 & 2)</h2>
                    <p class="text-xs text-slate-400" id="exam-progress-text">Câu 1 / 20</p>
                </div>
                <div class="w-1/3 bg-slate-700 h-2 rounded-full overflow-hidden hidden sm:block">
                    <div id="progress-bar" class="bg-blue-500 h-full transition-all duration-300" style="width: 5%;"></div>
                </div>
            </div>

            <!-- Khu vực hiển thị từng câu hỏi -->
            <div id="question-container" class="space-y-4">
                <!-- Render bằng JavaScript -->
            </div>
        </section>

    </main>

    <footer class="w-full py-5 text-center text-slate-500 text-xs border-t border-slate-800">
        Tiếng Anh 11 • Global Success • Grammar Practice Unit 1 & Unit 2
    </footer>

    <script>
        // Dữ liệu 20 câu hỏi ngữ pháp chuẩn xác
        const rawQuestionsData = [
            // --- Part 1. Unit 1: A Long and Healthy Life (Thì Hiện tại đơn, Hiện tại hoàn thành, Quá khứ đơn) ---
            {
                q: "My father ______ healthy food every day.",
                o: ["ate", "has eaten", "eats", "eating"],
                a: 2,
                grammar: "Thì Hiện tại đơn (Present Simple) với dấu hiệu 'every day' và chủ ngữ số ít 'My father'.",
                trans: "Bố tôi ăn thức ăn lành mạnh mỗi ngày."
            },
            {
                q: "I ______ my grandparents last weekend.",
                o: ["have visited", "visited", "visit", "am visiting"],
                a: 1,
                grammar: "Thì Quá khứ đơn (Past Simple) với mốc thời gian trong quá khứ 'last weekend'.",
                trans: "Tôi đã đi thăm ông bà vào cuối tuần trước."
            },
            {
                q: "She ______ English for three years.",
                o: ["studied", "studies", "has studied", "study"],
                a: 2,
                grammar: "Thì Hiện tại hoàn thành (Present Perfect) diễn tả hành động kéo dài qua cấu trúc 'for + khoảng thời gian'.",
                trans: "Cô ấy đã học tiếng Anh được ba năm."
            },
            {
                q: "They haven't finished their homework ______.",
                o: ["yesterday", "last night", "ago", "yet"],
                a: 3,
                grammar: "Trạng từ 'yet' thường đứng cuối câu phủ định trong thì Hiện tại hoàn thành.",
                trans: "Họ vẫn chưa hoàn thành bài tập về nhà."
            },
            {
                q: "______ you ever tried yoga?",
                o: ["Did", "Have", "Has", "Do"],
                a: 1,
                grammar: "Cấu trúc câu hỏi thì Hiện tại hoàn thành với 'Ever': Have + chủ ngữ + ever + V3/ed?",
                trans: "Bạn đã bao giờ thử tập yoga chưa?"
            },
            {
                q: "He ______ just ______ his morning exercise.",
                o: ["has / finished", "did / finished", "have / finished", "is / finish"],
                a: 0,
                grammar: "Thì Hiện tại hoàn thành dùng với 'just' (vừa mới): Chủ ngữ số ít 'He' đi với 'has'.",
                trans: "Anh ấy vừa mới hoàn thành bài tập thể dục buổi sáng xong."
            },
            {
                q: "We ______ to the gym two days ago.",
                o: ["have gone", "go", "went", "gone"],
                a: 2,
                grammar: "Thì Quá khứ đơn với dấu hiệu thời gian 'two days ago'. Dạng quá khứ của 'go' là 'went'.",
                trans: "Chúng tôi đã đến phòng tập gym cách đây hai ngày."
            },
            {
                q: "My sister has lived in Da Nang ______ 2022.",
                o: ["for", "since", "ago", "during"],
                a: 1,
                grammar: "'Since' đi kèm với mốc thời gian cụ thể trong quá khứ (2022) trong thì Hiện tại hoàn thành.",
                trans: "Chị gái tôi đã sống ở Đà Nẵng kể từ năm 2022."
            },
            {
                q: "I ______ this film before, so I don't want to watch it again.",
                o: ["saw", "see", "have seen", "am seeing"],
                a: 2,
                grammar: "Thì Hiện tại hoàn thành với từ 'before' diễn tả trải nghiệm cho đến hiện tại.",
                trans: "Tôi đã xem bộ phim này trước đây rồi, nên tôi không muốn xem lại nữa."
            },
            {
                q: "When ______ you ______ eating fast food?",
                o: ["have / stopped", "did / stop", "do / stopped", "has / stopped"],
                a: 1,
                grammar: "Câu hỏi với từ để hỏi 'When' về một thời điểm cụ thể trong quá khứ dùng thì Quá khứ đơn ('did... stop').",
                trans: "Bạn đã dừng ăn đồ ăn nhanh khi nào thế?"
            },

            // --- Part 2. Unit 2: The Generation Gap (Động từ khuyết thiếu: should, shouldn't, must, mustn't, have to, don't have to) ---
            {
                q: "Students ______ respect their teachers and parents.",
                o: ["should", "shouldn't", "mustn't", "don't have to"],
                a: 0,
                grammar: "'Should' được dùng để đưa ra lời khuyên hoặc điều nên làm.",
                trans: "Học sinh nên kính trọng thầy cô và cha mẹ."
            },
            {
                q: "You ______ use your phone during the exam. It's forbidden.",
                o: ["don't have to", "should", "mustn't", "have to"],
                a: 2,
                grammar: "'Mustn't' dùng để chỉ sự cấm đoán, không được phép làm gì.",
                trans: "Bạn không được phép sử dụng điện thoại trong phòng thi. Điều đó bị cấm."
            },
            {
                q: "It's Sunday tomorrow, so I ______ get up early.",
                o: ["mustn't", "don't have to", "should", "had to"],
                a: 1,
                grammar: "'Don't have to' diễn tả sự không cần thiết phải làm gì (ngày mai Chủ Nhật nên không cần dậy sớm).",
                trans: "Ngày mai là Chủ Nhật, vì vậy tôi không phải dậy sớm."
            },
            {
                q: "My brother ______ wear a uniform at school. It's compulsory.",
                o: ["has to", "should", "doesn't have to", "mustn't"],
                a: 0,
                grammar: "'Has to' dùng để chỉ nghĩa vụ hoặc nội quy bắt buộc phải tuân theo ở ngôi thứ ba số ít.",
                trans: "Em trai tôi phải mặc đồng phục ở trường. Đó là quy định bắt buộc."
            },
            {
                q: "You look tired. You ______ go to bed earlier.",
                o: ["mustn't", "shouldn't", "should", "don't have to"],
                a: 2,
                grammar: "Đưa ra lời khuyên hữu ích cho người khác dùng 'should'.",
                trans: "Trông bạn có vẻ mệt mỏi. Bạn nên đi ngủ sớm hơn."
            },
            {
                q: "We ______ finish our project yesterday because the deadline was today.",
                o: ["have to", "had to", "must", "should"],
                a: 1,
                grammar: "Dạng quá khứ của 'have to / must' là 'had to' (phải làm gì trong quá khứ với dấu hiệu 'yesterday').",
                trans: "Chúng tôi đã phải hoàn thành dự án của mình ngày hôm qua vì hạn chót là hôm nay."
            },
            {
                q: "Parents ______ compare their children with other children because it may make them feel sad.",
                o: ["should", "have to", "shouldn't", "must"],
                a: 2,
                grammar: "'Shouldn't' dùng để khuyên không nên làm việc gì đó không tốt.",
                trans: "Cha mẹ không nên so sánh con cái mình với những đứa trẻ khác vì điều đó có thể làm chúng cảm thấy buồn."
            },
            {
                q: "You ______ bring any food. We have prepared enough for everyone.",
                o: ["mustn't", "don't have to", "should", "have to"],
                a: 1,
                grammar: "'Don't have to' chỉ sự không bắt buộc (không cần phải mang theo thức ăn vì đã chuẩn bị đủ).",
                trans: "Bạn không cần phải mang theo thức ăn đâu. Chúng tôi đã chuẩn bị đủ cho mọi người rồi."
            },
            {
                q: "My parents think I ______ spend less time playing computer games.",
                o: ["should", "shouldn't to", "must to", "have"],
                a: 0,
                grammar: "'Should' đứng trước động từ nguyên thể không 'to'. Loại các đáp án sai cấu trúc.",
                trans: "Bố mẹ tôi nghĩ rằng tôi nên dành ít thời gian chơi trò chơi máy tính hơn."
            },
            {
                q: "Children ______ obey every opinion of their parents without discussing it. They should be able to express their own ideas respectfully.",
                o: ["should", "have to", "must", "don't have to"],
                a: 3,
                grammar: "'Don't have to' dùng ở đây để diễn tả việc không cần thiết phải tuân theo tuyệt đối mọi quan điểm mà không được thảo luận.",
                trans: "Trẻ em không nhất thiết phải vâng lời mọi ý kiến của cha mẹ mà không thảo luận gì. Các em nên được bày tỏ ý kiến riêng một cách tôn trọng."
            }
        ];

        let questionsData = [];
        let currentIndex = 0;
        let userAnswers = {};

        // Hàm xáo trộn mảng (Fisher-Yates Shuffle)
        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Khởi tạo bài thi, xáo trộn câu hỏi và các lựa chọn đáp án
        function initQuiz() {
            let shuffledQuestions = shuffleArray(rawQuestionsData);

            questionsData = shuffledQuestions.map(item => {
                let optionsWithCorrect = item.o.map((opt, idx) => ({
                    text: opt,
                    isCorrect: idx === item.a
                }));
                
                let shuffledOptions = shuffleArray(optionsWithCorrect);
                let newCorrectIndex = shuffledOptions.findIndex(opt => opt.isCorrect);

                return {
                    q: item.q,
                    o: shuffledOptions.map(opt => opt.text),
                    a: newCorrectIndex,
                    grammar: item.grammar,
                    trans: item.trans
                };
            });

            currentIndex = 0;
            userAnswers = {};
            renderQuestion();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderQuestion() {
            const container = document.getElementById('question-container');
            
            if (currentIndex >= questionsData.length) {
                renderResult();
                return;
            }

            const item = questionsData[currentIndex];
            const progressPercent = ((currentIndex + 1) / questionsData.length) * 100;
            document.getElementById('exam-progress-text').innerText = `Câu ${currentIndex + 1} / ${questionsData.length}`;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;

            const answered = userAnswers[currentIndex] !== undefined;
            const selectedOpt = userAnswers[currentIndex];

            container.innerHTML = `
                <div class="space-y-4">
                    <div class="font-bold text-base md:text-lg text-slate-100 leading-relaxed">
                        <span class="text-blue-400">Câu ${currentIndex + 1}:</span> ${item.q.replace('______', '<u class="text-yellow-400 font-bold px-1">______</u>')}
                    </div>
                    <div class="grid grid-cols-1 gap-2.5">
                        ${item.o.map((opt, oIdx) => {
                            let btnClass = "w-full text-left p-3.5 bg-slate-900/85 hover:bg-slate-700/80 border border-slate-700 rounded-xl flex items-center space-x-3 text-sm transition cursor-pointer option-btn";
                            if (answered) {
                                if (oIdx === item.a) {
                                    btnClass = "w-full text-left p-3.5 bg-emerald-950/80 border border-emerald-600 rounded-xl flex items-center space-x-3 text-sm text-emerald-200 font-semibold";
                                } else if (oIdx === selectedOpt && selectedOpt !== item.a) {
                                    btnClass = "w-full text-left p-3.5 bg-rose-950/80 border border-rose-600 rounded-xl flex items-center space-x-3 text-sm text-rose-200";
                                } else {
                                    btnClass = "w-full text-left p-3.5 bg-slate-900/40 border border-slate-800 rounded-xl flex items-center space-x-3 text-sm text-slate-500 opacity-60";
                                }
                            }
                            return `
                                <button type="button" ${answered ? 'disabled' : ''} onclick="handleSelect(${oIdx})" class="${btnClass}">
                                    <span class="w-7 h-7 flex-shrink-0 rounded-lg bg-slate-800 flex items-center justify-center font-bold text-blue-400 border border-slate-700 text-xs">${['A', 'B', 'C', 'D'][oIdx]}</span>
                                    <span class="flex-grow">${opt}</span>
                                </button>
                            `;
                        }).join('')}
                    </div>

                    <div id="feedback-box" class="${answered ? '' : 'hidden'} mt-4 p-4 rounded-xl border space-y-3 ${answered && selectedOpt === item.a ? 'bg-emerald-950/60 border-emerald-800 text-emerald-200' : 'bg-rose-950/60 border-rose-800 text-rose-200'}">
                        <div class="flex items-center space-x-2 font-bold ${answered && selectedOpt === item.a ? 'text-emerald-400' : 'text-rose-400'}">
                            <i class="fa-solid ${answered && selectedOpt === item.a ? 'fa-circle-check' : 'fa-circle-xmark'} text-lg"></i>
                            <span>${answered && selectedOpt === item.a ? 'Chính xác!' : `Chưa đúng! Đáp án đúng là: <b>${['A', 'B', 'C', 'D'][item.a]} (${item.o[item.a]})</b>`}</span>
                        </div>
                        <div class="text-xs text-slate-300 space-y-1.5 leading-relaxed bg-slate-900/60 p-3 rounded-lg border border-slate-800">
                            <div><b class="text-blue-300">Giải thích ngữ pháp:</b> <span class="text-yellow-300">${item.grammar}</span></div>
                            <div><b class="text-blue-300">Dịch nghĩa câu:</b> <i>"${item.trans}"</i></div>
                        </div>
                        <div class="pt-2 flex justify-between items-center">
                            <span class="text-xs text-slate-400 italic">Đã trả lời câu ${currentIndex + 1}</span>
                            <button type="button" onclick="nextQuestion()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg text-xs transition inline-flex items-center space-x-2 cursor-pointer">
                                <span>${currentIndex < questionsData.length - 1 ? 'Câu tiếp theo' : 'Xem kết quả'}</span>
                                <i class="fa-solid fa-arrow-right"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleSelect(oIdx) {
            userAnswers[currentIndex] = oIdx;
            renderQuestion();
        }

        function nextQuestion() {
            currentIndex++;
            renderQuestion();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderResult() {
            let correctCount = 0;
            questionsData.forEach((item, idx) => {
                if (userAnswers[idx] === item.a) correctCount++;
            });

            const score = (correctCount * 0.5).toFixed(1);
            let feedbackText = "";
            if (correctCount >= 18) feedbackText = "Nắm khá chắc phần ngữ pháp xuất sắc!";
            else if (correctCount >= 14) feedbackText = "Khá ổn, cần xem lại một vài câu sai nhé.";
            else if (correctCount >= 10) feedbackText = "Cần ôn tập lại các công thức và dấu hiệu nhận biết.";
            else feedbackText = "Nên học lại kỹ lý thuyết từng phần rồi làm lại sẽ hiệu quả hơn!";

            const container = document.getElementById('question-container');
            document.getElementById('exam-progress-text').innerText = `Hoàn thành bài kiểm tra`;
            document.getElementById('progress-bar').style.width = `100%`;

            container.innerHTML = `
                <div class="text-center space-y-6 py-6">
                    <div class="w-20 h-20 bg-blue-500/20 text-blue-400 rounded-full flex items-center justify-center mx-auto border border-blue-500/30 text-3xl">
                        <i class="fa-solid fa-trophy"></i>
                    </div>
                    <div class="space-y-2">
                        <h3 class="text-2xl font-bold text-white">Kết Quả Ngữ Pháp</h3>
                        <p class="text-slate-300 text-base">
                            Số câu trả lời đúng: <span class="font-bold text-blue-400 text-xl">${correctCount} / ${questionsData.length}</span>
                            <span class="block text-xs text-slate-400 mt-1">(Điểm số: <b class="text-yellow-400">${score}</b> / 10 điểm)</span>
                        </p>
                        <p class="text-xs text-emerald-400 italic pt-1">${feedbackText}</p>
                    </div>
                    
                    <div class="flex flex-wrap items-center justify-center gap-3 pt-2">
                        <button type="button" onclick="initQuiz()" class="px-6 py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-lg transition text-sm inline-flex items-center space-x-2 cursor-pointer">
                            <i class="fa-solid fa-rotate-right"></i>
                            <span>Thử lại (Xáo trộn đề mới)</span>
                        </button>
                    </div>
                </div>
            `;
        }

        // Tự động khởi tạo khi load trang
        window.addEventListener('DOMContentLoaded', () => {
            initQuiz();
        });
    </script>
</body>
</html>
