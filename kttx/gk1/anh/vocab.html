<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trắc Nghiệm Tiếng Anh 11 - Unit 1 & Unit 2 (Global Success)</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Lexend', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between selection:bg-blue-500 selection:text-white">

    <!-- Header -->
    <header class="w-full bg-slate-800/85 backdrop-blur border-b border-slate-700/60 sticky top-0 z-30">
        <div class="max-w-4xl mx-auto px-4 py-3.5 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="p-2 bg-blue-600 rounded-lg text-white">
                    <i class="fa-solid fa-graduation-cap text-base"></i>
                </div>
                <div>
                    <h1 class="text-sm md:text-base font-bold leading-tight">Tiếng Anh 11 - Global Success</h1>
                    <p class="text-xs text-slate-400">Unit 1: Healthy Life & Unit 2: The Generation Gap</p>
                </div>
            </div>
            
            <div class="flex items-center space-x-2">
                <button type="button" onclick="initQuiz()" class="px-3 py-1.5 bg-slate-700 hover:bg-slate-600 border border-slate-600 rounded-lg text-xs font-medium text-slate-200 transition flex items-center space-x-1.5 cursor-pointer">
                    <i class="fa-solid fa-rotate-right text-blue-400"></i>
                    <span class="hidden sm:inline">Làm lại từ đầu</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-4xl w-full mx-auto p-4 md:p-6 flex-grow flex flex-col justify-center space-y-6">

        <!-- TRẮC NGHIỆM TỪNG CÂU -->
        <section id="page-exam" class="bg-slate-800/80 border border-slate-700/80 rounded-2xl p-6 md:p-8 shadow-xl space-y-6">
            <div class="flex items-center justify-between pb-4 border-b border-slate-700/60">
                <div>
                    <h2 class="text-lg md:text-xl font-bold text-white">Trắc nghiệm điền từ vựng vào chỗ trống</h2>
                    <p class="text-xs text-slate-400" id="exam-progress-text">Câu 1 / 20</p>
                </div>
                <div class="w-1/3 bg-slate-700 h-2 rounded-full overflow-hidden hidden sm:block">
                    <div id="progress-bar" class="bg-blue-500 h-full transition-all duration-300" style="width: 5%;"></div>
                </div>
            </div>

            <!-- Khu vực hiển thị từng câu hỏi -->
            <div id="question-container" class="space-y-4">
                <!-- Render bằng JavaScript -->
            </div>
        </section>

    </main>

    <footer class="w-full py-5 text-center text-slate-500 text-xs border-t border-slate-800">
        Tiếng Anh 11 • Global Success • Vocabulary Practice
    </footer>

    <script>
        // Dữ liệu 20 câu hỏi chuẩn xác theo yêu cầu
        const rawQuestionsData = [
            {
                q: "Eating a __________ diet with enough vegetables and fruit helps us stay healthy.",
                correct: "balanced",
                distractors: ["flashy", "mature", "nutritious"],
                vocab: "balanced (adj): cân bằng, cân đối",
                trans: "Ăn một chế độ ăn cân bằng với đủ rau củ và trái cây giúp chúng ta giữ gìn sức khỏe."
            },
            {
                q: "My father told me to __________ the amount of sugary drinks I have every day.",
                correct: "cut down on",
                distractors: ["impose on", "examine", "obey"],
                vocab: "cut down on (phr. v): cắt giảm",
                trans: "Bố tôi bảo tôi phải cắt giảm lượng đồ uống có đường mà tôi dùng mỗi ngày."
            },
            {
                q: "Regular exercise gives us more __________ and helps us feel less tired.",
                correct: "energy",
                distractors: ["fitness", "disease", "germs"],
                vocab: "energy (n): năng lượng",
                trans: "Tập thể dục thường xuyên cho chúng ta nhiều năng lượng hơn và giúp chúng ta cảm thấy ít mệt mỏi hơn."
            },
            {
                q: "The doctor will __________ my eyes because I have difficulty seeing the board.",
                correct: "examine",
                distractors: ["obey", "impose", "follow"],
                vocab: "examine (v): khám, kiểm tra",
                trans: "Bác sĩ sẽ khám mắt cho tôi vì tôi gặp khó khăn khi nhìn bảng."
            },
            {
                q: "Diabetes is a common __________ that can affect people's health for a long time.",
                correct: "disease",
                distractors: ["fitness", "argument", "energy"],
                vocab: "disease (n): bệnh tật",
                trans: "Bệnh tiểu đường là một bệnh phổ biến có thể ảnh hưởng đến sức khỏe của con người trong thời gian dài."
            },
            {
                q: "Swimming is a good way to improve your physical __________.",
                correct: "fitness",
                distractors: ["energy", "disease", "germs"],
                vocab: "fitness (n): thể lực, sự khỏe mạnh",
                trans: "Bơi lội là một cách tốt để cải thiện thể lực của bạn."
            },
            {
                q: "We should wash our hands before eating to remove __________ and prevent illness.",
                correct: "germs",
                distractors: ["nutrients", "antibiotics", "arguments"],
                vocab: "germs (n): vi trùng",
                trans: "Chúng ta nên rửa tay trước khi ăn để loại bỏ vi trùng và phòng ngừa bệnh tật."
            },
            {
                q: "Eggs, fish and milk are __________ foods because they provide important nutrients.",
                correct: "nutritious",
                distractors: ["balanced", "flashy", "mature"],
                vocab: "nutritious (adj): bổ dưỡng",
                trans: "Trứng, cá và sữa là những thực phẩm bổ dưỡng vì chúng cung cấp các chất dinh dưỡng quan trọng."
            },
            {
                q: "You should only take __________ when they are prescribed by a doctor to treat certain bacterial infections.",
                correct: "antibiotics",
                distractors: ["germs", "nutrients", "diseases"],
                vocab: "antibiotics (n): thuốc kháng sinh",
                trans: "Bạn chỉ nên uống thuốc kháng sinh khi được bác sĩ kê đơn để điều trị một số bệnh nhiễm trùng do vi khuẩn."
            },
            {
                q: "Eating food that has not been stored properly may cause __________.",
                correct: "food poisoning",
                distractors: ["generation gap", "digital native", "extended family"],
                vocab: "food poisoning (n): ngộ độc thực phẩm",
                trans: "Ăn thức ăn không được bảo quản đúng cách có thể gây ngộ độc thực phẩm."
            },
            {
                q: "The __________ between parents and teenagers can sometimes lead to misunderstandings.",
                correct: "generation gap",
                distractors: ["extended family", "food poisoning", "digital native"],
                vocab: "generation gap (n): khoảng cách thế hệ",
                trans: "Khoảng cách thế hệ giữa cha mẹ và thanh thiếu niên đôi khi có thể dẫn đến những hiểu lầm."
            },
            {
                q: "As a __________, my younger brother can use computers and smartphones easily.",
                correct: "digital native",
                distractors: ["generation gap", "extended family", "mature"],
                vocab: "digital native (n): người sinh ra trong thời đại số",
                trans: "Là một người sinh ra trong thời đại số, em trai tôi có thể sử dụng máy tính và điện thoại thông minh một cách dễ dàng."
            },
            {
                q: "In an __________, grandparents, parents and children often live together in the same house.",
                correct: "extended family",
                distractors: ["generation gap", "digital native", "balanced diet"],
                vocab: "extended family (n): gia đình đa thế hệ",
                trans: "Trong một gia đình đa thế hệ, ông bà, cha mẹ và con cái thường sống chung trong một ngôi nhà."
            },
            {
                q: "A __________ teenager can accept responsibility for their actions and learn from their mistakes.",
                correct: "mature",
                distractors: ["flashy", "open-minded", "balanced"],
                vocab: "mature (adj): trưởng thành, chín chắn",
                trans: "Một thiếu niên trưởng thành có thể nhận trách nhiệm về hành động của mình và học hỏi từ những sai lầm."
            },
            {
                q: "Children should __________ their parents' reasonable rules at home.",
                correct: "obey",
                distractors: ["examine", "impose", "follow"],
                vocab: "obey (v): tuân theo, vâng lời",
                trans: "Trẻ em nên tuân theo các quy tắc hợp lý của cha mẹ ở nhà."
            },
            {
                q: "My parents are __________ enough to listen to my opinions, even when they disagree with me.",
                correct: "open-minded",
                distractors: ["flashy", "mature", "balanced"],
                vocab: "open-minded (adj): cởi mở",
                trans: "Bố mẹ tôi đủ cởi mở để lắng nghe ý kiến của tôi, ngay cả khi họ không đồng ý với tôi."
            },
            {
                q: "My sister had an __________ with our mother because they had different ideas about her weekend plans.",
                correct: "argument",
                distractors: ["disease", "fitness", "energy"],
                vocab: "argument (n): cuộc tranh cãi",
                trans: "Chị gái tôi đã có một cuộc tranh cãi với mẹ vì họ có những ý tưởng khác nhau về kế hoạch cuối tuần của chị ấy."
            },
            {
                q: "Some parents try to __________ their own ideas about clothes and hobbies on their children.",
                correct: "impose",
                distractors: ["examine", "obey", "follow"],
                vocab: "impose (v): áp đặt",
                trans: "Một số bậc cha mẹ cố gắng áp đặt những ý tưởng của chính họ về trang phục và sở thích lên con cái."
            },
            {
                q: "My brother wants to become a teacher and follow in our mother's __________.",
                correct: "footsteps",
                distractors: ["footpath", "steps", "tracks"],
                vocab: "follow in someone's footsteps (idiom): nối nghiệp, theo bước",
                trans: "Anh trai tôi muốn trở thành giáo viên và nối nghiệp mẹ của chúng tôi."
            },
            {
                q: "My grandmother thinks that wearing too many bright colours and expensive accessories looks __________.",
                correct: "flashy",
                distractors: ["mature", "open-minded", "nutritious"],
                vocab: "flashy (adj): hào nhoáng, phô trương",
                trans: "Bà tôi nghĩ rằng mặc quá nhiều màu sắc sặc sỡ và phụ kiện đắt tiền trông có vẻ hào nhoáng, phô trương."
            }
        ];

        let questionsData = [];
        let currentIndex = 0;
        let userAnswers = {};

        // Hàm xáo trộn mảng (Fisher-Yates Shuffle)
        function shuffleArray(array) {
            let arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Khởi tạo bài thi, xáo trộn câu hỏi và các lựa chọn đáp án thành 4 đáp án A, B, C, D
        function initQuiz() {
            let shuffledQuestions = shuffleArray(rawQuestionsData);

            questionsData = shuffledQuestions.map(item => {
                // Gom đáp án đúng và các phương án nhiễu thành một mảng 4 lựa chọn
                let allOptions = [item.correct, ...item.distractors];
                let shuffledOpts = shuffleArray(allOptions);
                let correctIndex = shuffledOpts.indexOf(item.correct);

                return {
                    q: item.q,
                    o: shuffledOpts,
                    a: correctIndex,
                    vocab: item.vocab,
                    trans: item.trans
                };
            });

            currentIndex = 0;
            userAnswers = {};
            renderQuestion();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderQuestion() {
            const container = document.getElementById('question-container');
            
            if (currentIndex >= questionsData.length) {
                renderResult();
                return;
            }

            const item = questionsData[currentIndex];
            const progressPercent = ((currentIndex + 1) / questionsData.length) * 100;
            document.getElementById('exam-progress-text').innerText = `Câu ${currentIndex + 1} / ${questionsData.length}`;
            document.getElementById('progress-bar').style.width = `${progressPercent}%`;

            const answered = userAnswers[currentIndex] !== undefined;
            const selectedOpt = userAnswers[currentIndex];

            container.innerHTML = `
                <div class="space-y-4">
                    <div class="font-bold text-base md:text-lg text-slate-100 leading-relaxed">
                        <span class="text-blue-400">Câu ${currentIndex + 1}:</span> ${item.q.replace('__________', '<u class="text-yellow-400 font-bold px-1">__________</u>')}
                    </div>
                    <div class="grid grid-cols-1 gap-2.5">
                        ${item.o.map((opt, oIdx) => {
                            let btnClass = "w-full text-left p-3.5 bg-slate-900/85 hover:bg-slate-700/80 border border-slate-700 rounded-xl flex items-center space-x-3 text-sm transition cursor-pointer option-btn";
                            if (answered) {
                                if (oIdx === item.a) {
                                    btnClass = "w-full text-left p-3.5 bg-emerald-950/80 border border-emerald-600 rounded-xl flex items-center space-x-3 text-sm text-emerald-200 font-semibold";
                                } else if (oIdx === selectedOpt && selectedOpt !== item.a) {
                                    btnClass = "w-full text-left p-3.5 bg-rose-950/80 border border-rose-600 rounded-xl flex items-center space-x-3 text-sm text-rose-200";
                                } else {
                                    btnClass = "w-full text-left p-3.5 bg-slate-900/40 border border-slate-800 rounded-xl flex items-center space-x-3 text-sm text-slate-500 opacity-60";
                                }
                            }
                            return `
                                <button type="button" ${answered ? 'disabled' : ''} onclick="handleSelect(${oIdx})" class="${btnClass}">
                                    <span class="w-7 h-7 flex-shrink-0 rounded-lg bg-slate-800 flex items-center justify-center font-bold text-blue-400 border border-slate-700 text-xs">${['A', 'B', 'C', 'D'][oIdx]}</span>
                                    <span class="flex-grow">${opt}</span>
                                </button>
                            `;
                        }).join('')}
                    </div>

                    <div id="feedback-box" class="${answered ? '' : 'hidden'} mt-4 p-4 rounded-xl border space-y-3 ${answered && selectedOpt === item.a ? 'bg-emerald-950/60 border-emerald-800 text-emerald-200' : 'bg-rose-950/60 border-rose-800 text-rose-200'}">
                        <div class="flex items-center space-x-2 font-bold ${answered && selectedOpt === item.a ? 'text-emerald-400' : 'text-rose-400'}">
                            <i class="fa-solid ${answered && selectedOpt === item.a ? 'fa-circle-check' : 'fa-circle-xmark'} text-lg"></i>
                            <span>${answered && selectedOpt === item.a ? 'Chính xác!' : `Chưa đúng! Đáp án đúng là: <b>${['A', 'B', 'C', 'D'][item.a]} (${item.o[item.a]})</b>`}</span>
                        </div>
                        <div class="text-xs text-slate-300 space-y-1.5 leading-relaxed bg-slate-900/60 p-3 rounded-lg border border-slate-800">
                            <div><b class="text-blue-300">Từ vựng:</b> <span class="text-yellow-300">${item.vocab}</span></div>
                            <div><b class="text-blue-300">Dịch nghĩa câu:</b> <i>"${item.trans}"</i></div>
                        </div>
                        <div class="pt-2 flex justify-between items-center">
                            <span class="text-xs text-slate-400 italic">Đã trả lời câu ${currentIndex + 1}</span>
                            <button type="button" onclick="nextQuestion()" class="px-5 py-2.5 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-lg text-xs transition inline-flex items-center space-x-2 cursor-pointer">
                                <span>${currentIndex < questionsData.length - 1 ? 'Câu tiếp theo' : 'Xem kết quả'}</span>
                                <i class="fa-solid fa-arrow-right"></i>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        function handleSelect(oIdx) {
            userAnswers[currentIndex] = oIdx;
            renderQuestion();
        }

        function nextQuestion() {
            currentIndex++;
            renderQuestion();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function renderResult() {
            let correctCount = 0;
            questionsData.forEach((item, idx) => {
                if (userAnswers[idx] === item.a) correctCount++;
            });

            const container = document.getElementById('question-container');
            document.getElementById('exam-progress-text').innerText = `Hoàn thành bài kiểm tra`;
            document.getElementById('progress-bar').style.width = `100%`;

            container.innerHTML = `
                <div class="text-center space-y-6 py-6">
                    <div class="w-20 h-20 bg-blue-500/20 text-blue-400 rounded-full flex items-center justify-center mx-auto border border-blue-500/30 text-3xl">
                        <i class="fa-solid fa-trophy"></i>
                    </div>
                    <div class="space-y-2">
                        <h3 class="text-2xl font-bold text-white">Kết Quả Bài Kiểm Tra</h3>
                        <p class="text-slate-300 text-base">
                            Số câu trả lời đúng của bạn: <span class="font-bold text-blue-400 text-xl">${correctCount} / ${questionsData.length}</span>
                            <span class="block text-xs text-slate-400 mt-1">(Điểm số tương ứng: ${(correctCount * (10 / questionsData.length)).toFixed(2)} / 10 điểm)</span>
                        </p>
                    </div>
                    
                    <div class="flex flex-wrap items-center justify-center gap-3 pt-2">
                        <button type="button" onclick="initQuiz()" class="px-6 py-3 bg-blue-600 hover:bg-blue-500 text-white font-bold rounded-xl shadow-lg transition text-sm inline-flex items-center space-x-2 cursor-pointer">
                            <i class="fa-solid fa-rotate-right"></i>
                            <span>Thử lại (Xáo trộn đề mới)</span>
                        </button>
                    </div>
                </div>
            `;
        }

        // Tự động khởi tạo khi load trang
        window.addEventListener('DOMContentLoaded', () => {
            initQuiz();
        });
    </script>
</body>
</html>
