<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Ngữ Văn · KTTX · Cuối kì 2 — Coming soon | Bá Khí</title>
<style>
:root{--bg:#070b18;--text:#e8ecff;--muted:#9aa6c8;--a:#818cf8;--b:#c084fc;--line:rgba(148,163,184,.16)}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;background:radial-gradient(1200px 700px at 18% -10%,#1b2350 0%,transparent 55%),radial-gradient(900px 600px at 100% 100%,#2a1550 0%,transparent 55%),var(--bg);color:var(--text);display:grid;place-items:center;padding:24px;overflow:hidden}
body::before{content:"";position:fixed;inset:0;background-image:linear-gradient(rgba(148,163,184,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(148,163,184,.05) 1px,transparent 1px);background-size:48px 48px;-webkit-mask-image:radial-gradient(circle at 50% 45%,#000 0%,transparent 72%);mask-image:radial-gradient(circle at 50% 45%,#000 0%,transparent 72%);pointer-events:none}
.soon{position:relative;width:min(560px,100%);text-align:center;padding:clamp(28px,5vw,48px) clamp(20px,4vw,40px);border:1px solid var(--line);border-radius:28px;background:linear-gradient(180deg,rgba(30,38,70,.82),rgba(12,17,34,.88));box-shadow:0 30px 80px -30px rgba(0,0,0,.9),inset 0 1px 0 rgba(255,255,255,.06);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.logo-wrap{position:relative;width:84px;height:84px;margin:0 auto 18px}
.logo-ring{position:absolute;inset:-7px;border-radius:26px;background:conic-gradient(from 0deg,transparent 0 18%,var(--a) 30%,var(--b) 55%,transparent 70%);filter:blur(1px);animation:spin 3.6s linear infinite;opacity:.85}
.logo{position:relative;width:84px;height:84px;border-radius:24px;display:grid;place-items:center;background:linear-gradient(145deg,#6366f1,#a855f7);box-shadow:0 16px 40px -12px rgba(129,140,248,.75);font-weight:800;font-size:30px;letter-spacing:.5px;color:#fff}
.logo::after{content:"";position:absolute;inset:0;border-radius:24px;background:linear-gradient(160deg,rgba(255,255,255,.35),transparent 45%);opacity:.5}
.brand{margin:0 0 4px;font-size:12px;font-weight:700;letter-spacing:.38em;color:#c7d2fe;text-transform:uppercase}
h1{margin:10px 0 8px;font-size:clamp(26px,5vw,36px);letter-spacing:-.02em}
.cat{display:inline-block;margin:0;padding:6px 12px;border-radius:999px;border:1px solid rgba(129,140,248,.35);background:rgba(99,102,241,.14);color:#c7d2fe;font-size:12px;font-weight:600}
.dots{display:flex;justify-content:center;gap:7px;margin:26px 0 12px}
.dots span{width:8px;height:8px;border-radius:50%;background:linear-gradient(180deg,#a5b4fc,#8b5cf6);animation:bounce 1.2s ease-in-out infinite}
.dots span:nth-child(2){animation-delay:.15s}.dots span:nth-child(3){animation-delay:.3s}
.msg{margin:0;font-size:clamp(20px,4vw,26px);font-weight:700;background:linear-gradient(90deg,#e0e7ff,#a5b4fc,#e9d5ff,#e0e7ff);background-size:220% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 4s linear infinite}
.sub{margin:10px auto 26px;max-width:38ch;color:var(--muted);font-size:13.5px;line-height:1.65}
.home{display:inline-flex;align-items:center;gap:8px;padding:11px 18px;border-radius:12px;text-decoration:none;font-size:13px;font-weight:600;color:#eef2ff;background:linear-gradient(135deg,#4f46e5,#7c3aed);box-shadow:0 12px 24px -12px rgba(99,102,241,.9);transition:transform .2s,box-shadow .2s}
.home:hover{transform:translateY(-1px);box-shadow:0 16px 30px -12px rgba(99,102,241,1)}
.home:focus-visible{outline:2px solid #a5b4fc;outline-offset:3px}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes bounce{0%,80%,100%{transform:translateY(0);opacity:.55}40%{transform:translateY(-6px);opacity:1}}
@keyframes shine{to{background-position:-220% 0}}
@media (prefers-reduced-motion:reduce){.logo-ring,.dots span,.msg{animation:none}.msg{color:#dbeafe;background:none;-webkit-text-fill-color:#dbeafe}}
</style>
<script src="../../../assets/bakhi/bk-bkt.js"></script>
</head>
<body>
<main class="soon">
  <div class="logo-wrap"><div class="logo-ring"></div><div class="logo">BK</div></div>
  <p class="brand">Bá Khí</p>
  <h1>Ngữ Văn</h1>
  <p class="cat">KTTX · Cuối kì 2</p>
  <div class="dots" aria-hidden="true"><span></span><span></span><span></span></div>
  <p class="msg">Coming soon...</p>
  <p class="sub">Trang này đang được hoàn thiện. Nội dung sẽ sớm xuất hiện — bạn quay lại sau nhé.</p>
  <a class="home" href="../../../index.html">← Về trang chủ</a>
</main>
</body>
</html>
