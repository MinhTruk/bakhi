<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2024%2024%22%20fill%3D%22none%22%20stroke%3D%22%236c8cff%22%20stroke-width%3D%221.8%22%3E%3Ccircle%20cx%3D%2212%22%20cy%3D%2212%22%20r%3D%221.8%22%20fill%3D%22%236c8cff%22/%3E%3Cellipse%20cx%3D%2212%22%20cy%3D%2212%22%20rx%3D%2210%22%20ry%3D%224%22/%3E%3Cellipse%20cx%3D%2212%22%20cy%3D%2212%22%20rx%3D%2210%22%20ry%3D%224%22%20transform%3D%22rotate%2860%2012%2012%29%22/%3E%3Cellipse%20cx%3D%2212%22%20cy%3D%2212%22%20rx%3D%2210%22%20ry%3D%224%22%20transform%3D%22rotate%28120%2012%2012%29%22/%3E%3C/svg%3E">
<title>Ôn tập Dao động điều hòa – Vật lí 11</title>
<style>
:root{--bg:#0d1017;--p1:#151a26;--p2:#1c2333;--bd:#2a3350;--tx:#e6e9f2;--mu:#8e98b5;--ac:#6c8cff;--ac2:#a47bff;--ok:#3ddc97;--bad:#ff6b7a;--wa:#ffc857}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(1200px 600px at 80% -10%,#1d2450 0,transparent 60%),var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
header{position:sticky;top:0;z-index:5;background:#0d1017ee;backdrop-filter:blur(8px);border-bottom:1px solid var(--bd)}
.bar{max-width:980px;margin:auto;padding:10px 16px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.logo{font-weight:700;margin-right:auto;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
nav button{background:none;border:1px solid transparent;color:var(--mu);padding:7px 12px;border-radius:10px;cursor:pointer;font:inherit;font-size:14px}
nav button:hover{color:var(--tx);background:var(--p2)}
nav button.on{color:#fff;background:linear-gradient(90deg,var(--ac),var(--ac2))}
main{max-width:980px;margin:auto;padding:20px 16px 60px}
.card{background:var(--p1);border:1px solid var(--bd);border-radius:16px;padding:20px;margin-bottom:16px}
h2{margin:0 0 12px;font-size:22px}h3{margin:18px 0 8px;font-size:16px;color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.stat{background:var(--p2);border:1px solid var(--bd);border-radius:14px;padding:14px}
.stat b{display:block;font-size:26px}.stat span{color:var(--mu);font-size:13px}
.btn{background:linear-gradient(90deg,var(--ac),var(--ac2));color:#fff;border:0;padding:10px 18px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer;transition:.15s}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}.btn:disabled{opacity:.4;cursor:not-allowed;transform:none}
.btn.g{background:var(--p2);border:1px solid var(--bd);color:var(--tx)}.btn.r{background:var(--bad);color:#210}
select{background:var(--p2);color:var(--tx);border:1px solid var(--bd);border-radius:10px;padding:8px 10px;font:inherit}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.pb{height:8px;background:var(--p2);border-radius:99px;overflow:hidden}.pb i{display:block;height:100%;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .4s}
.tp{display:grid;grid-template-columns:1fr 90px 70px;gap:10px;align-items:center;margin:9px 0;font-size:14px}
.tp small{color:var(--mu);text-align:right}
.qh{display:flex;justify-content:space-between;gap:10px;color:var(--mu);font-size:14px;margin-bottom:8px;flex-wrap:wrap}
.tag{background:var(--p2);border:1px solid var(--bd);border-radius:99px;padding:2px 10px;font-size:12px;color:var(--ac)}
.qt{font-size:18px;margin:16px 0}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:var(--p2);border:1px solid var(--bd);color:var(--tx);padding:12px 14px;border-radius:12px;margin:9px 0;cursor:pointer;font:inherit;transition:.15s}
.opt b{min-width:28px;height:28px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:13px;color:var(--mu)}
.opt:hover:not(:disabled){border-color:var(--ac);transform:translateX(4px)}
.opt.sel{border-color:var(--ac);background:#243062;box-shadow:0 0 0 2px #6c8cff55}
.opt.ok{border-color:var(--ok);background:#12382c}.opt.bad{border-color:var(--bad);background:#40191f}.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.fb{margin-top:14px;padding:14px;border-radius:12px;border:1px solid var(--bd);background:var(--p2);animation:in .3s}
.fb.ok{border-color:var(--ok)}.fb.bad{border-color:var(--bad)}.fb h4{margin:0 0 6px}
.fx{white-space:pre-line;color:#cdd3e8;font-size:15px}
.nv{display:flex;flex-wrap:wrap;gap:6px;margin-top:16px}
.nv button{width:34px;height:34px;border-radius:9px;border:1px solid var(--bd);background:var(--p2);color:var(--mu);cursor:pointer;font-size:13px}
.nv .cur{outline:2px solid var(--ac)}.nv .an{background:#243062;color:#fff}.nv .ok{background:#12382c;color:#fff}.nv .bad{background:#40191f;color:#fff}
.slide{animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hide{display:none}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;border-bottom:1px solid var(--bd);text-align:left}th{color:var(--mu);font-weight:500}
.big{font-size:44px;font-weight:800;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.wi{border-left:3px solid var(--bad);padding:6px 12px;margin:12px 0;background:var(--p2);border-radius:0 10px 10px 0}
.fm li{margin:5px 0;font-family:"Cambria Math","Segoe UI Symbol",serif;font-size:17px}
.fm ul{padding-left:20px}
dialog{background:var(--p1);color:var(--tx);border:1px solid var(--bd);border-radius:16px;max-width:420px}
dialog::backdrop{background:#000a}
.mu{color:var(--mu);font-size:14px}.tm{font-variant-numeric:tabular-nums;color:var(--wa);font-weight:700}

body::before,body::after{content:"";position:fixed;z-index:-1;width:520px;height:520px;border-radius:50%;filter:blur(90px);opacity:.18;pointer-events:none;animation:drift 18s ease-in-out infinite alternate}
body::before{background:var(--ac);top:-120px;left:-120px}
body::after{background:var(--ac2);bottom:-160px;right:-120px;animation-delay:-9s}
@keyframes drift{to{transform:translate(120px,80px) scale(1.2)}}
.vin{animation:in .4s ease}
.sr{animation:inr .35s cubic-bezier(.2,.8,.2,1)}.sl{animation:inl .35s cubic-bezier(.2,.8,.2,1)}
@keyframes inr{from{opacity:0;transform:translateX(40px)}to{opacity:1;transform:none}}
@keyframes inl{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
.sr .opt,.sl .opt{animation:optin .45s cubic-bezier(.2,.8,.2,1) both;animation-delay:var(--d,0ms)}
@keyframes optin{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.opt.ok{animation:pulse .55s}.opt.bad{animation:shake .45s}
@keyframes pulse{0%{transform:scale(1)}40%{transform:scale(1.03);box-shadow:0 0 0 6px #3ddc9744}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.pb i{animation:grow .8s ease-out;position:relative;overflow:hidden}
.pb i::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,#fff5,transparent);transform:translateX(-100%);animation:shine 2.4s infinite}
@keyframes shine{to{transform:translateX(100%)}}@keyframes grow{from{width:0}}
.btn:active{transform:scale(.96)}
.stat{transition:.2s}.stat:hover{transform:translateY(-3px);border-color:var(--ac)}
.nv button{transition:.15s}.nv button:hover{transform:scale(1.12)}
.nv .cur{animation:pop .3s}@keyframes pop{50%{transform:scale(1.25)}}
.cf{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.cf i{position:absolute;top:-14px;width:8px;height:14px;border-radius:2px;animation:fall linear forwards}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg)}}
.chk{display:flex;gap:8px;align-items:center;cursor:pointer;user-select:none}.chk input{accent-color:var(--ac);width:18px;height:18px}
.resume{border-color:var(--ac);box-shadow:0 0 0 1px #6c8cff44}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 3px;line-height:1.2;font-size:.95em}
.fr>span:first-child{border-bottom:1.5px solid currentColor;padding:0 4px}.fr>span:last-child{padding:0 4px}
.rad{display:inline-flex;align-items:stretch;vertical-align:middle}.rs{font-size:1.15em;line-height:1.1}
.rc{border-top:1.5px solid currentColor;padding:0 3px;margin-top:3px;display:inline-flex;align-items:center}
sub{font-size:.7em;line-height:0}

/* ===== Giao diện v3: bố cục + hiệu ứng ===== */
:root{--r:18px;--sh:0 10px 30px #0006}
main{max-width:1040px;padding:26px 18px 70px}
.bar{max-width:1040px;gap:14px;padding:12px 18px}
.logo{font-size:18px;letter-spacing:.2px;background-size:220% 100%;animation:flow 6s linear infinite}
@keyframes flow{to{background-position:220% 0}}
nav{display:flex;gap:4px;padding:4px;background:var(--p1);border:1px solid var(--bd);border-radius:14px;overflow-x:auto;max-width:100%;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{white-space:nowrap;border-radius:10px;padding:8px 13px;transition:.2s}
nav button.on{box-shadow:0 4px 16px #6c8cff55}
.card{border-radius:var(--r);padding:26px;box-shadow:var(--sh);transition:border-color .25s,transform .25s}
h2{font-size:24px;letter-spacing:.2px}
h3{display:flex;align-items:center;gap:8px;margin:26px 0 12px;font-size:15px;letter-spacing:.4px;text-transform:uppercase}
h3::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--bd),transparent)}
.grid{grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:14px}
.stat{padding:16px 18px;border-radius:14px;position:relative;overflow:hidden}
.stat::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:linear-gradient(var(--ac),var(--ac2))}
.stat b{font-size:28px;line-height:1.2}.stat span{display:block;margin-top:2px;line-height:1.35}
.grid>.stat{animation:optin .55s cubic-bezier(.2,.8,.2,1) both}
.grid>.stat:nth-child(2){animation-delay:.06s}.grid>.stat:nth-child(3){animation-delay:.12s}.grid>.stat:nth-child(4){animation-delay:.18s}.grid>.stat:nth-child(5){animation-delay:.24s}.grid>.stat:nth-child(6){animation-delay:.3s}
/* hero */
.hero{display:flex;gap:26px;align-items:center;flex-wrap:wrap;background:linear-gradient(135deg,#1b2350,#251a46 70%);border:1px solid #3a4580;border-radius:22px;padding:26px 28px;margin-bottom:16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border-radius:50%;background:radial-gradient(#a47bff55,transparent 70%);animation:drift 10s ease-in-out infinite alternate}
.hero h1{margin:0 0 6px;font-size:26px}.hero p{margin:0;color:#b8c0dd;max-width:460px}
.hero .ht{flex:1;min-width:240px;position:relative;z-index:1}
.hero .row{margin-top:16px}
.fl{display:inline-block;animation:float 3.2s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px) rotate(-6deg)}}
.ringw{position:relative;width:132px;height:132px;flex:none;z-index:1}
.ring{width:100%;height:100%;transform:rotate(-90deg)}
.rb{fill:none;stroke:#ffffff1a;stroke-width:9}.rf{fill:none;stroke:url(#gr);stroke-width:9;stroke-linecap:round;stroke-dasharray:276.46;animation:draw 1.3s cubic-bezier(.2,.8,.2,1) both}
@keyframes draw{from{stroke-dashoffset:276.46}}
.ringw .big{position:absolute;inset:0;display:grid;place-items:center;font-size:26px;-webkit-text-fill-color:#fff;color:#fff;background:none}
.ringw small{position:absolute;left:0;right:0;bottom:30px;text-align:center;color:var(--mu);font-size:11px}
/* chủ đề */
.tgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:12px}
.tp{grid-template-columns:1fr auto;gap:6px 10px;background:var(--p2);border:1px solid var(--bd);border-radius:12px;padding:12px 14px;margin:0;transition:.2s;animation:optin .5s both}
.tp:hover{border-color:var(--ac);transform:translateY(-2px)}
.tp .pb{grid-column:1/-1;order:3;height:7px}.tp small{white-space:nowrap}
.tgrid .tp:nth-child(2n){animation-delay:.07s}.tgrid .tp:nth-child(3n){animation-delay:.14s}
table{border-radius:12px;overflow:hidden}th{background:var(--p2);font-size:12px;text-transform:uppercase;letter-spacing:.5px}
tr:hover td{background:#ffffff08}
/* setup */
#v-setup .card{max-width:640px;margin:10px auto;text-align:left;border-top:3px solid var(--ac)}
#v-setup .row{margin-top:18px}#v-setup .btn{padding:12px 28px;font-size:16px}
.chk{background:var(--p2);border:1px solid var(--bd);padding:9px 14px;border-radius:12px;transition:.2s}.chk:hover{border-color:var(--ac)}
/* làm bài */
#v-quiz .card{max-width:820px;margin:0 auto;padding:24px 26px}
.qh{font-size:13px}.qh b{color:var(--tx)}
.qt{font-size:20px;line-height:1.65;margin:14px 0 18px;padding:16px 18px;background:#ffffff06;border-left:3px solid var(--ac2);border-radius:0 12px 12px 0}
.opt{padding:14px 16px;font-size:17px;border-radius:14px;position:relative;overflow:hidden}
.opt b{min-width:32px;height:32px;font-size:14px;transition:.2s}
.opt:hover:not(:disabled) b,.opt.sel b{background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;transform:scale(1.1)}
.opt.ok b{background:var(--ok);color:#06281a}.opt.bad b{background:var(--bad);color:#2a0a0f}
.opt::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,#ffffff12,transparent 70%);transform:translateX(-120%);transition:transform .6s}
.opt:hover:not(:disabled)::after{transform:translateX(120%)}
#v-quiz .row{margin-top:20px}#prev,#next,#fin,#sub{min-width:130px}
.nv{padding:14px;background:var(--p2);border:1px solid var(--bd);border-radius:14px;margin-top:20px;max-height:132px;overflow:auto}
.fb{border-left-width:4px;border-radius:14px}.fb.ok{background:#0f2e25}.fb.bad{background:#34171d}
/* kết quả */
.rwrap{display:flex;gap:24px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.rwrap .ringw{width:150px;height:150px}.rwrap .big{font-size:25px}
.wi{border-radius:0 14px 14px 0;animation:optin .5s both}
dialog[open]{animation:in .25s}dialog::backdrop{backdrop-filter:blur(3px)}
@media(max-width:600px){main{padding:16px 12px 60px}.card{padding:18px}.hero{padding:20px}.bar{padding:10px 12px}.logo{width:100%}.qt{font-size:18px;padding:13px 14px}.opt{font-size:16px;padding:12px}#prev,#next,#fin,#sub{flex:1;min-width:0}.tgrid{grid-template-columns:1fr}}

/* ===== v4: thanh bên, icon SVG, nhạc nền ===== */
.ic{width:1.15em;height:1.15em;vertical-align:-.22em;flex:none}
body{padding-left:236px}
#side{position:fixed;left:0;top:0;bottom:0;width:236px;padding:20px 14px;display:flex;flex-direction:column;gap:20px;background:linear-gradient(180deg,#131a2b,#0d1120);border-right:1px solid var(--bd);z-index:10}
.brand{display:flex;gap:12px;align-items:center;padding:4px 8px}
.brand .lg{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;box-shadow:0 6px 18px #6c8cff55}
.brand .lg svg{width:28px;height:28px;animation:spin 16s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.brand b{display:block;font-size:15px;line-height:1.25}.brand small{color:var(--mu);font-size:12px}
nav{display:flex;flex-direction:column;gap:6px;background:none;border:0;padding:0;overflow:visible;max-width:none}
nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 14px;border-radius:12px;font-size:15px;color:var(--mu);position:relative;border:1px solid transparent;background:none;transition:.22s}
nav button .ic{width:20px;height:20px;transition:.25s}
nav button:hover{background:var(--p2);color:var(--tx);transform:translateX(3px)}
nav button.on{background:linear-gradient(90deg,#6c8cff2e,#a47bff1a);color:#fff;border-color:#6c8cff55;box-shadow:none}
nav button.on::before{content:"";position:absolute;left:-15px;top:22%;bottom:22%;width:4px;border-radius:0 4px 4px 0;background:linear-gradient(var(--ac),var(--ac2));animation:in .3s}
nav button.on .ic{color:var(--ac);transform:scale(1.15)}
.sidefoot{margin-top:auto;font-size:12px;color:var(--mu);padding:0 8px;line-height:1.4}
.fl .ic{width:1em;height:1em}.hero h1 .ic{color:#a9b8ff}
h2 .ic,h3 .ic{color:var(--ac)}
.fb h4{display:flex;align-items:center;gap:8px}.fb.ok h4 .ic{color:var(--ok)}.fb.bad h4 .ic{color:var(--bad)}
.tm{display:inline-flex;gap:6px;align-items:center}
.chk .ic{color:var(--ac)}
/* nhạc nền */
.mp{position:fixed;right:18px;bottom:18px;z-index:30;display:flex;flex-direction:column;align-items:flex-end;gap:10px}
.mpb{width:52px;height:52px;border-radius:50%;border:0;background:linear-gradient(135deg,var(--ac),var(--ac2));color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 8px 24px #6c8cff55;transition:.2s}
.mpb:hover{transform:scale(1.08)}.mpb .ic{width:24px;height:24px}
.mp.playing .mpb{animation:beat 1.6s ease-in-out infinite}
@keyframes beat{50%{box-shadow:0 0 0 10px #6c8cff26,0 8px 24px #6c8cff55}}
.mpp{width:300px;background:var(--p1);border:1px solid var(--bd);border-radius:16px;padding:14px;box-shadow:var(--sh);display:none}
.mp.open .mpp{display:block;animation:optin .3s both}
.mpp .t{display:flex;gap:10px;align-items:center}.mpp .tn{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mpp .r2{display:flex;gap:10px;align-items:center;margin-top:12px}.mpp input[type=range]{flex:1;accent-color:var(--ac)}
.mpp .r3{display:flex;gap:8px;margin-top:12px}.mpp .r3 .btn{padding:8px 12px;font-size:13px;display:inline-flex;gap:6px;align-items:center}
.mpp .hint{margin:10px 0 0;font-size:12px;color:var(--mu);line-height:1.45}
.ib{width:40px;height:40px;border-radius:50%;border:1px solid var(--bd);background:var(--p2);color:var(--tx);display:grid;place-items:center;cursor:pointer;flex:none;transition:.2s}
.ib.pl{background:linear-gradient(135deg,var(--ac),var(--ac2));border:0;color:#fff}.ib:hover{transform:scale(1.08)}
.eq{display:flex;gap:3px;align-items:flex-end;height:16px;flex:none}.eq i{width:3px;background:var(--ac);border-radius:2px;height:4px}
.mp.playing .eq i{animation:eq .9s ease-in-out infinite}.eq i:nth-child(2){animation-delay:.2s}.eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{50%{height:16px}}
@media(max-width:820px){
 body{padding-left:0}
 #side{top:auto;width:auto;right:0;bottom:0;flex-direction:row;gap:0;padding:6px 6px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--bd);background:#0d1120f2;backdrop-filter:blur(10px)}
 .brand,.sidefoot{display:none}
 nav{flex-direction:row;width:100%;gap:2px}
 nav button{flex-direction:column;gap:3px;padding:7px 2px;font-size:10.5px;text-align:center;justify-content:center;flex:1;min-width:0;border-radius:10px}
 nav button:hover{transform:none}
 nav button.on::before{left:28%;right:28%;top:-7px;bottom:auto;width:auto;height:3px;border-radius:0 0 4px 4px}
 main{padding-bottom:104px}
 .mp{bottom:84px;right:12px}.mpp{width:min(300px,calc(100vw - 24px))}
}

/* toggle xáo trộn + ô link nhạc */
.chk{gap:12px}
.chk input{appearance:none;-webkit-appearance:none;width:44px;height:25px;border-radius:99px;background:#2a3350;position:relative;cursor:pointer;transition:background .25s;flex:none;border:0}
.chk input::after{content:"";position:absolute;top:3px;left:3px;width:19px;height:19px;border-radius:50%;background:#fff;transition:transform .25s cubic-bezier(.2,.8,.2,1);box-shadow:0 2px 6px #0006}
.chk input:checked{background:linear-gradient(90deg,var(--ac),var(--ac2))}
.chk input:checked::after{transform:translateX(19px)}
.chk input:focus-visible{outline:2px solid var(--ac);outline-offset:2px}

<script>
/* ============ NGÂN HÀNG CÂU HỎI ============
 Thêm câu mới: thêm một dòng q(chủ_đề, "câu hỏi", "đáp án đúng", ["sai1","sai2","sai3"], "lời giải") vào mảng Q.
 Chủ đề là chỉ số trong mảng TOPICS (0–9). Ứng dụng tự xáo/cân bằng vị trí đáp án và cập nhật thống kê. */
const TOPICS=["Chọn công thức đúng","Tìm đại lượng còn thiếu","Chu kỳ, tần số, tần số góc","Vận tốc, gia tốc tại li độ","Trạng thái chuyển động","Động năng, thế năng, cơ năng","Con lắc lò xo","Con lắc đơn","Thời gian và số dao động","Bài toán kết hợp"];
const Q=[];
function q(t,text,ok,w,ex){Q.push({t,q:text,o:[ok,...w],e:ex})}
/* --- 0. Chọn công thức đúng --- */
q(0,"Công thức nào biểu diễn đúng gia tốc theo li độ của dao động điều hòa?","a = −ω²x",["a = ω²x","a = −ωx","a = −ω²x²"],"Từ a = −ω²Acos(ωt+φ) và x = Acos(ωt+φ) suy ra a = −ω²x: gia tốc ngược dấu và tỉ lệ bậc nhất với li độ.");
q(0,"Hệ thức nào đúng giữa vận tốc v và li độ x (biên độ A, tần số góc ω)?","v² = ω²(A² − x²)",["v² = ω²(A² + x²)","v² = ω(A² − x²)","v² = ω²(x² − A²)"],"Từ x² + v²/ω² = A² suy ra v² = ω²(A² − x²). Hai phương án sai kia sai dấu hoặc sai lũy thừa của ω.");
q(0,"Chu kỳ dao động của con lắc lò xo (khối lượng m, độ cứng k) là","T = 2π√(m/k)",["T = 2π√(k/m)","T = (1/2π)√(m/k)","T = 2π√(mk)"],"ω = √(k/m) nên T = 2π/ω = 2π√(m/k). Nhầm phổ biến là đảo m và k.");
q(0,"Thế năng của con lắc đơn (mốc ở vị trí thấp nhất) có biểu thức","Wt = mgl(1 − cos α)",["Wt = mgl(1 + cos α)","Wt = mgl sin α","Wt = ½mgl cos α"],"Độ cao so với vị trí thấp nhất là l(1 − cos α) nên Wt = mgl(1 − cos α).");
q(0,"Phát biểu nào đúng về quan hệ pha giữa x, v, a?","Vận tốc sớm pha π/2 so với li độ",["Vận tốc trễ pha π/2 so với li độ","Gia tốc cùng pha với li độ","Gia tốc trễ pha π/2 so với vận tốc"],"v = ωAcos(ωt+φ+π/2) sớm pha π/2 hơn x; a sớm pha π/2 hơn v và ngược pha với x.");
q(0,"Hệ thức độc lập với thời gian nào liên hệ giữa v và a?","v²/(ω²A²) + a²/(ω⁴A²) = 1",["v²/(ω²A²) + a²/(ω²A²) = 1","v²/(ω²A²) − a²/(ω⁴A²) = 1","v²/(ω⁴A²) + a²/(ω²A²) = 1"],"v_max = ωA và |a|_max = ω²A, và v, a lệch pha π/2 nên (v/v_max)² + (a/a_max)² = 1.");
q(0,"Cơ năng của vật dao động điều hòa (con lắc lò xo) được viết đúng là","W = ½mω²A² = ½kA²",["W = ½mωA² = ½kA","W = ½mω²x² = ½kx²","W = ½mω²A = ½kA²"],"Cơ năng bằng động năng cực đại và bằng thế năng cực đại: W = ½mω²A² = ½kA². Biểu thức ½kx² chỉ là thế năng tại li độ x.");
q(0,"Tỉ số giữa động năng và cơ năng khi vật ở li độ x là","Wđ/W = 1 − x²/A²",["Wđ/W = x²/A²","Wđ/W = 1 − x/A","Wđ/W = 1 + x²/A²"],"Wđ = ½k(A² − x²) và W = ½kA² nên Wđ/W = 1 − x²/A². Còn x²/A² là tỉ số thế năng.");
q(0,"Tần số góc của con lắc đơn dao động nhỏ (chiều dài l, gia tốc trọng trường g) là","ω = √(g/l)",["ω = √(l/g)","ω = √(gl)","ω = g/l"],"Từ Wt ≈ ½m(g/l)s² so với ½mω²s² suy ra ω² = g/l, tức ω = √(g/l), T = 2π√(l/g).");
q(0,"Tốc độ trung bình của vật trong một chu kỳ dao động (biên độ A, chu kỳ T) là","v_tb = 4A/T",["v_tb = 2A/T","v_tb = A/T","v_tb = 0"],"Trong một chu kỳ vật đi quãng đường S = 4A trong thời gian T nên v_tb = 4A/T. (Vận tốc trung bình mới bằng 0.)");
/* --- 1. Tìm đại lượng còn thiếu --- */
q(1,"Vật dao động điều hòa với A = 0,05 m, ω = 10 rad/s. Khi li độ x = 0,03 m, độ lớn vận tốc là","0,40 m/s",["0,50 m/s","0,30 m/s","0,58 m/s"],"|v| = ω√(A² − x²) = 10·√(0,0025 − 0,0009) = 10·0,04 = 0,40 m/s. 0,50 là ωA; 0,30 là ωx; 0,58 do cộng A² + x².");
q(1,"Vật dao động điều hòa có ω = 5 rad/s. Tại li độ x = 0,03 m vật có tốc độ 0,20 m/s. Biên độ dao động là","0,05 m",["0,07 m","0,04 m","0,01 m"],"A² = x² + v²/ω² = 0,0009 + 0,0016 = 0,0025 ⇒ A = 0,05 m. Sai phổ biến: cộng trực tiếp x + v/ω = 0,07.");
q(1,"Biên độ A = 0,1 m. Tại li độ x = 0,06 m vật có tốc độ 0,32 m/s. Tần số góc là","4,0 rad/s",["5,3 rad/s","3,2 rad/s","8,0 rad/s"],"ω = |v|/√(A² − x²) = 0,32/0,08 = 4,0 rad/s. 5,3 = |v|/x; 3,2 = |v|/A; 8,0 = |v|/(A − x)².");
q(1,"Vật dao động điều hòa có tốc độ cực đại 0,6 m/s và tần số góc 3 rad/s. Độ lớn gia tốc cực đại là","1,8 m/s²",["0,2 m/s²","5,4 m/s²","3,6 m/s²"],"|a|_max = ω²A = ω·v_max = 3·0,6 = 1,8 m/s². 0,2 là biên độ A; 5,4 = ω²·v_max.");
q(1,"Một vật dao động điều hòa có tần số góc 20 rad/s. Tại li độ x = +0,03 m gia tốc của vật là","−12 m/s²",["+12 m/s²","−0,6 m/s²","−400 m/s²"],"a = −ω²x = −400·0,03 = −12 m/s². Gia tốc ngược dấu li độ; −0,6 là −ωx.");
q(1,"Vật dao động điều hòa có v_max = 0,4 m/s và |a|_max = 2 m/s². Biên độ dao động là","0,08 m",["0,20 m","0,16 m","0,04 m"],"ω = a_max/v_max = 5 rad/s; A = v_max/ω = 0,08 m (hay A = v²_max/a_max). 0,20 = v_max/a_max = 1/ω.");
q(1,"Vật dao động điều hòa có tốc độ cực đại 0,2 m/s. Khi vật ở li độ x = A/2, độ lớn vận tốc xấp xỉ","0,17 m/s",["0,10 m/s","0,15 m/s","0,14 m/s"],"|v| = ω√(A² − A²/4) = (√3/2)ωA = 0,866·0,2 ≈ 0,17 m/s. 0,10 là v_max/2.");
q(1,"Biên độ A = 0,1 m. Tại thời điểm tốc độ bằng một nửa tốc độ cực đại thì |x| xấp xỉ","0,087 m",["0,050 m","0,071 m","0,058 m"],"v² = v²_max/4 ⇒ 1 − x²/A² = 1/4 ⇒ |x| = A√3/2 ≈ 0,087 m. 0,050 là A/2; 0,071 là A/√2 (ứng với Wđ = Wt).");
q(1,"Tại li độ x = +0,01 m, gia tốc của vật dao động điều hòa là a = −4 m/s². Tần số dao động của vật xấp xỉ","3,18 Hz",["6,37 Hz","20,0 Hz","126 Hz"],"ω² = −a/x = 400 ⇒ ω = 20 rad/s ⇒ f = ω/2π = 10/π ≈ 3,18 Hz. 20 là ω, 126 = 2π·ω.");
q(1,"Vật có A = 0,02 m, ω = 10 rad/s. Tại thời điểm gia tốc a = −1,2 m/s², độ lớn vận tốc là","0,16 m/s",["0,12 m/s","0,08 m/s","0,04 m/s"],"v_max = 0,2 m/s; a_max = 2 m/s². (v/v_max)² = 1 − (1,2/2)² = 0,64 ⇒ |v| = 0,8·0,2 = 0,16 m/s. 0,12 = 0,6·v_max (nhầm tỉ số).");
/* --- 2. Chu kỳ, tần số, tần số góc --- */
q(2,"Vật dao động điều hòa theo phương trình x = 4cos(10πt + π/3) (cm; t tính bằng s). Chu kỳ dao động là","0,2 s",["0,63 s","5,0 s","0,1 s"],"T = 2π/ω = 2π/(10π) = 0,2 s. 0,63 s xảy ra khi quên π; 5 s là tần số f.");
q(2,"Một vật dao động điều hòa với tần số 2,5 Hz. Tần số góc của vật xấp xỉ","15,7 rad/s",["7,85 rad/s","2,5 rad/s","0,4 rad/s"],"ω = 2πf = 2π·2,5 = 5π ≈ 15,7 rad/s. 7,85 = πf; 0,4 là chu kỳ T.");
q(2,"Trong 12 s một vật thực hiện 30 dao động toàn phần. Tần số dao động là","2,5 Hz",["0,4 Hz","5,0 Hz","18 Hz"],"f = N/t = 30/12 = 2,5 Hz (T = 0,4 s). Nhầm phổ biến là lấy chu kỳ làm tần số.");
q(2,"Vật dao động điều hòa với tần số góc 20 rad/s. Chu kỳ dao động xấp xỉ","0,314 s",["0,050 s","3,18 s","0,628 s"],"T = 2π/ω = 2π/20 ≈ 0,314 s. 0,05 = 1/ω (quên 2π); 0,628 = 4π/ω.");
q(2,"Khi chu kỳ dao động điều hòa tăng 4 lần thì tần số góc","giảm 4 lần",["tăng 4 lần","giảm 2 lần","tăng 2 lần"],"ω = 2π/T tỉ lệ nghịch với T; T tăng 4 lần thì ω giảm 4 lần (không có căn).");
q(2,"Vật dao động điều hòa theo phương trình x = 3cos(πt/2 − π/4) (cm; t tính bằng s). Tần số là","0,25 Hz",["0,50 Hz","4,00 Hz","1,57 Hz"],"ω = π/2 rad/s ⇒ f = ω/2π = 0,25 Hz. 0,50 = ω/π; 4 là chu kỳ; 1,57 là ω.");
q(2,"Vận tốc của một vật dao động điều hòa có dạng v = −20π sin(5πt) (cm/s; t tính bằng s). Chu kỳ dao động là","0,4 s",["2,5 s","1,26 s","0,2 s"],"ω = 5π rad/s ⇒ T = 2π/ω = 0,4 s. 2,5 là tần số; 1,26 = 2π/5 (nhầm ω = 5).");
q(2,"Một vật dao động điều hòa với tần số 5 Hz. Gia tốc của vật biến thiên tuần hoàn với chu kỳ","0,2 s",["0,1 s","0,4 s","5 s"],"x, v, a cùng tần số góc nên cùng chu kỳ: T = 1/f = 0,2 s. Không có hiện tượng nhân đôi chu kỳ như động năng.");
q(2,"Vật 1 có chu kỳ 0,6 s; vật 2 có tần số 2 Hz (cả hai dao động điều hòa). Tỉ số ω₁/ω₂ là","0,83",["1,20","0,30","3,33"],"ω ∝ f: f₁ = 1/0,6 ≈ 1,667 Hz; ω₁/ω₂ = f₁/f₂ = 0,83. 1,20 là nghịch đảo; 0,30 = T₁/f₂.");
q(2,"Vật dao động điều hòa có biên độ 0,05 m và tốc độ cực đại 0,5π m/s. Tần số dao động là","5,0 Hz",["10 Hz","31,4 Hz","0,2 Hz"],"ω = v_max/A = 10π rad/s ⇒ f = ω/2π = 5 Hz. 10 = ω/π; 31,4 là ω; 0,2 là T.");
/* --- 3. Vận tốc, gia tốc tại li độ --- */
q(3,"Vật có A = 0,1 m, ω = 10 rad/s. Tại li độ x = 0,06 m, độ lớn vận tốc là","0,80 m/s",["1,00 m/s","0,60 m/s","1,17 m/s"],"|v| = ω√(A² − x²) = 10·√(0,01 − 0,0036) = 0,80 m/s. 1,00 là ωA; 0,60 là ωx; 1,17 do dùng A² + x².");
q(3,"Vật có ω = 5 rad/s. Tại li độ x = −0,04 m, gia tốc của vật là","+1,0 m/s²",["−1,0 m/s²","+0,2 m/s²","−0,2 m/s²"],"a = −ω²x = −25·(−0,04) = +1,0 m/s². Li độ âm thì gia tốc dương.");
q(3,"Vật có biên độ 0,2 m và tần số góc 4 rad/s. Độ lớn gia tốc ở vị trí biên là","3,2 m/s²",["0,8 m/s²","0,0 m/s²","1,6 m/s²"],"|a|_max = ω²A = 16·0,2 = 3,2 m/s². 0,8 là ωA (tốc độ cực đại); 0 là gia tốc ở VTCB.");
q(3,"Vật có A = 0,05 m, ω = 20 rad/s. Khi đi qua vị trí cân bằng, giá trị đúng là","|v| = 1,0 m/s; a = 0",["|v| = 0; a = 20 m/s²","|v| = 1,0 m/s; a = 20 m/s²","|v| = 0; a = 0"],"Tại VTCB x = 0 nên a = −ω²x = 0 và |v| = v_max = ωA = 1,0 m/s. Phương án 1 là giá trị tại biên.");
q(3,"Tại li độ x = +0,04 m vật có vận tốc v = −0,3 m/s; biên độ A = 0,05 m. Gia tốc tại thời điểm đó là","−4,0 m/s²",["+4,0 m/s²","−0,4 m/s²","−5,0 m/s²"],"ω = |v|/√(A² − x²) = 0,3/0,03 = 10 rad/s ⇒ a = −ω²x = −100·0,04 = −4,0 m/s². −5,0 là gia tốc cực đại ω²A.");
q(3,"Khi vật dao động điều hòa có tốc độ bằng một nửa tốc độ cực đại, độ lớn gia tốc so với gia tốc cực đại xấp xỉ","0,87 lần",["0,50 lần","0,71 lần","0,75 lần"],"(v/v_max)² + (a/a_max)² = 1 ⇒ |a|/a_max = √(1 − 1/4) = √3/2 ≈ 0,87.");
q(3,"Vật có A = 0,1 m, ω = 10 rad/s. Tại thời điểm tốc độ là 0,6 m/s, độ lớn gia tốc là","8,0 m/s²",["6,0 m/s²","10 m/s²","4,8 m/s²"],"A² − x² = v²/ω² = 0,0036 ⇒ x² = 0,0064, |x| = 0,08 m ⇒ |a| = ω²|x| = 8,0 m/s². 10 m/s² là a_max.");
q(3,"Vật dao động theo phương trình x = 0,1cos(10t) (m; t tính bằng s). Tại t = 0 giá trị đúng là","v = 0; a = −10 m/s²",["v = 1,0 m/s; a = 0","v = 0; a = +10 m/s²","v = −1,0 m/s; a = −10 m/s²"],"Tại t = 0: x = A = 0,1 m (biên dương) ⇒ v = −ωA sin 0 = 0 và a = −ω²x = −100·0,1 = −10 m/s².");
q(3,"Vật dao động theo phương trình x = 0,04cos(5πt) (m; t tính bằng s). Vận tốc tại t = 0,1 s xấp xỉ","−0,63 m/s",["+0,63 m/s","0,00 m/s","−0,20 m/s"],"Pha = 5π·0,1 = π/2 ⇒ v = −ωA sin(π/2) = −5π·0,04 ≈ −0,63 m/s. −0,20 là do quên π.");
q(3,"Vật dao động theo phương trình x = 0,05cos(20t + π/3) (m; t tính bằng s). Gia tốc tại t = 0 là","−10 m/s²",["+10 m/s²","−17,3 m/s²","−20 m/s²"],"Tại t = 0: x = 0,05cos(π/3) = 0,025 m ⇒ a = −ω²x = −400·0,025 = −10 m/s². −20 là −a_max; −17,3 do dùng sin.");
/* --- 4. Trạng thái chuyển động --- */
q(4,"Khi vật dao động điều hòa đi qua vị trí cân bằng thì","tốc độ cực đại, gia tốc bằng 0",["tốc độ bằng 0, gia tốc cực đại","tốc độ cực đại, gia tốc cực đại","tốc độ và gia tốc đều bằng 0"],"Tại VTCB x = 0 ⇒ a = −ω²x = 0 và |v| = ωA là lớn nhất.");
q(4,"Vật dao động điều hòa đang chuyển động từ vị trí biên về vị trí cân bằng. Mô tả đúng là","nhanh dần, độ lớn gia tốc giảm",["nhanh dần, độ lớn gia tốc tăng","chậm dần, độ lớn gia tốc giảm","chậm dần, độ lớn gia tốc tăng"],"|x| giảm nên |a| = ω²|x| giảm; |v| = ω√(A² − x²) tăng ⇒ chuyển động nhanh dần (không đều).");
q(4,"Tại một thời điểm vật có li độ x > 0 và vận tốc v < 0. Mô tả đúng là","đi theo chiều âm, tiến về VTCB, nhanh dần",["đi theo chiều âm, ra biên, chậm dần","đi theo chiều dương, ra biên, chậm dần","đi theo chiều dương, về VTCB, nhanh dần"],"v < 0 ⇒ chiều âm; vật ở phần dương và đi theo chiều âm ⇒ đang tiến về VTCB nên |v| tăng.");
q(4,"Trong dao động điều hòa, vật chuyển động nhanh dần khi","v và a cùng dấu",["v và x cùng dấu","a và x cùng dấu","v và a ngược dấu"],"Nhanh dần khi v·a > 0. Vì a = −ω²x nên điều đó tương đương v·x < 0. Còn a và x luôn trái dấu.");
q(4,"Khi vật dao động điều hòa ở biên dương (x = +A) thì","v = 0 và a = −ω²A",["v = 0 và a = +ω²A","v = ωA và a = 0","v = −ωA và a = 0"],"Tại biên v = 0 (v_min); a = −ω²x = −ω²A (độ lớn cực đại, hướng về VTCB).");
q(4,"Lúc t = 0 vật qua VTCB theo chiều dương. Pha ban đầu φ trong x = Acos(ωt + φ), với −π < φ ≤ π, là","−π/2",["+π/2","0","π"],"x(0) = Acosφ = 0 ⇒ φ = ±π/2; v(0) = −ωA sinφ > 0 ⇒ sinφ < 0 ⇒ φ = −π/2.");
q(4,"Lúc t = 0 vật có li độ x = A/2 và đang chuyển động theo chiều âm. Pha ban đầu φ (−π < φ ≤ π) là","π/3",["−π/3","2π/3","π/6"],"cosφ = 1/2 ⇒ φ = ±π/3; v < 0 ⇒ −ωA sinφ < 0 ⇒ sinφ > 0 ⇒ φ = +π/3.");
q(4,"Đồ thị biểu diễn gia tốc a theo li độ x của dao động điều hòa là","đường thẳng đi qua gốc, dốc xuống",["đường elip","đường parabol","đường thẳng đi qua gốc, dốc lên"],"a = −ω²x là hàm bậc nhất của x với hệ số góc âm −ω², đi qua gốc tọa độ.");
q(4,"Từ hệ thức x²/A² + v²/(ω²A²) = 1, đồ thị biểu diễn v theo x có dạng","elip",["parabol","đường thẳng","hypebol"],"Phương trình có dạng elip với bán trục A (theo x) và ωA (theo v).");
q(4,"Gia tốc của vật dao động điều hòa luôn hướng","về vị trí cân bằng",["về biên dương","theo chiều chuyển động","ra xa vị trí cân bằng"],"a = −ω²x nên a luôn ngược dấu với li độ, tức luôn hướng về VTCB (không phải theo chiều chuyển động).");
/* --- 5. Động năng, thế năng, cơ năng --- */
q(5,"Vật m = 0,2 kg dao động điều hòa với ω = 10 rad/s, biên độ A = 0,1 m. Cơ năng là","0,10 J",["0,010 J","0,20 J","1,0 J"],"W = ½mω²A² = ½·0,2·100·0,01 = 0,10 J.");
q(5,"Vật m = 0,2 kg, ω = 10 rad/s, A = 0,1 m. Động năng khi li độ x = 0,06 m là","0,064 J",["0,036 J","0,100 J","0,136 J"],"Wđ = ½mω²(A² − x²) = 10·(0,01 − 0,0036) = 0,064 J. 0,036 là thế năng; 0,100 là cơ năng; 0,136 dùng A² + x².");
q(5,"Con lắc lò xo có k = 50 N/m, biên độ 0,08 m. Khi li độ x = 0,04 m, động năng là","0,12 J",["0,04 J","0,16 J","0,08 J"],"W = ½kA² = 0,16 J; Wt = ½kx² = 0,04 J; Wđ = W − Wt = 0,12 J. 0,04 là thế năng; 0,08 = W/2.");
q(5,"Khi li độ x = A/2, tỉ số động năng trên thế năng Wđ/Wt bằng","3",["1/3","3/4","4"],"Wt/W = x²/A² = 1/4 ⇒ Wđ/W = 3/4 ⇒ Wđ/Wt = 3. 3/4 là Wđ/W, 1/3 là nghịch đảo.");
q(5,"Vật dao động điều hòa với biên độ 0,1 m. Khi động năng bằng thế năng, |x| xấp xỉ","0,071 m",["0,050 m","0,087 m","0,025 m"],"Wđ = Wt = W/2 ⇒ ½kx² = ¼kA² ⇒ |x| = A/√2 ≈ 0,071 m. 0,050 ứng với Wđ = 3Wt; 0,087 ứng với Wt = 3W/4 (khi đó Wđ = W/4).");
q(5,"Vật m = 0,1 kg có cơ năng 0,05 J. Khi thế năng bằng 0,03 J thì tốc độ của vật xấp xỉ","0,63 m/s",["0,40 m/s","1,00 m/s","0,77 m/s"],"Wđ = W − Wt = 0,02 J = ½mv² ⇒ v² = 0,4 ⇒ v ≈ 0,63 m/s. 0,77 tính từ Wt; 1,00 tính từ W.");
q(5,"Khi biên độ dao động điều hòa tăng gấp 2 lần (các đại lượng khác không đổi) thì cơ năng","tăng 4 lần",["tăng 2 lần","tăng 8 lần","không đổi"],"W = ½kA² tỉ lệ với A², nên A tăng 2 lần thì W tăng 4 lần.");
q(5,"Con lắc lò xo có k = 100 N/m, cơ năng 0,08 J. Biên độ dao động là","0,04 m",["0,028 m","0,0016 m","0,08 m"],"W = ½kA² ⇒ A = √(2W/k) = √0,0016 = 0,04 m. 0,028 do quên hệ số 2; 0,0016 là A².");
q(5,"Con lắc lò xo giữ nguyên k và A nhưng khối lượng vật tăng gấp 4 lần. Cơ năng của con lắc","không đổi",["tăng 4 lần","giảm 4 lần","tăng 2 lần"],"W = ½kA² chỉ phụ thuộc k và A, không phụ thuộc m (m chỉ làm thay đổi ω và T).");
q(5,"Vật m = 0,1 kg dao động điều hòa với ω = 20 rad/s. Thế năng tại li độ x = 0,05 m là","0,050 J",["0,100 J","0,0025 J","1,0 J"],"Wt = ½mω²x² = ½·0,1·400·0,0025 = 0,050 J. 1,0 J là ½mω²x (thiếu bình phương).");
/* --- 6. Con lắc lò xo --- */
q(6,"Con lắc lò xo có m = 0,1 kg, k = 40 N/m. Chu kỳ dao động là","0,314 s",["3,18 s","0,050 s","0,628 s"],"T = 2π√(m/k) = 2π√0,0025 = 2π·0,05 ≈ 0,314 s. 0,050 do quên 2π.");
q(6,"Con lắc lò xo có k = 100 N/m, m = 0,25 kg. Tần số góc là","20 rad/s",["400 rad/s","40 rad/s","10 rad/s"],"ω = √(k/m) = √400 = 20 rad/s. 400 là ω² (quên căn).");
q(6,"Khi tăng khối lượng vật nặng của con lắc lò xo lên 4 lần (giữ nguyên k) thì chu kỳ","tăng 2 lần",["tăng 4 lần","giảm 2 lần","không đổi"],"T = 2π√(m/k) ∝ √m nên m tăng 4 lần thì T tăng 2 lần.");
q(6,"Con lắc lò xo có m = 0,2 kg và chu kỳ 0,4 s. Độ cứng lò xo xấp xỉ","49,3 N/m",["246,7 N/m","12,3 N/m","98,7 N/m"],"ω = 2π/T = 5π rad/s; k = mω² = 0,2·25π² ≈ 49,3 N/m. 246,7 là ω² (quên m).");
q(6,"Con lắc lò xo có k = 80 N/m, m = 0,2 kg, biên độ 0,05 m. Tốc độ cực đại là","1,0 m/s",["20 m/s","0,5 m/s","0,25 m/s"],"ω = √(k/m) = 20 rad/s; v_max = ωA = 20·0,05 = 1,0 m/s. 20 chính là ω.");
q(6,"Hai con lắc lò xo có cùng khối lượng, độ cứng k₂ = 4k₁. Tỉ số chu kỳ T₁/T₂ là","2",["4","1/2","1/4"],"T ∝ 1/√k ⇒ T₁/T₂ = √(k₂/k₁) = 2.");
q(6,"Con lắc lò xo có k = 200 N/m, m = 0,5 kg và cơ năng 0,25 J. Tốc độ cực đại là","1,0 m/s",["0,5 m/s","0,71 m/s","2,0 m/s"],"W = ½mv²_max ⇒ v_max = √(2W/m) = √1 = 1,0 m/s. 0,71 là √(W/m) (quên hệ số 2).");
q(6,"Con lắc lò xo có m = 0,1 kg dao động với tần số 5 Hz. Độ cứng lò xo xấp xỉ","98,7 N/m",["9,87 N/m","0,987 N/m","197 N/m"],"ω = 2πf = 10π rad/s ⇒ k = mω² = 0,1·100π² ≈ 98,7 N/m.");
q(6,"Con lắc lò xo m = 0,2 kg dao động theo phương trình x = 0,06cos(10t) (m; t tính bằng s). Cơ năng là","0,036 J",["0,072 J","0,36 J","0,018 J"],"W = ½mω²A² = ½·0,2·100·0,0036 = 0,036 J. 0,072 J là quên hệ số ½.");
q(6,"Con lắc lò xo dao động với chu kỳ 0,5 s, biên độ 0,04 m. Độ lớn gia tốc cực đại xấp xỉ","6,32 m/s²",["0,50 m/s²","25,3 m/s²","3,16 m/s²"],"ω = 2π/T = 4π rad/s ⇒ a_max = ω²A = 16π²·0,04 ≈ 6,32 m/s². 0,50 là tốc độ cực đại ωA.");
/* --- 7. Con lắc đơn (góc nhỏ, g = 9,8 m/s²) --- */
q(7,"Con lắc đơn dài l = 2,45 m dao động với góc nhỏ tại nơi g = 9,8 m/s². Chu kỳ là","3,14 s",["6,28 s","1,57 s","0,32 s"],"T = 2π√(l/g) = 2π√0,25 = π ≈ 3,14 s. 0,32 s là tần số.");
q(7,"Con lắc đơn dài 0,98 m dao động nhỏ tại nơi g = 9,8 m/s². Tần số góc là","3,16 rad/s",["10,0 rad/s","0,32 rad/s","9,8 rad/s"],"ω = √(g/l) = √10 ≈ 3,16 rad/s. 10 là ω² (quên căn).");
q(7,"Con lắc đơn dao động nhỏ tại nơi g = 9,8 m/s² với chu kỳ 2,0 s. Chiều dài dây xấp xỉ","0,99 m",["3,97 m","39,2 m","96,7 m"],"l = gT²/(4π²) = 39,2/39,48 ≈ 0,99 m. 3,97 m do dùng π² thay 4π²; 39,2 m do quên 2π.");
q(7,"Chiều dài dây con lắc đơn tăng 4 lần và gia tốc trọng trường tăng 4 lần (dao động nhỏ). Chu kỳ","không đổi",["tăng 4 lần","tăng 2 lần","giảm 2 lần"],"T = 2π√(l/g) ∝ √(l/g); tỉ số l/g không đổi nên T không đổi.");
q(7,"Các công thức T = 2π√(l/g) và Wt ≈ ½mglα² của con lắc đơn chỉ dùng được khi","α nhỏ và đổi ra radian",["α nhỏ và tính bằng độ","α bất kỳ và tính bằng độ","α lớn và tính bằng radian"],"Gần đúng sin α ≈ α, cos α ≈ 1 − α²/2 chỉ đúng với góc nhỏ và α phải tính bằng radian.");
q(7,"Con lắc đơn m = 0,1 kg, l = 1 m, g = 9,8 m/s². Với góc nhỏ α = 0,1 rad, thế năng so với vị trí thấp nhất xấp xỉ","0,0049 J",["0,098 J","0,0098 J","0,049 J"],"Wt ≈ ½mglα² = ½·0,1·9,8·1·0,01 = 0,0049 J. 0,0098 J quên ½; 0,049 J thiếu bình phương α.");
q(7,"Con lắc đơn dài 1,5 m dao động với góc nhỏ, li độ góc α = 0,08 rad. Li độ dài (độ dài cung) là","0,12 m",["0,053 m","18,8 m","0,0064 m"],"s = αl = 0,08·1,5 = 0,12 m. 0,053 = α/l; 0,0064 = α².");
q(7,"Con lắc đơn m = 0,2 kg, l = 0,98 m, g = 9,8 m/s², dao động nhỏ. Khi li độ dài s = 0,05 m, thế năng xấp xỉ","0,0025 J",["0,0050 J","0,025 J","0,00025 J"],"Wt ≈ ½m(g/l)s² = ½·0,2·10·0,0025 = 0,0025 J. 0,0050 J do quên hệ số ½.");
q(7,"Con lắc đơn l = 1 m, g = 9,8 m/s², biên độ góc nhỏ α₀ = 0,05 rad. Tốc độ cực đại xấp xỉ","0,16 m/s",["0,05 m/s","0,49 m/s","0,31 m/s"],"Biên độ dài s₀ = lα₀ = 0,05 m; ω = √g ≈ 3,13 rad/s ⇒ v_max = ωs₀ ≈ 0,16 m/s. 0,49 = gα₀.");
q(7,"Hai con lắc đơn tại cùng nơi, l₂ = 4l₁ (dao động nhỏ). Trong cùng khoảng thời gian, tỉ số số dao động N₁/N₂ là","2",["1/2","4","1/4"],"N = t/T ∝ 1/√l ⇒ N₁/N₂ = T₂/T₁ = √(l₂/l₁) = 2.");
/* --- 8. Thời gian và số dao động --- */
q(8,"Một vật dao động điều hòa với tần số 2,5 Hz. Số dao động toàn phần thực hiện trong 6 s là","15",["2,4","36","1,5"],"N = f·t = 2,5·6 = 15. 2,4 là t/f (nhầm công thức).");
q(8,"Vật dao động điều hòa với tần số 5 Hz. Thời gian để thực hiện 50 dao động toàn phần là","10 s",["250 s","0,1 s","45 s"],"t = N/f = 50/5 = 10 s. 250 là N·f.");
q(8,"Thời gian vật đi từ biên này sang biên kia là 0,3 s. Chu kỳ dao động là","0,6 s",["0,3 s","1,2 s","0,15 s"],"Biên này đến biên kia mất T/2 = 0,3 s ⇒ T = 0,6 s. 1,2 s xảy ra khi nhầm T/4.");
q(8,"Hai lần liên tiếp vật đi qua vị trí cân bằng cách nhau 0,25 s. Tần số dao động là","2 Hz",["4 Hz","0,5 Hz","1 Hz"],"Hai lần liên tiếp qua VTCB cách T/2 = 0,25 s ⇒ T = 0,5 s ⇒ f = 2 Hz.");
q(8,"Vật đi từ vị trí cân bằng đến biên mất 0,1 s. Tần số góc xấp xỉ","15,7 rad/s",["31,4 rad/s","7,85 rad/s","62,8 rad/s"],"T/4 = 0,1 s ⇒ T = 0,4 s ⇒ ω = 2π/T = 5π ≈ 15,7 rad/s.");
q(8,"Chu kỳ 2 s. Lúc t = 0 vật đang ở VTCB (lần 1). Thời điểm vật đi qua VTCB lần thứ 5 là","4 s",["5 s","8 s","10 s"],"Hai lần liên tiếp cách T/2 = 1 s nên lần thứ 5 xảy ra sau 4 khoảng, tức t = 4 s.");
q(8,"Vật có biên độ 0,05 m thực hiện 12 dao động toàn phần. Quãng đường đi được là","2,4 m",["0,6 m","1,2 m","4,8 m"],"Mỗi dao động đi 4A = 0,2 m ⇒ S = 12·0,2 = 2,4 m.");
q(8,"Vật dao động điều hòa với A = 0,04 m, T = 0,5 s. Tốc độ trung bình trong một chu kỳ là","0,32 m/s",["0,16 m/s","0,64 m/s","0,08 m/s"],"v_tb = 4A/T = 0,16/0,5 = 0,32 m/s. 0,16 là 2A/T.");
q(8,"Vật dao động trên đoạn thẳng dài 0,12 m với chu kỳ 0,6 s. Quãng đường vật đi được trong 3 s là","1,2 m",["2,4 m","0,6 m","3,6 m"],"A = L/2 = 0,06 m; 3 s = 5T ⇒ S = 5·4A = 1,2 m. 2,4 m do lấy A = L.");
q(8,"Vật 1 thực hiện 30 dao động trong 1 phút; vật 2 có chu kỳ 1,5 s. Trong cùng 6 s, tỉ số số dao động N₁/N₂ là","3/4",["4/3","2/3","3/2"],"T₁ = 2 s ⇒ N₁ = 3; N₂ = 6/1,5 = 4 ⇒ N₁/N₂ = 3/4.");
/* --- 9. Bài toán kết hợp --- */
q(9,"Con lắc lò xo m = 0,25 kg, k = 100 N/m, biên độ 0,06 m. Khi li độ x = 0,03 m, động năng là","0,135 J",["0,180 J","0,045 J","0,225 J"],"Wđ = ½k(A² − x²) = 50·(0,0036 − 0,0009) = 0,135 J. 0,180 là cơ năng; 0,045 là thế năng; 0,225 dùng A² + x².");
q(9,"Con lắc đơn dài 2,45 m, g = 9,8 m/s², dao động với góc nhỏ. Số dao động toàn phần trong 10π s là","10",["20","5","100"],"T = 2π√(l/g) = π s ⇒ N = t/T = 10π/π = 10.");
q(9,"Vật m = 0,1 kg gắn lò xo k = 10π² N/m dao động với biên độ 0,03 m. Quãng đường vật đi được trong 1 s là","0,60 m",["0,30 m","0,15 m","1,20 m"],"ω = √(k/m) = 10π rad/s ⇒ T = 0,2 s; 1 s = 5T ⇒ S = 5·4A = 0,60 m.");

/* Hiển thị công thức: phân số xếp chồng, căn thức có gạch ngang, chỉ số dưới. Đơn vị (m/s, rad/s, N/m, cm/s) giữ nguyên. */
function M(src){
  const st=[],P0=0xE100;
  let s=String(src).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
  const mk=v=>{st.push(v);return String.fromCharCode(P0+st.length-1)};
  const isP=c=>c>="\uE100"&&c<="\uF8FF", isR=c=>c!==undefined&&(/[A-Za-z0-9_²³⁴₀-₉α-ωΑ-ΩđĐ√]/.test(c)||isP(c));
  const dg=c=>c!==undefined&&/\d/.test(c), dec=(t,j)=>(t[j]===","||t[j]===".")&&dg(t[j-1])&&dg(t[j+1]);
  s=s.replace(/(?<![A-Za-z0-9_])(m|rad|N|cm)\/(s²?|m)(?![A-Za-z0-9_])/g,a=>mk(a));
  const left=k=>{let j=k-1;if(j<0)return -1;
    if(s[j]===")"){let d=0;for(;j>=0;j--){if(s[j]===")")d++;else if(s[j]==="("){d--;if(!d)break}}return j}
    const e=j;while(j>=0&&(isR(s[j])||dec(s,j)))j--;return j===e?-1:j+1};
  const right=k=>{let j=k+1;if(j>=s.length)return -1;
    if(s[j]==="("){let d=0;for(;j<s.length;j++){if(s[j]==="(")d++;else if(s[j]===")"){d--;if(!d)break}}return j>=s.length?-1:j+1}
    const b=j;while(j<s.length&&(isR(s[j])||dec(s,j)))j++;return j===b?-1:j};
  let k;
  while((k=s.indexOf("/"))>=0){const a=left(k),b=right(k);
    if(a<0||b<0){s=s.slice(0,k)+"\uE0FF"+s.slice(k+1);continue}
    let n=s.slice(a,k),d=s.slice(k+1,b);
    if(n[0]==="(")n=n.slice(1,-1);if(d[0]==="(")d=d.slice(1,-1);
    s=s.slice(0,a)+mk([n,d])+s.slice(b)}
  s=s.replace(/\uE0FF/g,"/");
  s=s.replace(/(?<![A-Za-zα-ω0-9])\(([\uE100-\uF8FF])\)(?![²³])/g,(a,c)=>Array.isArray(st[c.charCodeAt(0)-P0])?c:a);
  const rd=c=>`<span class="rad"><span class="rs">√</span><span class="rc">${c}</span></span>`;
  const expand=t=>t.replace(/[\uE100-\uF8FF]/g,c=>{const v=st[c.charCodeAt(0)-P0];return typeof v==="string"?v:`<span class="fr"><span>${R(v[0])}</span><span>${R(v[1])}</span></span>`});
  const rad=t=>{let o="",i=0;while(i<t.length){if(t[i]!=="√"){o+=t[i++];continue}i++;
    if(t[i]==="("){let d=0,j=i;for(;j<t.length;j++){if(t[j]==="(")d++;else if(t[j]===")"){d--;if(!d)break}}o+=rd(R(t.slice(i+1,j)));i=j+1}
    else{let j=i;while(j<t.length&&((isR(t[j])&&t[j]!=="√")||dec(t,j)))j++;o+=rd(R(t.slice(i,j)));i=j}}return o};
  const R=t=>expand(rad(t));
  return R(s).replace(/_([A-Za-z0-9]+)/g,"<sub>$1</sub>");
}

function norm(d){d.prefs=d.prefs||{};d.tests=d.tests||[];d.hist=d.hist||[];d.wrong=d.wrong||{};d.session=d.session||null;return d}

function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(arr,r=Math.random){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function renderSetup(m){
  let h="";
  if(m==="practice")h=`<h2>${ic("book")} A. Luyện tập</h2><p class="mu">Làm lần lượt từng câu, kiểm tra ngay và xem lời giải chi tiết. Có nút Câu trước / Câu tiếp.</p><div class="row"><label>Chủ đề: <select id="o-topic"><option value="-1">Tất cả (${N} câu)</option>${TOPICS.map((t,i)=>`<option value="${i}">${t}</option>`).join("")}</select></label></div>`;
  if(m==="test")h=`<h2>${ic("test")} B. Kiểm tra</h2><p class="mu">Làm liên tục, không hiện đáp án, có đếm ngược (1,5 phút/câu). Nộp bài để xem điểm (thang 10) và thống kê.</p><div class="row"><label>Số câu: <select id="o-n"><option>20</option><option selected>40</option><option>60</option><option value="${N}">Toàn bộ (${N})</option></select></label></div>`;
  if(m==="random")h=`<h2>${ic("dice")} C. Luyện tập ngẫu nhiên</h2><p class="mu">Câu hỏi và vị trí phương án được trộn; không lặp câu trong một lượt.</p><div class="row"><label>Số câu mỗi lượt: <select id="o-n"><option>10</option><option selected>20</option><option>30</option><option>50</option><option value="${N}">Toàn bộ (${N})</option></select></label></div>`;
  if(m==="wrong"){const p=pending().length,f=Object.keys(D.wrong).length-p;h=`<h2>${ic("repeat")} D. Ôn tập câu sai</h2><p class="mu">Câu sai được lưu tự động; trả lời đúng sẽ chuyển sang trạng thái đã khắc phục.</p><div class="grid"><div class="stat"><b style="color:var(--bad)">${p}</b><span>Cần ôn</span></div><div class="stat"><b style="color:var(--ok)">${f}</b><span>Đã khắc phục</span></div></div>${p?"":`<p class="mu">Hiện không có câu sai nào cần ôn. Hãy luyện tập thêm ở các chế độ khác.</p>`}`}
  const pf=Object.assign({sq:m!=="practice",so:m!=="practice"},D.prefs[m]||{});
  const sw=(id,on,t,d)=>`<label class="chk"><span>${ic("shuffle")} ${t}<small>${d}</small></span><input type="checkbox" id="${id}" ${on?"checked":""}></label>`;
  const tg=`<div class="tgs">${sw("o-sq",pf.sq,"Xáo trộn thứ tự câu hỏi","Mỗi lượt làm có thứ tự câu khác nhau")}${sw("o-so",pf.so,"Xáo trộn vị trí đáp án","Vị trí A, B, C, D thay đổi ngẫu nhiên")}</div>`;
  $("#v-setup").innerHTML=`<div class="card slide">${h}${tg}<div class="row"><button class="btn" id="go" ${m==="wrong"&&!pending().length?"disabled":""}>Bắt đầu</button></div></div>`;
  $("#go").onclick=()=>{
    const sq=$("#o-sq").checked,so=$("#o-so").checked;D.prefs[m]={sq,so};
    const all=Q.map((_,i)=>i);let ids;
    if(m==="practice"){const t=+$("#o-topic").value;ids=t<0?all:all.filter(i=>Q[i].t===t)}
    else if(m==="wrong")ids=pending();
    else ids=all;
    if(sq)ids=shuffle(ids);
    if(m==="test"||m==="random")ids=ids.slice(0,+$("#o-n").value);
    start(m,ids,{rand:so,limit:m==="test"?ids.length*90:0});
  };
}

/* ============ LÀM BÀI ============ */
function start(mode,ids,o){
  S={mode,items:ids.map(id=>({id,order:o.rand?shuffle([0,1,2,3]):FIX[id]})),i:0,ans:{},elapsed:0,t0:Date.now(),limit:o.limit||0,done:false,dir:1,so:!!o.rand};
  show("quiz");renderQ();
  if(S.limit){timer=setInterval(tick,500)}
}
function stopTimer(){if(timer){clearInterval(timer);timer=null}}
function tick(){if(!S)return;const left=S.limit-el();const tm=$("#tm");if(tm)tm.innerHTML=ic("clock")+" "+fmt(Math.max(0,left));if(left<=0){stopTimer();submit(true)}}
const immediate=()=>S.mode!=="test";
function renderQ(){
  const it=S.items[S.i],qq=Q[it.id],a=S.ans[S.i],cp=it.order.indexOf(0),locked=immediate()&&a!==undefined;
  const opts=it.order.map((oi,p)=>{let c="opt";if(locked){if(p===cp)c+=" ok";else if(p===a)c+=" bad";else c+=" dim"}else if(a===p)c+=" sel";
    return `<button class="${c}" data-p="${p}" style="--d:${p*70+60}ms" ${locked?"disabled":""}><b>${"ABCD"[p]}</b><span>${M(qq.o[oi])}</span></button>`}).join("");
  let fb="";if(locked){const ok=a===cp;fb=`<div class="fb ${ok?"ok":"bad"}"><h4>${ok?ic("check")+" Chính xác!":ic("x")+" Chưa đúng"}</h4><div>Đáp án đúng: <b>${"ABCD"[cp]}. ${M(qq.o[0])}</b></div><div class="fx" style="margin-top:8px"><b>Lời giải:</b> ${M(qq.e)}</div></div>`}
  const last=S.i===S.items.length-1,cls=S.dir>0?"sr":S.dir<0?"sl":"nb";
  const nav=S.items.map((x,i)=>{let c="";if(i===S.i)c="cur ";const v=S.ans[i];if(v!==undefined)c+=immediate()?(v===x.order.indexOf(0)?"ok":"bad"):"an";return `<button class="${c}" data-j="${i}">${i+1}</button>`}).join("");
  const modeName={practice:"Luyện tập",test:"Kiểm tra",random:"Ngẫu nhiên",wrong:"Ôn câu sai"}[S.mode];
  const answered=Object.keys(S.ans).length;
  $("#v-quiz").innerHTML=`<div class="card"><div class="qh"><span><b>${modeName}</b> · Câu ${S.i+1}/${S.items.length}</span>${S.limit?`<span class="tm" id="tm"></span>`:""}<span>Đã làm ${answered}/${S.items.length}</span></div>
  <div class="pb"><i style="width:${answered/S.items.length*100}%"></i></div>
  <div class="${cls}" id="qb"><div style="margin-top:14px"><span class="tag">${TOPICS[qq.t]}</span></div><div class="qt">${M(qq.q)}</div>${opts}${fb}</div>
  <div class="row"><button class="btn g" id="prev" ${S.i?"":"disabled"}>← Câu trước</button>${last?(S.mode==="test"?`<button class="btn" id="sub">Nộp bài</button>`:`<button class="btn" id="fin">Hoàn thành</button>`):`<button class="btn" id="next">Câu tiếp →</button>`}<button class="btn g" id="shuf" style="margin-left:auto">${ic("shuffle")} Xáo trộn</button><button class="btn g" id="quit">${S.mode==="test"?"Nộp bài sớm":"Thoát"}</button></div>
  <div class="nv">${nav}</div></div>`;
  if(S.limit)tick();
  $("#v-quiz").querySelectorAll(".opt").forEach(b=>b.onclick=()=>choose(+b.dataset.p));
  $("#v-quiz").querySelectorAll(".nv button").forEach(b=>b.onclick=()=>{const j=+b.dataset.j;S.dir=j>S.i?1:-1;S.i=j;renderQ()});
  $("#prev").onclick=()=>{S.i--;S.dir=-1;renderQ()};
  if($("#next"))$("#next").onclick=()=>{S.i++;S.dir=1;renderQ()};
  if($("#fin"))$("#fin").onclick=()=>finish(false);
  if($("#sub"))$("#sub").onclick=()=>askSubmit();
  $("#shuf").onclick=reshuffle;
  persist();
  $("#quit").onclick=()=>S.mode==="test"?askSubmit():finish(false);
}
// Phím tắt khi đang làm bài: A-D chọn đáp án, ArrowRight/Enter sang câu kế.
document.addEventListener("keydown",e=>{
  if(!S||S.done||$("#v-quiz").classList.contains("hide"))return;
  const target=e.target;
  if(target&&(target.isContentEditable||/INPUT|TEXTAREA|SELECT/.test(target.tagName)))return;
  const key=e.key.toLowerCase();
  if(["a","b","c","d"].includes(key)){
    e.preventDefault();
    choose("abcd".indexOf(key));
    return;
  }
  if(key==="arrowright"||key==="enter"){
    // Không kích hoạt phím Enter khi người dùng đang thao tác trực tiếp trên nút.
    if(target&&target.closest&&target.closest("button"))return;
    if(S.i<S.items.length-1){
      e.preventDefault();
      S.i++;S.dir=1;renderQ();
    }
  }
});
function choose(p){
  if(immediate()){if(S.ans[S.i]!==undefined)return;S.ans[S.i]=p;const it=S.items[S.i];record(it.id,p===it.order.indexOf(0))}
  else S.ans[S.i]=p;
  S.dir=0;renderQ();
}
function askSubmit(){const un=S.items.length-Object.keys(S.ans).length;confirmBox("Nộp bài?",un?`Bạn còn ${un} câu chưa làm. Nộp bài ngay?`:"Bạn đã trả lời tất cả các câu. Nộp bài?",()=>submit(false))}
function submit(){
  if(!S||S.done)return;stopTimer();
  S.items.forEach((it,i)=>{if(S.ans[i]!==undefined)record(it.id,S.ans[i]===it.order.indexOf(0))});
  finish(false);
}
function finish(silent){
  if(!S||S.done)return;stopTimer();S.done=true;D.session=null;
  const sec=Math.min(el(),S.limit||1e9);
  let cor=0,ans=0;S.items.forEach((it,i)=>{if(S.ans[i]!==undefined){ans++;if(S.ans[i]===it.order.indexOf(0))cor++}});
  S.res={cor,ans,sec,total:S.items.length};
  if(S.mode==="test"){D.tests.push({at:Date.now(),score:cor/S.items.length*10,correct:cor,total:S.items.length,sec})}
  if(ans)D.hist.push({at:Date.now(),mode:S.mode,answered:ans,correct:cor,sec});
  save();if(!silent)renderResult();
}

/* ============ LƯU PHIÊN, TRỘN, HIỆU ỨNG ============ */
function persist(){if(!S||S.done)return;D.session={mode:S.mode,items:S.items,i:S.i,ans:S.ans,elapsed:el(),limit:S.limit,so:S.so};save()}
function resume(){const x=D.session;if(!x||!x.items||x.items.some(i=>i.id>=N)){D.session=null;save();return renderHome()}
  S={mode:x.mode,items:x.items,i:Math.min(x.i,x.items.length-1),ans:x.ans||{},elapsed:x.elapsed||0,t0:Date.now(),limit:x.limit||0,done:false,dir:1,so:x.so};
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.t===S.mode));
  show("quiz");renderQ();if(S.limit)timer=setInterval(tick,500)}
function reshuffle(){/* trộn các câu chưa làm phía sau + vị trí đáp án câu hiện tại nếu chưa làm; câu đã làm giữ nguyên */
  const idx=S.items.map((_,i)=>i).filter(i=>i>S.i&&S.ans[i]===undefined),its=shuffle(idx.map(i=>S.items[i]));
  idx.forEach((i,k)=>{S.items[i]={id:its[k].id,order:shuffle([0,1,2,3])}});
  if(S.ans[S.i]===undefined)S.items[S.i].order=shuffle([0,1,2,3]);
  S.dir=1;renderQ()}
function countUp(e,to,d=0,suf=""){const t0=performance.now();(function f(t){const p=Math.min(1,(t-t0)/700),v=to*(1-Math.pow(1-p,3));e.textContent=v.toFixed(d).replace(".",",")+suf;if(p<1)requestAnimationFrame(f)})(t0)}
function confetti(){const c=document.createElement("div");c.className="cf";for(let i=0;i<44;i++){const e=document.createElement("i");e.style.cssText=`left:${Math.random()*100}%;background:hsl(${Math.random()*360},80%,65%);animation-delay:${Math.random()*.6}s;animation-duration:${1.6+Math.random()*1.4}s`;c.appendChild(e)}document.body.appendChild(c);setTimeout(()=>c.remove(),3600)}
window.addEventListener("beforeunload",persist);

/* ============ NHẠC NỀN — SỬA LINK Ở ĐÂY ============ */
const MUSIC={
  url:"https://github.com/MinhTruk/bakhi/raw/refs/heads/main/music/The%20Mar%C3%ADas%20-%20Sienna%20(Visualizer).mp3",              /* dán link file nhạc, vd: "https://raw.githubusercontent.com/user/repo/main/theme.mp3" (link github.com/.../blob/... cũng được) */
  title:"Sienna",            /* tên bài, vd: "Tên bài hát" */
  author:"The Marias",           /* tác giả, vd: "Tên nghệ sĩ" */
  start:"0:00",        /* phát từ giây/phút này, vd: "0:45" hoặc 45 */
  end:""               /* lặp lại khi tới đây, vd: "2:10"; để trống = phát hết bài rồi lặp */
};
/* Nhạc tự phát khi mở trang (nếu trình duyệt chặn tiếng thì phát ngay ở lần bấm/chạm đầu tiên). */
function rawUrl(u){u=(u||"").trim();const m=u.match(/^https?:\/\/github\.com\/([^\/]+)\/([^\/]+)\/blob\/(.+)$/);return m?"https://raw.githubusercontent.com/"+m[1]+"/"+m[2]+"/"+m[3].replace(/\?.*$/,""):u}
function parseT(v){v=String(v||"").trim();if(!v)return 0;if(v.includes(":")){const p=v.split(":").map(Number);return p.some(isNaN)?0:p.reduce((a,x)=>a*60+x,0)}const n=parseFloat(v.replace(",","."));return isNaN(n)?0:Math.max(0,n)}
function fT(t){t=Math.max(0,Math.floor(t||0));return Math.floor(t/60)+":"+String(t%60).padStart(2,"0")}
function initMusic(){
  if(typeof Audio==="undefined")return;
  const pr=D.prefs.music=Object.assign({vol:.5,on:true},D.prefs.music||{});
  const url=rawUrl(MUSIC.url),st=parseT(MUSIC.start),en=parseT(MUSIC.end)>st?parseT(MUSIC.end):0;
  const title=MUSIC.title.trim(),author=MUSIC.author.trim(),full=title?title+(author?" — "+author:""):"";
  const AU=new Audio();AU.volume=pr.vol;AU.preload="auto";
  let blocked=false,ok=!!url;
  const box=document.createElement("div");box.className="mp";document.body.appendChild(box);
  box.innerHTML=`<div class="mpp">
   <div class="t"><div class="eq"><i></i><i></i><i></i></div><div style="min-width:0"><div class="tn" id="mtn"></div><div class="mat" id="mat"></div></div></div>
   <div class="mbar"><i id="mbar"></i></div><div class="mtm"><span id="mt1">0:00</span><span id="mt2">0:00</span></div>
   <div class="r2"><button class="ib pl" id="mpl" title="Phát / Tạm dừng"></button><span id="mvi"></span><input type="range" id="mvol" min="0" max="1" step="0.01" title="Âm lượng"></div></div>
   <div class="mrow"><div class="chip" id="mchip"></div><button class="mpb" id="mpb" title="Nhạc nền">${ic("music")}</button></div>`;
  const q=s=>box.querySelector(s);q("#mvol").value=pr.vol;
  const end=()=>en||AU.duration||0;
  const prog=()=>{const c=AU.currentTime||0,e=end(),p=e>st?Math.min(1,Math.max(0,(c-st)/(e-st))):0;q("#mbar").style.width=p*100+"%";q("#mt1").textContent=fT(Math.max(0,c-st));q("#mt2").textContent=fT(Math.max(0,e-st))};
  const paint=()=>{const pl=!AU.paused;box.classList.toggle("playing",pl);q("#mpl").innerHTML=ic(pl?"pause":"play");
    q("#mtn").textContent=!url?"Chưa cấu hình nhạc":!ok?"Không tải được nhạc":(title||"Nhạc nền");q("#mat").textContent=author?"Tác giả: "+author:"";
    q("#mvi").innerHTML=ic(AU.volume?"volume":"mute");q("#mpb").title=full||"Nhạc nền";q("#mchip").textContent=full;q("#mchip").classList.toggle("show",pl&&!!full);prog()};
  const tryPlay=()=>{if(!pr.on||!ok)return;AU.play().then(()=>{blocked=false;paint()}).catch(()=>{blocked=true;paint()})};
  AU.onplay=AU.onpause=paint;AU.onerror=()=>{ok=false;paint()};
  AU.onloadedmetadata=()=>{if(st&&st<(AU.duration||1e9))AU.currentTime=st;prog()};
  AU.onended=()=>{AU.currentTime=st;if(pr.on)AU.play().catch(()=>{})};
  setInterval(()=>{if(AU.paused)return;if(en&&AU.currentTime>=en)AU.currentTime=st;else if(AU.currentTime<st)AU.currentTime=st;prog()},120);
  ["pointerdown","keydown","touchstart"].forEach(ev=>window.addEventListener(ev,e=>{if(blocked&&pr.on&&!(e.target&&e.target.closest&&e.target.closest(".mp")))tryPlay()}));
  q("#mpb").onclick=()=>box.classList.toggle("open");
  q("#mpl").onclick=()=>{if(!ok)return;if(AU.paused){pr.on=true;save();AU.play().catch(()=>{})}else{pr.on=false;save();AU.pause()}};
  q("#mvol").oninput=e=>{AU.volume=pr.vol=+e.target.value;save();paint()};
  if(url){AU.src=url;AU.load&&AU.load()}
  paint();tryPlay();
}
/* ============ KẾT QUẢ ============ */
function renderResult(){
  const r=S.res,tot=r.total,wr=r.ans-r.cor,blank=tot-r.ans,score=r.cor/tot*10;
  const tb=TOPICS.map((name,t)=>{let n=0,c=0;S.items.forEach((it,i)=>{if(Q[it.id].t===t){n++;if(S.ans[i]!==undefined&&S.ans[i]===it.order.indexOf(0))c++}});return n?`<tr><td>${name}</td><td>${c}/${n}</td><td style="width:35%"><div class="pb"><i style="width:${c/n*100}%"></i></div></td><td>${Math.round(c/n*100)}%</td></tr>`:""}).join("");
  const bad=S.items.map((it,i)=>[it,i]).filter(([it,i])=>S.ans[i]===undefined||S.ans[i]!==it.order.indexOf(0)).map(([it,i])=>{const qq=Q[it.id],cp=it.order.indexOf(0),a=S.ans[i];
    return `<div class="wi"><div class="mu">Câu ${i+1} · ${TOPICS[qq.t]}</div><div style="margin:4px 0">${M(qq.q)}</div><div>Bạn chọn: <b style="color:var(--bad)">${a===undefined?"(bỏ trống)":"ABCD"[a]+". "+M(qq.o[it.order[a]])}</b></div><div>Đáp án đúng: <b style="color:var(--ok)">${"ABCD"[cp]}. ${M(qq.o[0])}</b></div><div class="fx" style="margin-top:6px"><b>Lời giải:</b> ${M(qq.e)}</div></div>`}).join("");
  $("#v-result").innerHTML=`<div class="card slide"><h2>Kết quả ${S.mode==="test"?"bài kiểm tra":"lượt luyện tập"}</h2><div class="rwrap"><div class="ringw"><svg class="ring" viewBox="0 0 100 100"><defs><linearGradient id="gr" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6c8cff"/><stop offset="1" stop-color="#a47bff"/></linearGradient></defs><circle class="rb" cx="50" cy="50" r="44"/><circle class="rf" cx="50" cy="50" r="44" style="stroke-dashoffset:${276.46*(1-score/10)}"/></svg><div class="big" id="sc">0/10</div></div><div><div style="font-size:18px;font-weight:600">${score>=8?ic("award")+" Xuất sắc!":score>=6.5?ic("check")+" Khá tốt":score>=5?ic("trend")+" Cần ôn thêm":ic("book")+" Hãy luyện tập thêm nhé"}</div><div class="mu">${r.cor}/${tot} câu đúng · ${fmt(r.sec)}</div></div></div>
  <div class="grid" style="margin-top:12px"><div class="stat"><b style="color:var(--ok)">${r.cor}</b><span>Câu đúng</span></div><div class="stat"><b style="color:var(--bad)">${wr}</b><span>Câu sai</span></div><div class="stat"><b>${blank}</b><span>Chưa làm</span></div><div class="stat"><b>${Math.round(r.cor/tot*100)}%</b><span>Tỉ lệ chính xác</span></div><div class="stat"><b>${fmt(r.sec)}</b><span>Thời gian</span></div></div>
  <h3>Thống kê theo chủ đề</h3><div style="overflow:auto"><table>${tb}</table></div>
  <h3>Câu sai / bỏ trống (${wr+blank}) và giải thích</h3>${bad||`<p class="mu">Tuyệt vời! Không có câu nào sai.</p>`}
  <div class="row"><button class="btn" id="again">Làm lại chế độ này</button><button class="btn g" id="hm">Về tổng quan</button></div></div>`;
  const m=S.mode;$("#again").onclick=()=>go(m);$("#hm").onclick=()=>go("home");show("result");countUp($("#sc"),score,2,"/10");if(score>=8)confetti();
}
initMusic();
go("home");
</script>
