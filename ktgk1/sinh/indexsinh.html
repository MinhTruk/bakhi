const norm = s => String(s).toLowerCase()
    .replace(/[₀-₉]/g, c => String(c.charCodeAt(0) - 0x2080))
    .replace(/→|⇒|=>|-->/g, ' -> ')
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/đ/g, 'd')
    .replace(/\s+/g, ' ');
const rx = (...res) => n => res.some(r => r.test(n));
const num = (k, name) => rx(
    new RegExp('\\b' + k + '\\s*(phan tu\\s*)?(acid\\s*|axit\\s*)?' + name),
    new RegExp(name + '\\w*\\s*(acid|axit)?\\s*[:=(x\\-]?\\s*' + k + '(?!\\d)'));
const ordered = (...ts) => n => { let p = -1; for (const t of ts) { const i = n.indexOf(t, p + 1); if (i < 0) return false; p = i; } return true; };
const MACRO = ['n','ca','p','k','s','mg'], MICRO = ['cl','fe','mn','mo','zn'];
function groupElems(n, kw) {
    const a = n.indexOf(kw); if (a < 0) return null;
    const all = MACRO.concat(MICRO);
    const toSet = s => new Set(s.match(/[a-z]+/g) || []);
    const others = ['da luong', 'vi luong'].filter(x => x !== kw);
    const nextKw = others.map(x => n.indexOf(x)).filter(i => i > a);
    let endA = nextKw.length ? Math.min(...nextKw) : n.length;
    const sep = n.slice(a + kw.length).search(/[.;]/);
    if (sep >= 0) endA = Math.min(endA, a + kw.length + sep);
    let set = toSet(n.slice(a + kw.length, endA));
    if (!all.some(e => set.has(e))) {            // viết kiểu "N, Ca, ... là đa lượng"
        const before = others.map(x => { const i = n.indexOf(x); return i >= 0 && i < a ? i + x.length : 0; });
        set = toSet(n.slice(Math.max(0, ...before), a));
    }
    return set;
}
function segOf(n, kw, other) {                      // đoạn văn bản thuộc về từ khóa kw
    const a = n.indexOf(kw); if (a < 0) return '';
    const b = n.indexOf(other, a);
    return n.slice(a, b > a ? b : n.length);
}

const range = n => [...Array(n).keys()];
function shuf(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
function applyOrder() {
    if (S.shuffleOn) {
        S.order = { mcq: shuf(range(25)), tf: shuf(range(4)), sa: shuf(range(5)), es: shuf(range(3)) };
        S.optOrder = range(25).map(() => shuf([0, 1, 2, 3]));
    } else {
        S.order = { mcq: range(25), tf: range(4), sa: range(5), es: range(3) };
        S.optOrder = range(25).map(() => [0, 1, 2, 3]);
    }
}
function freshAnswers() { return { mcq: {}, tf: {}, sa: {}, es: {} }; }
function load() {
    try {
        const r = JSON.parse(localStorage.getItem(STORE_KEY));
        if (r && r.v === 1 && r.s && r.s.order) return r.s;
    } catch (e) {}
    const s = { answers: freshAnswers(), order: null, optOrder: null, shuffleOn: false, submitted: false, review: false,
                section: 'mcq', cur: { mcq: 0, tf: 0, sa: 0, es: 0 }, manual: {} };
    return s;
}
let S = load();
if (!S.order) applyOrder();

function answeredCount(sec) {
    const A = S.answers[sec];
    if (sec === 'mcq') return Object.keys(A).length;
    if (sec === 'tf') return range(4).filter(i => range(4).every(k => A[i + '-' + k] !== undefined)).length;
    return Object.keys(A).filter(i => (A[i] || '').trim()).length;
}
const totalAnswered = () => SECS.reduce((a, s) => a + answeredCount(s.id), 0);
function isDone(sec, qi) {
    const A = S.answers[sec];
    if (sec === 'mcq') return A[qi] !== undefined;
    if (sec === 'tf') return range(4).every(k => A[qi + '-' + k] !== undefined);
    return !!(A[qi] || '').trim();
}

/* =====================================================================
   CHẤM ĐIỂM
   ===================================================================== */
function critMet(type, qi, j) {
    const text = S.answers[type][qi] || '';
    if (!text.trim()) return false;
    const k = `${type}-${qi}-${j}`;
    if (S.manual[k] !== undefined) return S.manual[k];
    try { return !!KEY[type][qi].c[j].f(norm(text)); } catch (e) { return false; }
}
function grade() {
    const G = { mcq: { items: [] }, tf: { items: [] }, sa: { items: [] }, es: { items: [] } };
    S.order.mcq.forEach((qi, pos) => {
        const sel = S.answers.mcq[qi];
        const st = sel === undefined ? 'blank' : (sel === KEY.mcq[qi].a ? 'ok' : 'bad');
        G.mcq.items.push({ sec: 'mcq', pos, qi, st, score: st === 'ok' ? 0.2 : 0, max: 0.2 });
    });
    S.order.tf.forEach((qi, pos) => {
        const res = range(4).map(k => { const v = S.answers.tf[qi + '-' + k]; return v === undefined ? 'blank' : (v === KEY.tf[qi].a[k] ? 'ok' : 'bad'); });
        const okc = res.filter(x => x === 'ok').length;
        const st = okc === 4 ? 'ok' : (res.every(x => x === 'blank') ? 'blank' : 'bad');
        G.tf.items.push({ sec: 'tf', pos, qi, st, res, score: okc * 0.125, max: 0.5 });
    });
    ['sa', 'es'].forEach(sec => {
        S.order[sec].forEach((qi, pos) => {
            const cs = KEY[sec][qi].c, text = (S.answers[sec][qi] || '').trim();
            const met = cs.map((c, j) => critMet(sec, qi, j));
            const mx = sec === 'sa' ? 0.2 : cs.reduce((a, c) => a + c.p, 0);
            let score = 0;
            if (sec === 'sa') score = mx * met.filter(Boolean).length / cs.length;
            else cs.forEach((c, j) => { if (met[j]) score += c.p; });
            const st = !text ? 'blank' : (met.every(Boolean) ? 'ok' : 'bad');
            G[sec].items.push({ sec, pos, qi, st, met, score: r3(score), max: r3(mx) });
        });
    });
    let total = 0, ok = 0, bad = 0, blank = 0;
    SECS.forEach(s => {
        const g = G[s.id];
        g.score = r3(g.items.reduce((a, i) => a + i.score, 0));
        g.max = MAXPT[s.id];
        g.ok = g.items.filter(i => i.st === 'ok').length;
        g.bad = g.items.filter(i => i.st === 'bad').length;
        g.blank = g.items.filter(i => i.st === 'blank').length;
        total += g.score; ok += g.ok; bad += g.bad; blank += g.blank;
    });
    G.total = r3(total); G.ok = ok; G.bad = bad; G.blank = blank;
    return G;
}

function rvHead(it, label) {
    const orig = S.shuffleOn ? `<span class="text-xs text-slate-500">(câu gốc ${it.qi + 1})</span>` : '';

const expBox = html => `<div class="mt-3 rounded-xl bg-indigo-500/10 border border-indigo-500/25 p-3.5 text-sm text-slate-200 leading-relaxed"><b class="text-indigo-300"><i class="fa-regular fa-lightbulb mr-1"></i>Giải thích:</b> ${html}</div>`;
function rvMCQ(it) {

}
function rvTF(it) {

        const v = S.answers.tf[it.qi + '-' + j], right = k.a[j], st = it.res[j];

    return `${rvHead(it, 'Câu')}<p class="text-slate-100 font-medium leading-relaxed mb-3">${q.q}</p><div class="space-y-2.5">${rows}</div>`;
}
function rvText(it) {
    const sec = it.sec, q = QUESTIONS[sec][it.qi], k = KEY[sec][it.qi], text = (S.answers[sec][it.qi] || '').trim();
    const crit = k.c.map((c, j) => {

          <span class="flex-1 text-sm text-slate-200 leading-relaxed">${c.t}</span>${c.p ? `<span class="text-xs text-slate-400 tabular-nums shrink-0">${fmt(c.p)} đ</span>` : ''}</label>`;
    }).join('');
    return `${rvHead(it, 'Câu')}<p class="text-slate-100 font-medium leading-relaxed mb-3">${q.q}</p>
      <div class="rounded-xl border border-slate-700 bg-slate-900/50 p-3.5 mb-3"><div class="text-xs text-slate-400 mb-1.5">Bài làm của bạn</div>

      <div class="space-y-1.5">${crit}</div>${k.note ? expBox(k.note) : ''}`;
}
function reviewList(G, all) {
    let html = '', count = 0;
    SECS.forEach(s => {
        const items = G[s.id].items.filter(i => all || i.st !== 'ok');
        if (!items.length) return;
        count += items.length;

            items.map(it => `<article class="rounded-2xl border border-slate-800 bg-slate-800/50 p-5">${s.id === 'mcq' ? rvMCQ(it) : s.id === 'tf' ? rvTF(it) : rvText(it)}</article>`).join('') + `</div>`;
    });

}
function weakTopics(G) {
    const u = {};
    const add = (k, label) => { (u[k] = u[k] || []).push(label); };
    G.mcq.items.forEach(i => { if (i.st !== 'ok') add(QUESTIONS.mcq[i.qi].m, `TN ${i.pos + 1}`); });
    G.tf.items.forEach(i => i.res.forEach((r, j) => { if (r !== 'ok') add(QUESTIONS.tf[i.qi].m[j], `Đ/S ${i.pos + 1}${'abcd'[j]}`); }));
    G.sa.items.forEach(i => { if (i.st !== 'ok') add(QUESTIONS.sa[i.qi].m, `TLN ${i.pos + 1}`); });
    G.es.items.forEach(i => { if (i.st !== 'ok') QUESTIONS.es[i.qi].m.forEach(k => add(k, `TL ${i.pos + 1}`)); });
    return Object.entries(u).sort((a, b) => b[1].length - a[1].length);
}
function renderResult() {

        <div class="flex-1 min-w-[220px]"><h1 class="text-xl md:text-2xl font-bold ${msg[1]} mb-3">${msg[0]}</h1>

      <p class="text-xs text-slate-500 mt-4 leading-relaxed">Thang điểm do trang ôn tập thiết lập (không phải thang điểm nguyên bản của tài liệu). Phần Trả lời ngắn và Tự luận được nhận diện theo ý chính; bạn có thể tự điều chỉnh ở phần xem lại bên dưới.</p>

    <section class="rounded-2xl border border-slate-800 bg-slate-800/40 p-5 md:p-6">

          <div class="h-2 bg-slate-700/70 rounded-full overflow-hidden"><div class="h-2 rounded-full bg-gradient-to-r from-indigo-500 to-emerald-400" style="width:${pct}%"></div></div></div>`;

      <a href="${SUBJECT_HOME}" class="flex items-center gap-2 text-sm font-medium px-4 py-2.5 rounded-xl border border-indigo-800/50 bg-indigo-950/40 text-indigo-400 hover:text-indigo-300 hover:bg-indigo-900/50 transition-all"><i class="fa-solid fa-house text-xs"></i>Trang chủ môn học</a>

    </section>`;

/* =====================================================================
   MA TRẬN ĐỀ
   ===================================================================== */
function openMatrix() {
    const u = {};
    const add = (k, l) => { (u[k] = u[k] || []).push(l); };
    QUESTIONS.mcq.forEach((q, i) => add(q.m, 'TN ' + (i + 1)));
    QUESTIONS.tf.forEach((q, i) => q.m.forEach((k, j) => add(k, `Đ/S ${i + 1}${'abcd'[j]}`)));
    QUESTIONS.sa.forEach((q, i) => add(q.m, 'TLN ' + (i + 1)));
    QUESTIONS.es.forEach((q, i) => q.m.forEach(k => add(k, 'TL ' + (i + 1))));
    const cnt = { NB: 0, TH: 0, VD: 0 };
    Object.entries(u).forEach(([k, l]) => cnt[MATRIX[k].lv] += l.length);
    const order = Object.keys(MATRIX);
    const rows = order.map(k => {
        const l = u[k], m = MATRIX[k];
        return `<tr class="border-t border-slate-800 ${l ? '' : 'opacity-60'}"><td class="py-2.5 pr-3 align-top text-slate-400 whitespace-nowrap">${k}</td>
          <td class="py-2.5 pr-3 align-top text-slate-200 leading-relaxed">${m.t}</td>
          <td class="py-2.5 pr-3 align-top"><span class="text-xs px-2 py-0.5 rounded-full border whitespace-nowrap ${LV[m.lv][1]}">${LV[m.lv][0]}</span></td>
          <td class="py-2.5 align-top text-slate-300">${l ? l.join(', ') : '<span class="text-slate-500 italic">Chưa có câu trong đề</span>'}</td></tr>`;
    }).join('');
    openModal(`<div class="flex items-start justify-between gap-3 mb-3"><div><h3 class="text-lg font-bold text-white">Ma trận đề ôn tập Sinh học 11 – Giữa kì I</h3>
      <p class="text-xs text-slate-500 mt-1">Yêu cầu cần đạt lấy từ file “SOẠN SINH GIỮA KỲ 1”. Mức độ suy ra từ động từ yêu cầu (nêu/phát biểu/xác định → nhận biết; trình bày/phân tích/hiểu → thông hiểu; vận dụng → vận dụng). Số câu theo đề gốc (TN: trắc nghiệm, Đ/S: đúng/sai, TLN: trả lời ngắn, TL: tự luận).</p></div>
      <button data-act="mclose2" class="w-8 h-8 shrink-0 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300"><i class="fa-solid fa-xmark"></i></button></div>
      <div class="flex flex-wrap gap-2 mb-3 text-xs"><span class="px-2.5 py-1 rounded-full border ${LV.NB[1]}">Nhận biết: ${cnt.NB}</span><span class="px-2.5 py-1 rounded-full border ${LV.TH[1]}">Thông hiểu: ${cnt.TH}</span><span class="px-2.5 py-1 rounded-full border ${LV.VD[1]}">Vận dụng: ${cnt.VD}</span><span class="text-slate-500 self-center">(đếm theo câu / ý đúng-sai / câu tự luận)</span></div>
      <div class="overflow-x-auto"><table class="w-full text-sm min-w-[620px]"><thead><tr class="text-left text-xs text-slate-500"><th class="pb-2 pr-3 font-medium">Mục (file soạn)</th><th class="pb-2 pr-3 font-medium">Yêu cầu cần đạt</th><th class="pb-2 pr-3 font-medium">Mức độ</th><th class="pb-2 font-medium">Câu trong đề</th></tr></thead><tbody>${rows}</tbody></table></div>`, true);
}

/* =====================================================================
   HÀNH ĐỘNG
   ===================================================================== */
function submitNow() {
    S.submitted = true; S.review = false; save();
    renderResult(); window.scrollTo({ top: 0 });
}
function resetAnswers() { S.answers = freshAnswers(); S.manual = {}; S.submitted = false; S.review = false; S.section = 'mcq'; S.cur = { mcq: 0, tf: 0, sa: 0, es: 0 }; }
function go(delta) {
    const sec = S.section, i = SEC_IDS.indexOf(sec);
    if (delta > 0) { if (S.cur[sec] < N[sec] - 1) S.cur[sec]++; else if (i < 3) S.section = SEC_IDS[i + 1]; }
    else { if (S.cur[sec] > 0) S.cur[sec]--; else if (i > 0) { S.section = SEC_IDS[i - 1]; S.cur[S.section] = N[S.section] - 1; } }
    save(); renderTest(true);
}
document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const act = el.dataset.act, sec = S.section;
    if (act === 'mclose') { if (e.target === el) closeModal(); return; }
    if (act === 'mclose2') return closeModal();
    if (act === 'mok') { const cb = pendingOk; closeModal(); if (cb) cb(); return; }
    if (act === 'matrix') return openMatrix();
    if (act === 'crit') return; // xử lý ở sự kiện change
    if (act === 'review') { S.review = !S.review; save(); const y = window.scrollY; renderResult(); window.scrollTo({ top: y }); return; }
    if (act === 'restart') return ask('Làm lại bài?', 'Toàn bộ câu trả lời sẽ bị xóa để làm lại từ đầu. Thứ tự câu hiện tại được giữ nguyên.', 'Làm lại', () => { resetAnswers(); save(); renderTest(true); window.scrollTo({ top: 0 }); toast('Đã bắt đầu làm lại'); }, true);
    if (act === 'newtest') return ask('Xáo trộn và làm đề mới?', 'Câu trả lời hiện tại sẽ bị xóa, thứ tự câu và phương án A/B/C/D được xáo trộn lại.', 'Làm đề mới', () => { resetAnswers(); S.shuffleOn = true; applyOrder(); save(); renderTest(true); window.scrollTo({ top: 0 }); toast('Đã tạo đề mới'); }, true);
    if (S.submitted) return;
    if (act === 'tab') { S.section = el.dataset.sec; save(); return renderTest(true); }
    if (act === 'goto') { S.cur[sec] = +el.dataset.i; save(); renderCard(true); renderFoot(); renderNav(); return; }
    if (act === 'prev') return go(-1);
    if (act === 'next') return go(1);
    if (act === 'pick') {
        const qi = S.order.mcq[S.cur.mcq], oi = +el.dataset.oi;
        if (S.answers.mcq[qi] !== undefined) return;
        S.answers.mcq[qi] = oi; save(); renderCard(false); refreshChrome(); return;
    }
    if (act === 'tf') {
        const qi = S.order.tf[S.cur.tf], key = qi + '-' + el.dataset.k, v = el.dataset.v === 'true';
        if (S.answers.tf[key] !== undefined) return;
        S.answers.tf[key] = v;
        save(); renderCard(false); refreshChrome(); return;
    }
    if (act === 'shuf-toggle') { S.shuffleOn = !S.shuffleOn; applyOrder(); save(); renderTest(true); toast(S.shuffleOn ? 'Đã bật xáo trộn – câu trả lời được giữ nguyên' : 'Đã tắt xáo trộn – trở về thứ tự gốc'); return; }
    if (act === 'shuf-again') { applyOrder(); save(); renderTest(true); toast('Đã xáo trộn lại'); return; }
    if (act === 'submit') {
        const left = 37 - totalAnswered();
        return ask('Nộp bài?', left > 0 ? `Bạn còn <b class="text-amber-300">${left}</b> câu chưa hoàn thành. Sau khi nộp sẽ không thể sửa đáp án.` : 'Bạn đã hoàn thành tất cả các câu. Sau khi nộp sẽ không thể sửa đáp án.', 'Nộp bài', () => submitNow());
    }
});
document.addEventListener('input', e => {
    const ta = e.target.closest('textarea[data-ta]'); if (!ta || S.submitted) return;
    S.answers[ta.dataset.ta][ta.dataset.i] = ta.value; save(); renderTop(); renderTabs(); renderNav();
});
document.addEventListener('change', e => {
    const cb = e.target.closest('input[data-act="crit"]'); if (!cb) return;
    S.manual[cb.dataset.k] = cb.checked; save();
    const y = window.scrollY; renderResult(); window.scrollTo({ top: y });
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

/* =====================================================================
