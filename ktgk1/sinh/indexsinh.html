      </div>`);

/* =====================================================================
   TIẾN ĐỘ
   ===================================================================== */
function answeredCount(sec) {
    const A = S.answers[sec];
    if (sec === 'mcq') return Object.keys(A).length;
    if (sec === 'tf') return range(4).filter(i => range(4).every(k => A[i + '-' + k] !== undefined)).length;
    return Object.keys(A).filter(i => (A[i] || '').trim() && S.confirmed?.[sec]?.[i]).length;
}
const totalAnswered = () => SECS.reduce((a, s) => a + answeredCount(s.id), 0);
function isDone(sec, qi) {
    const A = S.answers[sec];
    if (sec === 'mcq') return A[qi] !== undefined;
    if (sec === 'tf') return range(4).every(k => A[qi + '-' + k] !== undefined);
    return !!(A[qi] || '').trim() && !!S.confirmed?.[sec]?.[qi];
}

/* =====================================================================
   CHẤM ĐIỂM
   ===================================================================== */
function critMet(type, qi, j) {
    const text = S.answers[type][qi] || '';
    if (!text.trim()) return false;
    const k = `${type}-${qi}-${j}`;
    if (S.manual[k] !== undefined) return S.manual[k];
    try { return !!KEY[type][qi].c[j].f(norm(text)); } catch (e) { return false; }
}
function grade() {
    const G = { mcq: { items: [] }, tf: { items: [] }, sa: { items: [] }, es: { items: [] } };
    S.order.mcq.forEach((qi, pos) => {
        const sel = S.answers.mcq[qi];
        const st = sel === undefined ? 'blank' : (sel === KEY.mcq[qi].a ? 'ok' : 'bad');
        G.mcq.items.push({ sec: 'mcq', pos, qi, st, score: st === 'ok' ? (5 / 24) : 0, max: (5 / 24) });
    });
    S.order.tf.forEach((qi, pos) => {
        const res = range(4).map(k => { const v = S.answers.tf[qi + '-' + k]; return v === undefined ? 'blank' : (v === KEY.tf[qi].a[k] ? 'ok' : 'bad'); });
        const okc = res.filter(x => x === 'ok').length;
        const st = okc === 4 ? 'ok' : (res.every(x => x === 'blank') ? 'blank' : 'bad');
        G.tf.items.push({ sec: 'tf', pos, qi, st, res, score: okc * 0.125, max: 0.5 });
    });
    ['sa', 'es'].forEach(sec => {
        S.order[sec].forEach((qi, pos) => {
            const cs = KEY[sec][qi].c, text = (S.answers[sec][qi] || '').trim();
            const confirmed = !!S.confirmed?.[sec]?.[qi];
            const met = cs.map((c, j) => confirmed && critMet(sec, qi, j));
            const mx = sec === 'sa' ? 0.25 : cs.reduce((a, c) => a + c.p, 0) * (2 / 3);
            let score = 0;
            if (sec === 'sa') score = mx * met.filter(Boolean).length / cs.length;
            else cs.forEach((c, j) => { if (met[j]) score += c.p * (2 / 3); });
            const st = !text || !confirmed ? 'blank' : (met.every(Boolean) ? 'ok' : 'bad');
            G[sec].items.push({ sec, pos, qi, st, met, score: r3(score), max: r3(mx) });
        });
    });
    let total = 0, ok = 0, bad = 0, blank = 0;
    SECS.forEach(s => {
        const g = G[s.id];
        g.score = r3(g.items.reduce((a, i) => a + i.score, 0));
        g.max = MAXPT[s.id];
        g.ok = g.items.filter(i => i.st === 'ok').length;
        g.bad = g.items.filter(i => i.st === 'bad').length;
        g.blank = g.items.filter(i => i.st === 'blank').length;
        total += g.score; ok += g.ok; bad += g.bad; blank += g.blank;
    });
    G.total = r3(total); G.ok = ok; G.bad = bad; G.blank = blank;
    return G;
}

        const met = !!it.met[j];
        return `<div class="flex gap-2 items-start rounded-lg px-3 py-2 ${met ? 'bg-emerald-500/10 text-emerald-200' : 'bg-rose-500/10 text-rose-200'}">
          <i class="fa-solid ${met ? 'fa-circle-check' : 'fa-circle-xmark'} mt-0.5"></i><span class="flex-1 text-sm leading-relaxed">${c.t}</span>${c.p ? `<span class="text-xs text-slate-400 tabular-nums shrink-0">${fmt(c.p)} đ</span>` : ''}</div>`;
    }).join('');
    return `${rvHead(it, 'Câu')}<p class="text-slate-100 font-medium leading-relaxed mb-3">${q.q}</p>
      <div class="rounded-xl border border-slate-700 bg-slate-900/50 p-3.5 mb-3"><div class="text-xs text-slate-400 mb-1.5">Bài làm của bạn</div>
        ${text ? `<div class="text-sm text-slate-100 whitespace-pre-wrap leading-relaxed">${esc(text)}</div>` : '<div class="text-sm text-slate-500 italic">Chưa trả lời / chưa xác nhận</div>'}</div>
      <div class="rounded-xl border border-emerald-500/30 bg-emerald-500/5 p-3.5 mb-3"><div class="text-xs text-emerald-300 mb-1.5 font-semibold">Đáp án tham khảo</div>
        <div class="text-sm text-slate-100 leading-relaxed">${k.ref}</div></div>
      <div class="text-xs text-slate-400 mb-1.5">${sec === 'sa' ? 'Kiểm tra đáp án số' : 'Các ý được kiểm tra tự động theo từ khóa và chữ số thông thường'}</div>
      <div class="space-y-1.5">${crit}</div>${k.note ? expBox(k.note) : ''}`;
}

function reviewList(G, all) {
    let html = '', count = 0;
    SECS.forEach(s => {
        const items = G[s.id].items.filter(i => all || i.st !== 'ok');
        if (!items.length) return;
        count += items.length;
        html += `<h3 class="text-sm font-semibold text-indigo-300 mt-6 mb-3">${s.title}</h3><div class="space-y-4">` +
            items.map(it => `<article class="rounded-2xl border border-slate-800 bg-slate-800/50 p-5">${s.id === 'mcq' ? rvMCQ(it) : s.id === 'tf' ? rvTF(it) : rvText(it)}</article>`).join('') + `</div>`;
    });
    return { html, count };
}
function weakTopics(G) {
    const u = {};
    const add = (k, label) => { (u[k] = u[k] || []).push(label); };
    G.mcq.items.forEach(i => { if (i.st !== 'ok') add(QUESTIONS.mcq[i.qi].m, `TN ${i.pos + 1}`); });
    G.tf.items.forEach(i => i.res.forEach((r, j) => { if (r !== 'ok') add(QUESTIONS.tf[i.qi].m[j], `Đ/S ${i.pos + 1}${'abcd'[j]}`); }));
    G.sa.items.forEach(i => { if (i.st !== 'ok') add(QUESTIONS.sa[i.qi].m, `TLN ${i.pos + 1}`); });
    G.es.items.forEach(i => { if (i.st !== 'ok') QUESTIONS.es[i.qi].m.forEach(k => add(k, `TL ${i.pos + 1}`)); });
    return Object.entries(u).sort((a, b) => b[1].length - a[1].length);
}
function renderResult() {
    const G = grade(), tot = G.total;
    const msg = tot >= 8 ? ['Rất tốt! Bạn nắm vững kiến thức.', 'text-emerald-300'] : tot >= 6.5 ? ['Khá tốt, ôn thêm vài chỗ là chắc.', 'text-sky-300'] : tot >= 5 ? ['Đạt yêu cầu, cần củng cố thêm.', 'text-amber-300'] : ['Cần ôn lại các phần bên dưới.', 'text-rose-300'];
    const weak = weakTopics(G);
    const rv = reviewList(G, S.review);
    const stat = (n, label, cls) => `<div class="rounded-xl border border-slate-700 bg-slate-900/50 p-3 text-center"><div class="text-2xl font-bold ${cls}">${n}</div><div class="text-xs text-slate-400 mt-0.5">${label}</div></div>`;
    $('#app').innerHTML = `
    <section class="fade rounded-2xl border border-slate-800 bg-slate-800/40 p-5 md:p-7">
      <div class="text-xs font-medium text-emerald-400 mb-1">Sinh học 11 · Giữa kì I · Kết quả</div>
      <div class="flex flex-wrap items-center gap-6">
        <div class="w-32 h-32 rounded-full border-4 border-indigo-400/60 bg-indigo-500/10 flex flex-col items-center justify-center shrink-0">
          <div class="text-4xl font-extrabold text-white tabular-nums">${fmt(tot)}</div><div class="text-xs text-slate-400">/ 10 điểm</div></div>
        <div class="flex-1 min-w-[220px]"><h1 class="text-xl md:text-2xl font-bold ${msg[1]} mb-3">${msg[0]}</h1>
          <div class="grid grid-cols-3 gap-2">${stat(G.ok, 'Câu đúng / đủ ý', 'text-emerald-300')}${stat(G.bad, 'Câu sai / thiếu ý', 'text-rose-300')}${stat(G.blank, 'Chưa trả lời', 'text-slate-300')}</div></div>
      </div>
      <p class="ten>

    <section class="rounded-2xl border border-slate-800 bg-slate-800/40 p-5 md:p-6">
      <h2 class="font-bold text-white mb-4">Điểm từng phần</h2>
      <div class="space-y-4">` + SECS.map(s => {
        const g = G[s.id], pct = Math.round(g.score / g.max * 100);
        return `<div><div class="flex flex-wrap justify-between gap-2 text-sm mb-1.5"><span class="text-slate-200 font-medium">${s.title}</span>
          <span class="text-slate-400"><span class="text-emerald-300">${g.ok} đúng</span> · <span class="text-rose-300">${g.bad} sai</span> · ${g.blank} trống · <b class="text-white tabular-nums">${fmt(g.score)}/${g.max} đ</b></span></div>
          <div class="h-2 bg-slate-700/70 rounded-full overflow-hidden"><div class="h-2 rounded-full bg-gradient-to-r from-indigo-500 to-emerald-400" style="width:${pct}%"></div></div></div>`;
    }).join('') + `</div></section>

    <section class="rounded-2xl border border-slate-800 bg-slate-800/40 p-5 md:p-6">
      <h2 class="font-bold text-white mb-1">Gợi ý nội dung cần ôn lại</h2>
      <p class="text-xs text-slate-500 mb-4">Theo ma trận trong file soạn, sắp xếp theo số câu/ý bị mất điểm.</p>` +
      (weak.length ? `<div class="space-y-2">` + weak.map(([k, labs]) => `<div class="rounded-xl border border-slate-700 bg-slate-900/50 p-3.5">
          <div class="flex flex-wrap items-center gap-2 mb-1"><span class="text-xs px-2 py-0.5 rounded-full border ${LV[MATRIX[k].lv][1]}">${LV[MATRIX[k].lv][0]}</span><span class="text-xs text-slate-500">${labs.join(', ')}</span></div>
          <div class="text-sm text-slate-200 leading-relaxed">${MATRIX[k].t}</div></div>`).join('') + `</div>`
        : `<div class="text-sm text-emerald-300"><i class="fa-solid fa-circle-check mr-1"></i>Bạn trả lời đúng toàn bộ — không có nội dung cần ôn lại.</div>`) + `
    </section>

    <section class="flex flex-wrap gap-2">
      <button data-act="review" class="flex items-center gap-2 text-sm font-semibold px-4 py-2.5 rounded-xl text-white bg-gradient-to-br from-indigo-600 to-blue-700 hover:from-indigo-500 hover:to-blue-600 border border-indigo-400/30 transition-all"><i class="fa-solid fa-eye text-xs"></i>${S.review ? 'Chỉ xem câu làm sai' : 'Xem lại toàn bộ đáp án'}</button>
      <button data-act="restart" class="flex items-center gap-2 text-sm font-medium px-4 py-2.5 rounded-xl border border-slate-700 bg-slate-800 text-slate-200 hover:bg-slate-700/80 transition-all"><i class="fa-solid fa-rotate-left text-xs"></i>Làm lại bài</button>
      <button data-act="newtest" class="flex items-center gap-2 text-sm font-medium px-4 py-2.5 rounded-xl border border-emerald-500/40 bg-emerald-500/10 text-emerald-300 hover:bg-emerald-500/20 transition-all"><i class="fa-solid fa-shuffle text-xs"></i>Xáo trộn và làm đề mới</button>
      <button data-act="matrix" class="flex items-center gap-2 text-sm font-medium px-4 py-2.5 rounded-xl border border-slate-700 bg-slate-800 text-slate-200 hover:bg-slate-700/80 transition-all"><i class="fa-solid fa-table-list text-xs text-indigo-400"></i>Ma trận đề</button>
      <a href="${SUBJECT_HOME}" class="flex items-center gap-2 text-sm font-medium px-4 py-2.5 rounded-xl border border-indigo-800/50 bg-indigo-950/40 text-indigo-400 hover:text-indigo-300 hover:bg-indigo-900/50 transition-all"><i class="fa-solid fa-house text-xs"></i>Trang chủ môn học</a>
    </section>

    <section><h2 class="font-bold text-white text-lg">${S.review ? 'Toàn bộ đáp án và giải thích' : `Danh sách câu làm sai (${rv.count})`}</h2>
      ${rv.count ? rv.html : '<div class="mt-3 rounded-2xl border border-emerald-500/30 bg-emerald-500/5 p-5 text-sm text-emerald-300">Không có câu nào sai. Bấm “Xem lại toàn bộ đáp án” để đọc giải thích.</div>'}
    </section>`;
}

/* =====================================================================
   MA TRẬN ĐỀ
   ===================================================================== */
function openMatrix() {
    const u = {};
    const add = (k, l) => { (u[k] = u[k] || []).push(l); };
    QUESTIONS.mcq.forEach((q, i) => add(q.m, 'TN ' + (i + 1)));
    QUESTIONS.tf.forEach((q, i) => q.m.forEach((k, j) => add(k, `Đ/S ${i + 1}${'abcd'[j]}`)));
    QUESTIONS.sa.forEach((q, i) => add(q.m, 'TLN ' + (i + 1)));
    QUESTIONS.es.forEach((q, i) => q.m.forEach(k => add(k, 'TL ' + (i + 1))));
    const cnt = { NB: 0, TH: 0, VD: 0 };
    Object.entries(u).forEach(([k, l]) => cnt[MATRIX[k].lv] += l.length);
    const order = Object.keys(MATRIX);
    const rows = order.map(k => {
        const l = u[k], m = MATRIX[k];
        return `<tr class="border-t border-slate-800 ${l ? '' : 'opacity-60'}"><td class="py-2.5 pr-3 align-top text-slate-400 whitespace-nowrap">${k}</td>
          <td class="py-2.5 pr-3 align-top text-slate-200 leading-relaxed">${m.t}</td>
          <td class="py-2.5 pr-3 align-top"><span class="text-xs px-2 py-0.5 rounded-full border whitespace-nowrap ${LV[m.lv][1]}">${LV[m.lv][0]}</span></td>
          <td class="py-2.5 align-top text-slate-300">${l ? l.join(', ') : '<span class="text-slate-500 italic">Chưa có câu trong đề</span>'}</td></tr>`;
    }).join('');
    openModal(`<div class="flex items-start justify-between gap-3 mb-3"><div><h3 class="text-lg font-bold text-white">Ma trận đề ôn tập Sinh học 11</h3>
      <p class="text-xs text-slate-500 mt-1">Nội dung câu hỏi được biên soạn từ tài liệu ôn tập Sinh học do người dùng cung cấp. Mức độ suy ra từ động từ yêu cầu (nêu/phát biểu/xác định → nhận biết; trình bày/phân tích/hiểu → thông hiểu; vận dụng → vận dụng). Số câu theo đề gốc (TN: trắc nghiệm, Đ/S: đúng/sai, TLN: trả lời ngắn, TL: tự luận).</p></div>
      <button data-act="mclose2" class="w-8 h-8 shrink-0 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-300"><i class="fa-solid fa-xmark"></i></button></div>
      <div class="flex flex-wrap gap-2 mb-3 text-xs"><span class="px-2.5 py-1 rounded-full border ${LV.NB[1]}">Nhận biết: ${cnt.NB}</span><span class="px-2.5 py-1 rounded-full border ${LV.TH[1]}">Thông hiểu: ${cnt.TH}</span><span class="px-2.5 py-1 rounded-full border ${LV.VD[1]}">Vận dụng: ${cnt.VD}</span><span class="text-slate-500 self-center">(đếm theo câu / ý đúng-sai / câu tự luận)</span></div>
      <div class="overflow-x-auto"><table class="w-full text-sm min-w-[620px]"><thead><tr class="text-left text-xs text-slate-500"><th class="pb-2 pr-3 font-medium">Mục (file soạn)</th><th class="pb-2 pr-3 font-medium">Yêu cầu cần đạt</th><th class="pb-2 pr-3 font-medium">Mức độ</th><th class="pb-2 font-medium">Câu trong đề</th></tr></thead><tbody>${rows}</tbody></table></div>`, true);
}

/* =====================================================================
   HÀNH ĐỘNG
   ===================================================================== */
function submitNow() {
    if (S.submitted) return;
    S.submitted = true; S.review = false; save();
    closeModal(); renderResult(); window.scrollTo({ top: 0 });
}
function resetAnswers() { S.answers = freshAnswers(); S.manual = {}; S.confirmed = freshConfirmed(); S.submitted = false; S.review = false; S.section = 'mcq'; S.cur = { mcq: 0, tf: 0, sa: 0, es: 0 }; }
function go(delta) {
    const sec = S.section, i = SEC_IDS.indexOf(sec);
    if (delta > 0) { if (S.cur[sec] < N[sec] - 1) S.cur[sec]++; else if (i < 3) S.section = SEC_IDS[i + 1]; }
    else { if (S.cur[sec] > 0) S.cur[sec]--; else if (i > 0) { S.section = SEC_IDS[i - 1]; S.cur[S.section] = N[S.section] - 1; } }
    save(); renderTest(true);
}
document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const act = el.dataset.act, sec = S.section;
    if (act === 'mclose') { if (e.target === el) closeModal(); return; }
    if (act === 'mclose2') return closeModal();
    if (act === 'mok') { const cb = pendingOk; closeModal(); if (cb) cb(); return; }
    if (act === 'matrix') return openMatrix();
    if (act === 'crit') return; // không dùng checkbox chấm tay nữa
    if (act === 'confirm-text') {
        const targetSec = el.dataset.sec;
        if (!['sa', 'es'].includes(targetSec)) return;
        const qi = S.order[targetSec][S.cur[targetSec]], answer = String(S.answers[targetSec][qi] ?? '').trim();
        if (!answer) { toast('Bạn hãy nhập câu trả lời trước khi xác nhận.'); return; }
        if (targetSec === 'sa' && parseOneNumber(answer) === null) { toast('Trả lời ngắn chỉ chấp nhận đúng một số, ví dụ 6 hoặc 0.1.'); return; }
        S.confirmed[targetSec][qi] = true; save();
        renderCard(false); renderTop(); renderTabs(); renderNav();
        toast('Đã kiểm tra câu trả lời.');
        return;
    }
    if (act === 'review') { S.review = !S.review; save(); const y = window.scrollY; renderResult(); window.scrollTo({ top: y }); return; }
    if (act === 'restart') return ask('Làm lại bài?', 'Toàn bộ câu trả lời sẽ bị xóa để làm lại từ đầu. Thứ tự câu hiện tại được giữ nguyên.', 'Làm lại', () => { resetAnswers(); save(); renderTest(true); window.scrollTo({ top: 0 }); toast('Đã bắt đầu làm lại'); }, true);
    if (act === 'newtest') return ask('Xáo trộn và làm đề mới?', 'Câu trả lời hiện tại sẽ bị xóa, thứ tự câu và phương án A/B/C/D được xáo trộn lại.', 'Làm đề mới', () => { resetAnswers(); S.shuffleOn = true; applyOrder(); save(); renderTest(true); window.scrollTo({ top: 0 }); toast('Đã tạo đề mới'); }, true);
    if (S.submitted) return;
    if (act === 'tab') { S.section = el.dataset.sec; save(); return renderTest(true); }
    if (act === 'goto') { S.cur[sec] = +el.dataset.i; save(); renderCard(true); renderFoot(); renderNav(); return; }
    if (act === 'prev') return go(-1);
    if (act === 'next') return go(1);
    if (act === 'pick') {
        const qi = S.order.mcq[S.cur.mcq], oi = +el.dataset.oi;
        if (S.answers.mcq[qi] !== undefined) return;
        S.answers.mcq[qi] = oi; save(); renderCard(false); refreshChrome(); return;
    }
    if (act === 'tf') {
        const qi = S.order.tf[S.cur.tf], key = qi + '-' + el.dataset.k, v = el.dataset.v === 'true';
        if (S.answers.tf[key] !== undefined) return;
        S.answers.tf[key] = v;
        save(); renderCard(false); refreshChrome(); return;
    }
    if (act === 'shuf-toggle') { S.shuffleOn = !S.shuffleOn; applyOrder(); save(); renderTest(true); toast(S.shuffleOn ? 'Đã bật xáo trộn – câu trả lời được giữ nguyên' : 'Đã tắt xáo trộn – trở về thứ tự gốc'); return; }
    if (act === 'shuf-again') { applyOrder(); save(); renderTest(true); toast('Đã xáo trộn lại'); return; }
    if (act === 'submit') {
        const left = 35 - totalAnswered();
        return ask('Nộp bài?', left > 0 ? `Bạn còn <b class="text-amber-300">${left}</b> câu chưa hoàn thành. Sau khi nộp sẽ không thể sửa đáp án.` : 'Bạn đã hoàn thành tất cả các câu. Sau khi nộp sẽ không thể sửa đáp án.', 'Nộp bài', () => submitNow());
    }
});
document.addEventListener('input', e => {
    if (S.submitted) return;
    const ta = e.target.closest('textarea[data-ta]');
    if (ta) { S.answers[ta.dataset.ta][ta.dataset.i] = ta.value; save(); renderTop(); renderTabs(); renderNav(); return; }
    const num = e.target.closest('input[data-num]');
    if (num) { S.answers[num.dataset.num][num.dataset.i] = num.value; save(); renderTop(); renderTabs(); renderNav(); }
});
document.addEventListener('change', e => {
    const cb = e.target.closest('input[data-act="crit"]'); if (!cb) return;
    S.manual[cb.dataset.k] = cb.checked; save();
    const y = window.scrollY; renderResult(); window.scrollTo({ top: y });
});
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });
window.addEventListener('pagehide', save);
window.addEventListener('beforeunload', save);

/* =====================================================================
   KHỞI ĐỘNG
   ===================================================================== */
if (S.submitted) renderResult(); else { renderTest(true); if (totalAnswered() > 0) toast('Đã khôi phục bài làm đang dở'); }
</script>
</body>
</html>
